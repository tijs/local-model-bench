model: mlx-community/gemma-4-26b-a4b-it-4bit
# Mei — the native Swift/MLX serving engine (see ~/projects/mei). This is the
# MLX row for Gemma 4 26B-A4B IT, the first MLX leg in this repo for the
# Gemma-4-26B-A4B lineup (its siblings are GGUF-only: gguf-apex-i-compact.yaml,
# gguf-apex-i-quality.yaml). Same base model (google/gemma-4-26B-A4B-it);
# different quant family from the mudler APEX legs — recorded as a caveat.
#
# Temperature/reasoning mirror configs/Gemma-4-26B-A4B/gguf-apex-i-quality.yaml
# (temp 1.0, reasoning unspecified) so the cross-engine comparison holds
# settings constant.
temperature: 1.0
reasoning_mode: unspecified
inference_engine: mei
mei_commit: 91fed8be21319f92ce5220622c6dcde0b851bdae  # vmlx-swift pin (exact, Mei Package.resolved)
source_revision: main  # resolved at staging 2026-09-01; config_sha256 419e13a2… is the immutable pin
model_bytes: 15341205776
quant_family: MLX 4-bit affine g64 (mlx-community, gemma4 arch)
context_cap: 65536
prefill_step_size: 256
tool_call_path: native_mei_requires_live_probe

benchmark_launch_command: |
  env VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/gemma-4-26b-a4b-it-4bit \
    --served-model-id mlx-community/gemma-4-26b-a4b-it-4bit --port 8027 --context-cap 65536 \
    --prefill-step-size 256 --max-tokens 32768 \
    --temperature 1.0 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true
benchmark_endpoint: http://127.0.0.1:8027/v1

orchestration:
  raw_port: 8027
  needs_proxy: false   # native tool_calls required; probe_mei.py gates this.
  hermes_provider: bench-mei-gemma   # custom_providers entry created during the run
  served_model_id: mlx-community/gemma-4-26b-a4b-it-4bit
  viable: full

settings:
  - name: artifact_identity
    value: "mlx-community/gemma-4-26b-a4b-it-4bit @ main (resolved 2026-09-01; config_sha256 419e13a27ec359654c1ce7dd06d1a87149fd07d0c8af9f770494185e62e1b2ba), 15341205776 bytes, 3 safetensors shards, staged at ~/.local/share/local-model-bench/mei-models/gemma-4-26b-a4b-it-4bit"
    source: "mei-models/gemma-4-26b-a4b-it-4bit.provenance.json."
  - name: vmlx_swift_pin
    value: "91fed8be21319f92ce5220622c6dcde0b851bdae (Mei Package.resolved, tijs/vmlx-swift fork)"
    source: "~/projects/mei/Package.resolved, checked 2026-09-04."
  - name: prefill_chunking
    value: "GenerateParameters.prefillStepSize = 256 — the proven Gemma config from the Mei repo prefill-step sweep (30k fresh fill 318-349 pps with the fuse-gate env, +37% vs fuse-ON 229-266 pps; short decode 51.3 t/s)"
    source: "Mei repo gemma4-prefill-step-sweep-20260903.md + gemma4-fuse-gate-ab-20260904.md."
  - name: fused_gate_up_cache_disabled
    value: "REQUIRED env VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0: gemma4's SwitchGLU layers (switch_glu, Gemma4Text.swift) build the lazy fused gate+up concat bank (SwitchLayers.swift ensureFusedGateUp) on first forward — measured 2026-09-04 that it retained ~8.5 GB and collapsed 30k decode to 7.1-7.6 t/s. With the env set: 30k fresh decode 16.96/23.27/23.33 t/s (mean 21.19), reuse 15.27/19.51/23.83, prefill 318/349/349 pps, peak 18.76 GB (-8.47 GB); probe_mei 12/12 + coding 4/4 re-gated on this config. Launch command carries the env."
    source: "Mei repo artifacts/gemma4-fuse-gate-ab-20260904.md + probe-30k-gemma-fuseoff-r{1,2,3}-*.json + probe-mei-gemma4-fuseoff-regate-*.json."
  - name: kv_cache
    value: "fp16 KV; hybrid attention = 25 sliding-window layers (window 1024, ring cap) + 5 full/global layers — KV ~1.5 GB at 64K, does NOT grow with context on the windowed layers. --kv-bits 8 CRASHES this architecture (KVCache.swift:1209 updateQuantized gap, vmlx-side blocker); kv-bits stays none."
    source: "Mei repo gemma4-30k-decode-lever-matrix-20260904.md (kv-quant leg)."
  - name: context_and_generation_caps
    value: "65536 prompt tokens (exact-cap gate); up to 32768 generated tokens"
    source: "Mei ServerConfig; probe_mei.py exact-token gate."
  - name: in_process_kv_reuse
    value: "exact-extension token-prefix slot; usage.prompt_tokens_details.cached_tokens reports the reused prefix"
    source: "Mei Engine SlotDecision (cache-reuse true); probe cache_repeat probes."
  - name: native_tool_call_parser
    value: "must pass both non-streaming and streaming add_numbers schema probes (schema-aware JSON type normalization — plan todo 0b87b76a#7/9 contract); no benchmark proxy/parser shim allowed"
    source: "runner/probe_mei.py; Mei repo gemma4-tool-api-contract-20260903.md."
  - name: cross_engine_parity
    value: "Same-suite GGUF reference leg (mudler APEX-I-Quality, llama.cpp) exists in Mei repo: gguf-ref-gemma4-apexq-20260903.json — caveat: APEX quant vs standard 4-bit affine are different quant recipes; the #14 comparison must call this out (same model, different quant families)."
    source: "Mei repo gemma4-gguf-ab-20260903.md."

known_gaps:
  - "Live status and artifact paths are recorded in ~/.local/share/local-model-bench/results-mei/ after the acceptance gate; config existence alone is not proof of compatibility."
  - "KV quantization (--kv-bits 8) crashes this architecture in pinned vmlx (KVCache.swift:1209); kv-bits none is the only safe option."
  - "Metal kernel library (mlx.metallib) is provisioned by scripts/prepare_metallib.sh (adjacent-version Python mlx wheel; local Xcode lacks the metallib archiver)."
  - "30k loaded decode ~21.2 t/s (3-repeat mean; r2/r3 23.3) with the fuse-gate env — still ~1.6x below the llama.cpp APEX-I-Quality row (37.08 t/s); residual gap is the vmlx SDPA/long-KV kernel efficiency on the 5 full-attention layers (lever matrix + fuse-gate A/B), outside the Mei config surface. Short-context decode 51 t/s. KV-quant crashes (--kv-bits 8, KVCache.swift:1209) and compiled-decode is a silent no-op on this arch — both vmlx-side blockers recorded."
  - "Bench runtime build provenance (2026-09-04): the mei-build scratch dir resolves vmlx-swift from the LOCAL /Users/tijs/projects/vmlx-swift clone (HEAD 318a4e68 as of 2026-09-04, i.e. the pinned fork 91fed8be + 1 cache-fix commit), not the remote pin — verified via embedded source paths in the served binary. The pinned scratch build mei-build-pinned-91fed8be restores exact-revision servers. A bench build also rewrites ~/projects/mei/Package.resolved (drops the vmlx-swift remote entry); restore from git if it drifts."
