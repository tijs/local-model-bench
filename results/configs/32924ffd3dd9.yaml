model: JonathanColetti/Qwen3.8-27B-Uncensored-GGUF:Q4_K_M
# Added 2026-08-24 (user request): "an abliterated/uncensored variant" of
# Qwen3.8-27B, tested at the same time as bumping the base model
# (configs/Qwen3.8-27B/gguf.yaml) to full and adding a speed-tactic
# sibling (configs/Qwen3.8-27B/gguf-mtp-speed.yaml). Checked HF download
# counts across every uncensored/abliterated Qwen3.8-27B GGUF found
# (2026-08-24): this repo (1,334,820 downloads, 654 likes — the single
# most-liked and most-downloaded candidate found) was the clear most-used
# one, ahead of huihui-ai (943,360, normally the most-established
# abliteration brand), 0bserverx (579,334), and orcarouter (108,666).
# This build's own documentation also states it retains and verifies the
# base model's MTP (multi-token prediction) draft head, which is why it
# was picked over alternatives with no such note — keeps this config
# directly comparable to gguf-mtp-speed.yaml if that speed tactic is ever
# tried against this fine-tune too.
temperature: 1.0
reasoning_mode: thinking
reasoning_effort: medium
  # Added 2026-08-27 (user request: label reasoning effort clearly) --
  # this was NEVER explicitly passed via a --reasoning-effort flag for
  # this config; it's the chat_template.jinja fix's OWN hardcoded
  # default (see that file's _effort_raw line) whenever the flag is
  # absent. Every benchmark result on record for this config was
  # produced at this effort level, silently, until this field made it
  # explicit -- not a claim that medium is optimal, just documenting
  # what actually ran. See the Kiem benchmark-v2 plan note for the
  # follow-up idea of testing other effort levels for this family.
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo JonathanColetti/Qwen3.8-27B-Uncensored-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 20 \
    --ctx-size 65536 \
    --jinja --chat-template-file configs/Qwen3.8-27B/chat_template.jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls expected (same Qwen-family precedent as
  # configs/Qwen3.8-27B/gguf.yaml) — NOT independently verified live yet.
  # Spot-check before trusting hermes_ops/coding results. Also unverified:
  # whether the uncensoring fine-tune changed tool-call formatting, or
  # whether it needs the same community chat_template.jinja fix the base
  # model required — reusing that same file defensively since this is the
  # same base architecture, but this hasn't been confirmed necessary (vs.
  # just harmless) for this specific fine-tune.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen38-uncensored-gguf
  viable: full

settings:
  - name: quant
    value: Q4_K_M (JonathanColetti/Qwen3.8-27B-Uncensored-GGUF)
    source: "https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF"
  - name: fine-tune method (uncensoring)
    value: "Abliteration (refusal-direction ablation, per the Arditi et al.
      2024 approach also used by huihui-ai/0bserverx/orcarouter's
      competing builds) — removes the model's tendency to refuse, base
      weights otherwise unchanged. This repo's own docs additionally note
      the MTP draft head was retained and verified intact through the
      abliteration process."
    source: "https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF"
  - name: architecture
    value: "Dense 27B, identical to the base Qwen3.8-27B
      (configs/Qwen3.8-27B/gguf.yaml) — only the fine-tune differs."
  - name: ctx-size
    value: 65536
    source: "Same reasoning as the base config's ctx-size entry — see
      configs/Qwen3.8-27B/gguf.yaml's `settings:` for the original OOM
      history at auto-sizing and why 65536 (not the crashed 112128) is
      the safe explicit value."
  - name: temperature / top_p / top_k (thinking mode)
    value: 1.0 / 0.95 / 20
    source: "Same as configs/Qwen3.8-27B/gguf.yaml — no separate sampling
      guidance published for this fine-tune specifically, so inheriting
      the base model's card-recommended settings rather than guessing."
  - name: chat_template (community fix, inherited defensively)
    value: "Same file as configs/Qwen3.8-27B/gguf.yaml uses
      (configs/Qwen3.8-27B/chat_template.jinja, originally from
      https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates) — NOT
      confirmed necessary for this specific fine-tune's own shipped
      template, applied defensively since it's the same base
      architecture that needed it."

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — these
    model-card-recommended settings only apply to the hermes-chat-driven
    coding suites, per this benchmark's established design (see
    tasks/SCHEMA.md)."
  - "Native tool_calls format not independently verified live for this
    specific model+backend — confirm before trusting results."
  - "Whether this fine-tune actually needs the borrowed chat_template.jinja
    fix (vs. its own shipped template already being correct) is untested
    — if tool-calling looks structurally broken on first run, try removing
    --jinja --chat-template-file first before assuming a deeper problem."
  - "No independent benchmark comparing this fine-tune's coding/tool-use
    capability against the base Qwen3.8-27B was found at config-creation
    time — the repo's description focuses on the abliteration method and
    MTP-head verification, not task performance. Treat any capability gap
    seen in this benchmark's own hermes_ops/coding results as new
    evidence, not confirmation of anything already claimed."
  - "This benchmark exists to evaluate models for Hermes (a coding-agent
    framework), not for uncensored-content generation — 'uncensored' is
    orthogonal to (and should not be conflated with) coding/tool-use
    quality. Report this config's hermes_ops/coding results on their own
    merits, same as any other config."

last_updated: 2026-08-24
last_verified_against_docs: 2026-08-24
