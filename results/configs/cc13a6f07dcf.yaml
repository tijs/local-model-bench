    value: >-
      Preparation choices, NOT vendor recommendations or proven safe settings:
      context 65536 (benchmark coding ceiling; below native 262144), one slot,
      full 99-layer Metal offload, flash attention ON, batch 512/microbatch
      128, f16 K/V. --cache-prompt retains within-slot prefix reuse while
      --cache-ram 0 disables the otherwise 8192 MiB RAM checkpoint cache.
      Loopback 8017, no Web UI, offline local-file loading, no projector,
      draft model, DSpark, LES, external template, or download flags.
      Server timeout 1800 is inherited benchmark policy, not a raised task
      budget. All resource/functional gates remain mandatory before scoring.
    source: "configs/README.md ; runner/bench_common.py ; https://github.com/ggml-org/llama.cpp/blob/1268edac579110aeb1407f7928f53193ed4e28d4/common/arg.cpp ; local llama-server --help"
