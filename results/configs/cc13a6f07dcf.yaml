      recommendation. Server flags supply the coding baseline; hermes_ops
      selects the identical instruct request profile; sanity retains the
      harness-forced temperature 0. No reasoning effort is asserted or sent.
    source: "https://huggingface.co/openbmb/MiniCPM-V-4.7-35B-A3B/blob/0bbda78419a0b505a58234574ff40b1c344a86fc/README.md#recommended-sampling-parameters ; https://huggingface.co/openbmb/MiniCPM-V-4.7-35B-A3B/blob/0bbda78419a0b505a58234574ff40b1c344a86fc/generation_config.json ; configs/README.md ; runner/run_prompt_suite.py ; https://github.com/ggml-org/llama.cpp/blob/1268edac579110aeb1407f7928f53193ed4e28d4/common/common.h"
  - name: sampler_order_and_penalty_window
    value: >-
      Explicit penalties;temperature;top_k;top_p;min_p order applies
      temperature before truncation, rather than inheriting llama.cpp's
      default temperature-last order. Only these samplers are active;
