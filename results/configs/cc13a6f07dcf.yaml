    source: "https://github.com/ggml-org/llama.cpp/blob/1268edac579110aeb1407f7928f53193ed4e28d4/common/arg.cpp ; https://github.com/ggml-org/llama.cpp/blob/1268edac579110aeb1407f7928f53193ed4e28d4/common/sampling.cpp ; local llama-server --help"
