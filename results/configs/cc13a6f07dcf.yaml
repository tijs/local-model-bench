    value: >-
      Use the pinned card's Recommended Sampling Parameters for instruct:
      temperature 0.7, top_p 0.95, top_k 100, min_p 0, presence_penalty 0,
      repetition_penalty 1.03. Its generation_config.json instead contains
      temperature 1.0/top_k 20; the explicit instruct recommendation wins.
