model: HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4_K_M
# Added 2026-08-23 (user request): "a popular uncensored version" of
# Qwen3.6-35B-A3B, correcting an earlier misread of the request as
# wanting a pruned/"debloated" variant instead — see
# configs/Qwen3.6-35B-A3B/gguf.yaml for the un-modified base model this
# is a fine-tune of. Checked HF download counts across every
# uncensored/abliterated Qwen3.6 GGUF found (2026-08-23): huihui-ai
# (64,165 downloads, normally the most-established abliteration brand)
# and Youssofal (16,038) were both dwarfed by this repo (2,456,867
# downloads, 3,504 likes — the single most-liked candidate found) and
# DavidAU's dense-27B equivalent (2,852,257 downloads). Picked this one
# over DavidAU's specifically to stay in the A3B MoE architecture family
# already fast on this hardware (Ornith-1.5-35B-A3B, Qwen3-Coder-30B-A3B,
# Qwen3.6-35B-A3B).
temperature: 0.6
reasoning_mode: thinking
hermes_ops_max_tokens: 16384
  # Added 2026-08-31 (benchmark-v4 hermes_ops quick fix): thinking-mode
  # model, same precautionary reasoning as the Qwen3.8-27B family's own
  # configs (gguf-unsloth-ud-q5-64k.yaml, gguf-heretic-q5.yaml) -- the
  # default 4096-token hermes_ops cap risks truncating this family before
  # a final answer, since hermes_ops's one-shot run_prompt.py client (unlike
  # the coding suites' real `hermes chat` agentic loop) has no
  # finish_reason=length continuation logic. Not yet confirmed live for
  # THIS specific model (never run before), applied defensively.
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 \
    --ctx-size 65536 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls expected (same Qwen-family precedent as
  # Qwen3.6-35B-A3B/gguf.yaml) — NOT independently verified live yet.
  # Spot-check before trusting hermes_ops/coding results. Also unverified:
  # whether the uncensoring fine-tune changed tool-call formatting or
  # instruction-following behavior at all vs the base model.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen36-uncensored-gguf
  viable: full

settings:
  - name: quant
    value: "Q4_K_M, 21GB on disk (per repo file listing)"
    source: "https://huggingface.co/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
  - name: fine-tune method ('Aggressive' uncensoring)
    value: "Publisher's own description: 'Stronger uncensoring — model is
      fully unlocked and won't refuse prompts. May occasionally append
      short disclaimers (baked into base model training, not refusals)
      but full content is always generated.' Base architecture/weights
      otherwise unchanged from Qwen3.6-35B-A3B."
    source: "https://huggingface.co/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
  - name: architecture
    value: "MoE, 35B total / ~3B active per token — identical to the base
      Qwen3.6-35B-A3B (configs/Qwen3.6-35B-A3B/gguf.yaml); only the
      fine-tune differs."
    source: "https://huggingface.co/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
  - name: temperature / top_p / top_k / min_p (thinking mode, precise coding preset)
    value: 0.6 / 0.95 / 20 / 0.0
    source: "Same as configs/Qwen3.6-35B-A3B/gguf.yaml — no separate
      sampling guidance published for this fine-tune specifically, so
      inheriting the base model's card-recommended precise-coding preset
      rather than guessing. Publisher's own notes mention 0.6-1.0
      depending on task and recommend keeping context >=128K to preserve
      reasoning — this benchmark's 65536 ceiling is below that
      recommendation, same tradeoff already accepted for every other A3B
      config here (hermes's coding-suite context needs vs this model
      family's ideal context)."
  - name: context_length
    value: 65536 (same reasoning as configs/Qwen3.6-35B-A3B/gguf.yaml)
    source: "AGENTS.md hermes hard-minimum note."

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — see
    configs/Qwen3.6-35B-A3B/gguf.yaml's known_gaps, same caveat applies."
  - "Native tool_calls format not independently verified live for this
    specific model+backend — confirm before trusting results."
  - "No independent benchmark comparing this fine-tune's coding/tool-use
    capability against the base Qwen3.6-35B-A3B was found at
    config-creation time — the publisher's description focuses entirely
    on uncensoring behavior, not task performance. Treat any capability
    gap seen in this benchmark's own hermes_ops/coding results as new
    evidence, not confirmation of anything already claimed."
  - "This benchmark exists to evaluate models for Hermes (a coding-agent
    framework), not for uncensored-content generation — 'aggressive
    uncensoring' is orthogonal to (and should not be conflated with)
    coding/tool-use quality. Report this config's hermes_ops/coding
    results on their own merits, same as any other config, without
    treating uncensoring as a coding-relevant feature one way or the
    other."

last_updated: 2026-08-23
last_verified_against_docs: 2026-08-23
