model: ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF:CD-IQ4_K_M
# EXPLORATORY / UNRANKED — ManniX-ITA community CD-IQ4_K_M llama.cpp arm of the
# post-Mei-0.5.0 Qwen3.6 research track. The first full current-methodology
# attempt was an INTERRUPTED 13/25 leg under pre-run config hash 02c0f591926b
# and runner 91c123cb02a0 (2026-09-16; inventory in
# artifacts/qwen36-mannix-cd-iq4km-interrupted-20260916.md); its pre-run
# snapshot results/configs/02c0f591926b.yaml and that interruption marker
# exist. A second current-suite attempt was an INTERRUPTED 18/25 leg under
# pre-run config hash 71b86463d35f and runner a018d59cefab (2026-09-16;
# inventory in artifacts/qwen36-mannix-cd-iq4km-interrupted-run2-20260916.md,
# with copied server log; its immutable snapshot
# results/configs/71b86463d35f.yaml exists). Both legs are partial. The config
# is therefore ranked nowhere until a fresh COMPLETE
# current-suite run lands (the 25-row default battery: sanity 2 + hermes_ops 8
# + kiem_mini 5 + hearth_mini 3 + kipclip_mini 4 + hearth_full 3 —
# run_bench.py --coding-suites default since 2026-08-25). Do
# not treat any claim in this file as a quality or benchmark result — only as
# artifact + setup provenance, exactly like the adjacent Qwen3.6-35B-A3B
# control arms.
#
# What this arm is: a community (non-ggml-org) Q4_K_M conversion of
# Qwen3.6-27B-A3B-Coder-MTP — the 27B-A3B coder-oriented checkpoint with MTP
# in the family name — pinned at an immutable HF revision and served on plain
# mainline llama.cpp, mirroring the launch-control set of the existing
# configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml control arm. It is a
# FIRST-CLASS separate candidate (its own blob, revision, quant variant, and
# served identity), NOT a variant of the 35B config. Admission evidence comes
# from the 2026-09-16 gate
# (artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md + its three raw
# artifacts): exact-identity, plain, streaming, and native-tool probes all
# PASSED; a six-task exploratory canary passed 5/6 with one explicit
# max_tokens=4096 truncation. Gate evidence is NOT ranking evidence.
#
# No quality/throughput numbers are claimed anywhere in this file. The runner
# re-gates identity at run time anyway (assert_serving_expected_model with a
# runner-appended bench-<config-hash> identity alias + a plain-completion
# probe), so a future run re-verifies independently.
temperature: 0.6
reasoning_mode: thinking   # --reasoning on (explicit llama-server flag, gate-proven 2026-09-16)
hermes_ops_max_tokens: 16384
  # Defensive thinking-mode cap, same pre-emptive rationale and value as
  # configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml (benchmark-v4 hermes_ops
  # fix): run_prompt_suite.py's one-shot hermes_ops client has no
  # finish_reason=length continuation, so the default 4096-token cap risks
  # truncating this thinking-mode family before a final answer. The gate's
  # one observed truncation (kiem_mini-testwrite, finish_reason=length at the
  # canary harness's max_tokens=4096) was in a CODING-suite task, not a
  # hermes_ops run — this cap only shapes hermes_ops via run_prompt_suite,
  # and it stays defensive: both partial 2026-09-16 legs (13/25 and 18/25)
  # exercised it — all 8 hermes_ops rows per leg, 7 passed and one truncation
  # at max_tokens=16384 per leg (see known_gaps) — pending a fresh complete
  # 25-row run and review.
inference_engine: llama.cpp   # plain mainline llama.cpp — same control binary
                              # family as the 35B arm, NOT a fork/spec build;
                              # see orchestration.server_binary + settings
source_revision: 75a75137d610ed037a09b46c29ca1d37fd000f2e  # ManniX-ITA repo rev (immutable),
                              # pinned at download; verified on-disk + via gate 2026-09-16
model_bytes: 16702973408
quant_family: GGUF Q4_K_M (ManniX-ITA community CD-IQ4_K_M k-quant, single-file, 16.7 GB)
context_cap: 65536

benchmark_launch_command: |
  # Absolute binary + absolute local model path so THIS machine reproduces it
  # exactly. Binary: official ggml-org/llama.cpp mainline build produced by
  # runner/setup_dspark_head.sh into runner/.dspark-head (gitignored, NOT
  # committed) — commit a302733, build 1, 2026-08-23, AppleClang 21.0.0
  # arm64 (`llama-server --version` re-verified 2026-09-16); see
  # settings/binary_build_provenance and orchestration.server_binary.
  # Model: local HF hub-cache snapshot of the verified public artifact
  # (already staged; do not re-download, do not use --hf-repo):
  #   repo ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF, revision
  #   75a75137d610ed037a09b46c29ca1d37fd000f2e, file
  #   Qwen3.6-27B-A3B-Coder-CD-IQ4_K_M.gguf, 16702973408 bytes, sha256
  #   6f1735c73f77d5ffb9551a30dee30d3f82a790442697950c4ed4f9bbecea6c22
  #   (recomputed on-disk 2026-09-16 for this config task — blob == symlink
  #   target == HF LFS oid; see settings/artifact_identity).
  # The launch control set below is byte-for-byte the 2026-09-16 gate's
  # authorized set (minus the gate-only identity alias, which is documented
  # in settings/served_identity_and_identity_gate). The runner appends its
  # own bench-<config-hash> identity alias to the last command line, and its
  # guard refuses a launch block that already sets a sampling seed (the check
  # is a substring scan over the whole block, comments included — so this
  # comment must not name that flag literally). Keep the last line a plain
  # flag with no trailing backslash.
  /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server \
    --model /Users/tijs/.cache/huggingface/hub/models--ManniX-ITA--Qwen3.6-27B-A3B-Coder-MTP-GGUF/snapshots/75a75137d610ed037a09b46c29ca1d37fd000f2e/Qwen3.6-27B-A3B-Coder-CD-IQ4_K_M.gguf \
    --host 127.0.0.1 --port 8017 \
    --ctx-size 65536 --parallel 1 --n-gpu-layers 99 --flash-attn on \
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 \
    --jinja --reasoning on --cache-prompt \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Native tool_calls CONFIRMED for this exact binary+model combo by the
  # 2026-09-16 gate — non-streaming AND streaming add_numbers probes both
  # returned name add_numbers / arguments {"a":15,"b":27} /
  # finish_reason tool_calls (artifacts/qwen36-mannix-cd-iq4km-stream-gate-
  # 20260916.json) — no proxy needed, same family precedent as the 35B arm.

orchestration:
  raw_port: 8017          # shared with every other llama.cpp config — never
                          # run two local backends concurrently (unload_all.sh
                          # discipline); see known_gaps
  needs_proxy: false
  hermes_provider: qwen36-35b-gguf   # REUSED existing bench-profile entry —
    # verified 2026-09-16: api http://127.0.0.1:8017/v1, context_length 65536
    # (>= hermes's 64K coding minimum), transport chat_completions. It is
    # PORT-SHARED by design: this config binds the same 8017 endpoint the
    # provider points at, so provider state is only meaningful one-backend-at-
    # a-time. Its default_model still names the retired unsloth UD-Q4_K_XL id
    # — cosmetic: llama-server serves the loaded model regardless of the
    # requested model id, and the identity that actually matters is
    # run_bench.py's exact served-identity gate, which uses its own
    # runner-appended bench-<config-hash> identity alias
    # (run_bench.server_command + assert_serving_expected_model, H2/H5).
  server_binary: /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server
    # NOT the Homebrew llama.cpp (build 10470 / commit 34af94cd9, 2026-08-17).
    # This is the official ggml-org/llama.cpp mainline source build at commit
    # a302733 ("metal : clamp K extent in tensor API mat-mat kernel for K not
    # a multiple of 32 (#27450)", 2026-08-23) — newer than the bottle, built
    # via runner/setup_dspark_head.sh into runner/.dspark-head/ (gitignored).
    # Same codebase family as Homebrew's llama-server (official mainline, no
    # fork patches), so results stay comparable to historical `llama.cpp`
    # rows; the provenance is recorded because a build-commit gap is a real
    # confound if a comparison gets close.
  viable: full            # EXPLORATORY arm: runnable, but UNRANKED until a
    # fresh COMPLETE 25-row current-suite run exists (the two 2026-09-16
    # attempts were interrupted — 13/25 under hash 02c0f591926b / runner
    # 91c123cb02a0 and 18/25 under hash 71b86463d35f / runner a018d59cefab;
    # see known_gaps). Same convention as the 35B control arm and the
    # DWQ/mixed46 Mei arms (viable: full to stay runnable, banner in
    # known_gaps).

settings:
  - name: artifact_identity
    value: "ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF revision 75a75137d610ed037a09b46c29ca1d37fd000f2e, file Qwen3.6-27B-A3B-Coder-CD-IQ4_K_M.gguf, 16702973408 bytes, sha256 6f1735c73f77d5ffb9551a30dee30d3f82a790442697950c4ed4f9bbecea6c22. Re-verified on-disk 2026-09-16 during this config task: shasum -a 256 of the local blob equals the HF blob-store name, which equals the snapshots/<revision> symlink target — one authoritative value. Local snapshot: ~/.cache/huggingface/hub/models--ManniX-ITA--Qwen3.6-27B-A3B-Coder-MTP-GGUF/snapshots/75a75137d610ed037a09b46c29ca1d37fd000f2e/Qwen3.6-27B-A3B-Coder-CD-IQ4_K_M.gguf (symlink -> ../../blobs/6f1735c73f77d5ffb9551a30dee30d3f82a790442697950c4ed4f9bbecea6c22). Revision immutable and confirmed by the 2026-09-16 gate (staged + served from this exact snapshot path)."
    source: "https://huggingface.co/ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF/commit/75a75137d610ed037a09b46c29ca1d37fd000f2e + local `shasum -a 256` of the blob (recomputed 2026-09-16) + artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md."
  - name: quant (why this community CD-IQ4_K_M is a separate arm)
    value: "Q4_K_M — llama.cpp's canonical k-quant medium variant (CD = community distribution suffix used by this converter; per ggml-org/llama.cpp GGUF quantization docs, Q4_K for ~2/3 of tensors and Q6_K for the rest). NOTES: (1) this is a MANNIX-ITA community conversion of the 27B-A3B coder checkpoint, not an official ggml-org artifact — comparing it to the ggml-org 35B-A3B official arm is a model-family AND artifact-source change, not a head-to-head quant comparison; (2) no importance-matrix (imatrix) calibration is claimed here — vanilla Q4_K_M is not an imatrix-calibrated quant, and that distinction is left to the i-quant family; (3) 'MTP' in the repo/family name is NOT enabled as llama.cpp speculative decoding here — this config serves the single GGUF file plain, with no draft-model flag; a hypothetical MTP draft path would be a separate config. All of this is provenance about which binary artifact is pinned, not a quality claim."
    source: "ManniX-ITA repo card (family/quant naming, informational only); ggml-org/llama.cpp GGUF quantization docs; this config's own launch block (no draft/spectulative flag present)."
  - name: temperature / top_p / top_k / min_p (thinking mode, precise coding preset)
    value: 0.6 / 0.95 / 20 / 0.0
    source: "Inherited unchanged from configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml (same Qwen3.6 family, same thinking-mode working point), which cited unsloth's Qwen3.6 'Thinking Mode - Precise Coding' preset (https://unsloth.ai/docs/models/qwen3.6): top_p/top_k/min_p identical to the general thinking preset, temperature 1.0 -> 0.6. Deliberately NOT the non-thinking instruct preset (temp 0.7, presence penalty 1.5): thinking stays ON, matching the model's benchmarked mode. The 2026-09-16 gate launched with exactly these four values."
  - name: thinking / reasoning mode mechanism
    value: "--reasoning on (explicit llama-server flag, present in the pinned binary's --help). Qwen3.6's default chat template also enables thinking by default, but the 2026-09-16 gate launched with --reasoning on and produced reasoning + native tool calls, so that exact flag is the proven-working explicit setting for this binary — same conclusion as the 35B arm. Recorded as its own labeled setting per this repo's standing policy that reasoning mode is never implicit."
    source: "2026-09-16 gate launch controls (artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md) + the durable gate server log (artifacts/qwen36-mannix-cd-iq4km-gate-20260916-server.log) + AGENTS.md reasoning-mode policy."
  - name: context_length
    value: "65536 (native larger; capped at this repo's standard benchmark ceiling and hermes's >=64K hard minimum, same as every A3B config). The gate server log confirms n_ctx_slot = 65536 for this exact model on this binary."
    source: "AGENTS.md hermes hard-minimum note; gate server log (n_ctx_slot = 65536); model card."
  - name: served_identity_and_identity_gate
    value: "Exact served identity observed by the 2026-09-16 gate: /v1/models served_ids = [ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF:CD-IQ4_K_M] (the gate's identity alias). A real run_bench.py run does NOT hardcode that alias: the runner appends its OWN identity alias bench-<config-hash> to the last launch line and assert_serving_expected_model then requires that exact alias in served_ids (finding H2: a leftover server on the port would otherwise pass the health check while serving the wrong model; H5: a repo-name substring match cannot distinguish sibling configs sharing a base repo id and raw_port). That exact-identity gate — not the provider's default_model — is what makes this config's rows attributable; keep one backend on 8017 at a time so the gate cannot be fooled by a stale sibling."
    source: "artifacts/qwen36-mannix-cd-iq4km-stream-gate-20260916.json (served_ids) + runner/run_bench.py (server_command, assert_serving_expected_model)."
  - name: binary_build_provenance
    value: "runner/.dspark-head/build/bin/llama-server — official ggml-org/llama.cpp mainline source build. `llama-server --version` (re-verified 2026-09-16 during this config task): 0.1.2-dev (build 1, commit a302733), built with AppleClang 21.0.0.21000101 for Darwin arm64; checkout HEAD a302733 'metal : clamp K extent in tensor API mat-mat kernel for K not a multiple of 32 (#27450)' from https://github.com/ggml-org/llama.cpp. Built 2026-08-23 via runner/setup_dspark_head.sh (gitignored, NOT committed). Same binary the 2026-09-16 gate served from, and the same build the 35B official control arm pins. Reasons it is the control binary rather than Homebrew's llama.cpp: the Homebrew bottle used by historical GGUF rows is build 10470 (commit 34af94cd9, 2026-08-17); this mainline build (2026-08-23) is the same official codebase, newer, and already proven live with this exact model file by the gate. Every launch flag in benchmark_launch_command is present in this binary's `--help` (gate-verified). Inference engine label stays `llama.cpp` (plain mainline, no fork/spec patches), so leaderboard grouping matches historical rows."
    source: "`./runner/.dspark-head/build/bin/llama-server --version` (2026-09-16), `git -C runner/.dspark-head log --oneline -1`, `git -C runner/.dspark-head remote -v`, runner/setup_dspark_head.sh, llama-server --help."
  - name: launch flags (parallel / n-gpu-layers / flash-attn / jinja / cache-prompt / timeout)
    value: "--parallel 1 (single slot; the server default of 4 multiplies KV-cache memory and is a real Metal OOM risk at 65536 ctx with a 16.7 GB model on 32 GB — same finding as configs/Qwen3.8-27B/gguf-dflash2.yaml's --parallel entry and the 35B arm); --n-gpu-layers 99 (full Metal offload, explicit); --flash-attn on (reduces KV memory at long ctx; --flash-attn takes on|off|auto in this binary); --jinja (use the GGUF's embedded Qwen3.6 chat template — gate-proven, no community template fix needed, closing the same open item the 35B arm closed); --cache-prompt (prefix reuse, mirrors Mei's cache-reuse arm); --timeout 1800 (server-side request cap). NO unsafe compile experiment applies to this arm: 'compiled-decode' is a Mei/vmlx experimental concept present in some Mei configs (their opt-in env + flag sets) — nothing of the kind exists here, the launch is plain mainline decode, and no VMLX unsafe-compile environment or flag is set by this config."
    source: "2026-09-16 gate launch controls (artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md); configs/Qwen3.8-27B/gguf-dflash2.yaml + configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml for the --parallel 1 reasoning; llama-server --help for each flag; Mei configs (configs/Laguna-XS-2.1/mei.yaml, configs/Qwen3.6-35B-A3B-OptiQ/*.yaml) for what compiled-decode is and that it is absent here."
  - name: completed_gate_canary (2026-09-16 — exploratory admission evidence, NOT a benchmark result)
    value: "artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md: endpoint http://127.0.0.1:8017/v1, served_ids exactly [ManniX-ITA/Qwen3.6-27B-A3B-Coder-MTP-GGUF:CD-IQ4_K_M]. Identity probe PASS; plain non-streaming PASS (finish_reason stop, content 'ready'); plain streaming PASS (178 chunks); native tool non-streaming PASS (add_numbers, args {\"a\":15,\"b\":27}, finish_reason tool_calls); native tool streaming PASS (117 chunks, same call). Entry-controls only. A separate six-task exploratory canary (artifacts/qwen36-mannix-cd-iq4km-native-gate-20260916.jsonl; suites sanity-basic, hermes_ops-chaining, hermes_ops-noisy-result, kiem_mini-feature, kiem_mini-testwrite, canary-multi-turn; max_tokens=4096, max_turns=4, temp 0, runner_git_sha 1e7a92f59824) summarized passed=5, failed=0, errors=1, tasks_total=6: kiem_mini-testwrite truncated — finish_reason=length, error_kind=truncated ('max_tokens=4096 was likely too low'). That is the model hitting the token cap, NOT a transport/harness failure, and it is exploratory single-trial evidence — NOT ranking evidence and NOT a benchmark result. The gate appended zero log.jsonl rows, created no config, and no server is left running."
    source: "artifacts/qwen36-mannix-cd-iq4km-gate-20260916.md + raw artifacts qwen36-mannix-cd-iq4km-stream-gate-20260916.json / qwen36-mannix-cd-iq4km-native-gate-20260916.jsonl / qwen36-mannix-cd-iq4km-gate-20260916-server.log."
known_gaps:
  - "EXPLORATORY / UNRANKED — INTERRUPTED PARTIAL LEG (2026-09-16): the first current-suite benchmark run for this config (sanity 2 + hermes_ops 8 + kiem_mini 5 + hearth_mini 3 + kipclip_mini 4 + hearth_full 3 = 25 rows, the runner's default battery since 2026-08-25, run_bench.py --coding-suites default) was STARTED under config hash 02c0f591926b / runner_git_sha 91c123cb02a0 (the clean runner/config commit, HEAD 91c123cb02a0 at run time) but produced only 13/25 rows before interruption: sanity 2 + hermes_ops 8 + kiem_mini 3 — 11 pass, 2 fail, all 13 harness_error=false (rows span 2026-09-16T11:56:12Z..12:19:12Z). Durable inventory and classification in artifacts/qwen36-mannix-cd-iq4km-interrupted-20260916.md (with copied server log). Both failures are model/task-level, not harness: hermes_ops-multi-step-chain (response truncated at max_tokens=16384, run_error finish_reason=length) and kiem_mini-feature (held-out Rust check check_cli_tag_flag failed); kiem_mini-debug passed but within_budget=false. Missing before completion: kiem_mini-parse-note, kiem_mini-testwrite, hearth_mini (3), kipclip_mini (4), hearth_full (3). This leg is INTERRUPTED/PARTIAL — NOT a completed run, NOT rank-eligible, must not be counted on any leaderboard; the 13 rows stay append-only evidence and the pre-run snapshot results/configs/02c0f591926b.yaml is unchanged. A full 25-row battery remains the whole point of the arm, with its own fresh rows plus a zero-harness review of this leg's 2 failures before any ranking claim. Until then, treat every line of this file as setup provenance, not a result."
  - "INTERRUPTED PARTIAL LEG 2 (2026-09-16): a SECOND current-suite benchmark run for this config (same 25-row default battery) was STARTED under config hash 71b86463d35f / runner_git_sha a018d59cefab (working-tree HEAD a018d59cefab, ahead of origin) and produced only 18/25 rows before interruption: sanity 2 + hermes_ops 8 + kiem_mini 5 + hearth_mini 3 — 14 pass, 4 fail, all 18 harness_error=false, 3 within_budget=false (rows span 2026-09-16T14:01:59Z..15:36:09Z). Durable inventory and classification in artifacts/qwen36-mannix-cd-iq4km-interrupted-run2-20260916.md (with copied server log). All four failures are model/task-level, not harness: hermes_ops-multi-step-chain (response truncated at max_tokens=16384, run_error finish_reason=length), kiem_mini-debug (Swift compiler failure — unhandled 'try', error: fatalError), kiem_mini-parse-note (Swift type failure, Substring->String conversion), kiem_mini-testwrite (mutation grade 2/3 killed, 1 mutant survived). Missing before completion: kipclip_mini (4), hearth_full (3). This leg is INTERRUPTED/PARTIAL — NOT a completed run, NOT rank-eligible, must not be counted on any leaderboard; the 18 rows stay append-only evidence and the pre-run snapshot results/configs/71b86463d35f.yaml is unchanged. The earlier 13/25 leg (hash 02c0f591926b / runner 91c123cb02a0) remains recorded in the bullet above with its own marker. A full 25-row battery remains the whole point of the arm, with its own fresh rows plus a zero-harness review of both legs' failures before any ranking claim. This prose reconciliation intentionally changed the config hash from 71b86463d35f; no benchmark was run against the edited text."
  - "The six-task canary is NOT ranking evidence: one exploratory trial, 5/6 passed, with kiem_mini-testwrite truncated at max_tokens=4096 (finish_reason=length, error_kind=truncated). It proves admission capability only, exactly like the 35B arm's canary."
  - "Broad-run prerequisites before the 25-row run: single-writer preflight (exactly one backend on 8017; unload_all.sh discipline; no other llama.cpp/Mei config running concurrently), teardown verification (no llama-server/mei listener left on 8017, no leftover bench ports), and a zero-harness review of every partial/failed row before any other model starts. As of 2026-09-16 free disk is 48.4065 GiB (parent-verified), above the runner's 30.0 GB MIN_FREE_DISK_GB_BEFORE_LAUNCH gate (runner/bench_common.py:78), so the preflight is disk-OK; verify again at run time."
