known_gaps:
  - "EXPLORATORY CANDIDATE — GATE-PASSED, NOT a completed benchmark. No pass/fail or performance claims: there are NO sanity/hermes_ops/coding rows in results/log.jsonl for this leg (orchestration.hermes_provider is null) and every speed number cited here is a BOUNDED MICROPROBE (single prompt, short decode), not a full benchmark. A full benchmark run at the tuned safe launch would be required before any comparative claim."
  - "HARNESS OFF-BY-ONE (documented, NOT a model failure): runner/probe_mei.py's stock exact-cap probe assumes tokenizer units equal server prompt tokens, so its first nominal exact-cap request (tokenizer 65535 → actual server prompt_tokens 65536) failed the assert and the probe marked it failed. context-boundary-corrected.json records the corrected measurement: tokenizer 65535 → server accepted 65536 (HTTP 200); tokenizer 65536 → server prompt_tokens 65537 → HTTP 400 engine_error 'request exceeded context cap: 65537 prompt tokens > 65536 allowed'. The server enforces its cap exactly; the harness had a one-token unit mismatch."
  - "The optional GLOBAL-COMPILE experiment (VMLX_ENABLE_UNSAFE_COMPILE=1 + --compiled-decode true) is NOT validated at the 65k context boundary — only the safe final gate (compiled-decode false) carried the corrected exact-cap measurement. Do not claim 65536-capacity support for the unsafe-compile build; it also must never be the default safe launch."
  - "Region-on vs region-off at the 512-token microprobe was -0.510% (server 55.81 vs 56.10 tok/s) — speed NEUTRAL, within noise; the region-compiled decode is kept ONLY for its exact-affine architecture fit and proven correctness, and must not be advertised as a speed win."
  - "Port 8024 is SHARED with configs/Ornith-1.5-35B-A3B/mei.yaml and the Qwen3.6 Mei configs (configs/Qwen3.6-35B-A3B/mei.yaml, configs/Qwen3.6-35B-A3B-textonly/mei.yaml; NVIDIA-Nemotron-3.5-Lightning-30B-A3B/mei.yaml also declares it but is non-viable). NEVER run this config concurrently with any of them (or with Ornith/Qwen3.6 in general) — one local Mei server per run, enforced by unload_all.sh + the exact served_model_id identity gate."
  - "GGUF/llama.cpp distinction: this config is the Mei/MLX 5-bit lane. The older poolside/Laguna-XS-2.1-GGUF:Q4_K_M leg (configs/Laguna-XS-2.1/gguf.yaml) runs llama.cpp + bench_local_proxy (poolside_v1 parser) and has its own historical probe gap (the harness's plain-completion probe did not recognize the reasoning-only output shape). Nothing in this config changes or re-verifies that GGUF leg."
  - "The build is LOCAL-ONLY: vmlx-pr-laguna @ d42661c6 and /tmp/mei-laguna @ b17ad4c are unpushed local checkouts; mei-build-laguna-d42661c6/release/mei depends on them. A different machine or a fresh /tmp cannot reproduce the binary without those exact checkouts."
