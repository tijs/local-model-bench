benchmark_launch_command: |
  env VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 BENCH_NO_FUSED_GATE_UP=1 VMLX_LAGUNA_COMPILE_DECODE_REGIONS=1 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/Laguna-XS-2.1-MLX-5bit \
    --served-model-id AtomicChat/Laguna-XS-2.1-MLX-5bit --port 8024 --context-cap 65536 \
    --prefill-step-size 1024 --max-tokens 32768 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-laguna-XS-2.1 \
    --temperature 1.0 --top-p 1.0 --top-k 20 --min-p 0.0 \
    --emit-reasoning true --enable-thinking true --cache-reuse true \
    --optimization-profile generic --memory-limit-bytes 30000000000 --cache-limit-bytes 0 \
    --compiled-decode false \
    --mei-repo /Users/tijs/projects/mei-040 \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-040
# SAFE LAUNCH env + flags — this exact operating point passed the final-safe gate
# (10/10 probes incl. 65536 context boundary, see artifacts/laguna-mlx-tuning-20260908.md).
# VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 + BENCH_NO_FUSED_GATE_UP=1 pin the fused
# gate+up cache OFF (39 sparse layers × 369655808 B = 14416576512 B ≈ 13.43 GiB /
# 14.42 GB of per-layer fused gate+up tensors would otherwise be retained).
# VMLX_LAGUNA_COMPILE_DECODE_REGIONS=1 keeps the narrow region-compiled decode
# (correctness-proven for this arch; speed-neutral at the 512-token microprobe).
# --optimization-profile generic and --cache-limit-bytes 0 coincide with the
# pinned binary defaults; --memory-limit-bytes 30000000000 DIFFERS from the
# launcher default and is pinned for exact reproduction. --compiled-decode false
# is the SAFE default; the global-compile experiment (VMLX_ENABLE_UNSAFE_COMPILE=1,
# VMLX_LAGUNA_COMPILE_DECODE_REGIONS=0, --compiled-decode true) is documented in
# the header + artifacts report and must NOT replace this line.
# Deliberately NOT passed: --load-mmap (not a supported flag in this build).
# 2026-09-09: --mei-repo moved off /tmp/mei-laguna to the durable worktree
# ~/projects/mei-laguna (branch bench/laguna-mlx, same commit b17ad4c, same
# local vmlx path dep on ~/projects/vmlx-pr-laguna). start_mei_server.sh
# rebuilds from --mei-repo on EVERY launch, so a /tmp cleanup mid-chain would
# have failed this benchmark partway through. The build itself is unchanged.
benchmark_endpoint: http://127.0.0.1:8024/v1

