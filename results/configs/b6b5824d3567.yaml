# DWQ mixed-precision quant of Qwen3.6-35B-A3B — the quality experiment.
#
# Why this model. kiem_mini-testwrite is the single task standing between
# Qwen3.6 text-only and 25/25, and it is quantisation-sensitive rather than
# engine-sensitive: the same Ornith weights pass it 2/6 as GGUF Q4_K_M and 0/40
# as MLX 4-bit, and a 9B at Q8 passes 3/3 where every MLX 4-bit model we run is
# 4/69. Higher uniform precision does not fit — 6-bit is 29.1 GB and 8-bit
# 37.7 GB against a 4-bit that already peaks at 24.5 GB of 32.
#
# DWQ is the way out: distillation-aware, and MIXED. Its expert projections
# stay at 4 bits (240 entries) while embeddings, attention and the router move
# to 8 (272 entries) — exactly the allocation worth trying, since the experts
# are the bulk of an MoE and everything else is cheap to upgrade. The result is
# 19 GB, no larger than the 4-bit build it replaces, so memory and decode speed
# should be unchanged and only quality moves.
#
# It also ships text-only already: no vision_config, so no strip step.
#
# Settings come from qwen3.6-35b-a3b-text, whose numbers were measured on the
# plain 4-bit build of the same architecture. That is an assumption this run
# tests, not a fact: if DWQ changes prefill or anchor behaviour the profile's
# values may no longer be optimal for it.
model: mlx-community/Qwen3.6-35B-A3B-4bit-DWQ
temperature: 0.6
reasoning_mode: thinking
inference_engine: mei
mei_commit: 44461ffdf8dca836b624b2d0d268c800dedea05e  # shipping pin (0.4.2's engine)
source_revision: 73c707af4243  # pinned at download
quant_family: MLX DWQ mixed — experts 4-bit, embeddings/attention/router 8-bit, group 64 affine
context_cap: 65536
prefill_step_size: 1024
tool_call_path: native_mei_requires_live_probe
benchmark_launch_command: |
  env VMLX_ENABLE_UNSAFE_COMPILE=1 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/Qwen3.6-35B-A3B-4bit-DWQ \
    --served-model-id mlx-community/Qwen3.6-35B-A3B-4bit-DWQ --port 8024 --context-cap 65536 \
    --model-profile qwen3.6-35b-a3b-text \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-dwq \
    --request-log /Users/tijs/.local/share/local-model-bench/mei-runtime/logs/requests-dwq.jsonl \
    --log-requests true \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-050rel \
    --mei-repo /Users/tijs/projects/mei-bisect
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  raw_port: 8024
  needs_proxy: false
  hermes_provider: bench-mei
  served_model_id: mlx-community/Qwen3.6-35B-A3B-4bit-DWQ
  viable: full

known_gaps:
  - "EXPERIMENT, not a candidate. Run to test whether a mixed-precision quant recovers kiem_mini-testwrite at unchanged size and speed. Nothing here is a validated setting."
  - "Port 8024 is shared with every other Mei config; never run concurrently."
last_updated: 2026-09-13
