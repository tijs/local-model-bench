model: ornith-ai/Ornith-1.5-9B-MLX-4bit
# Added 2026-08-23 — closes the "all three engines for one model" gap
# Tijs asked about: this is a NEW directory, distinct from
# configs/Ornith-1.5-9B-oQ4e-fp16/ (scottlowry's community oMLX quant,
# a different HF org/artifact entirely). This is the official ornith-ai
# MLX 4-bit quant — same relationship as LiquidAI-LFM2.5-8B-A1B/ (official)
# vs LFM2.5-8B-A1B-oQ4e-fp16/ (community oMLX quant, separate directory).
temperature: 0.7
reasoning_mode: instruct
inference_engine: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) uv run --locked python -m vllm_mlx.server \
    --model ornith-ai/Ornith-1.5-9B-MLX-4bit --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 32768 --continuous-batching \
    --default-temperature 0.7 --default-top-p 0.8 --default-top-k 20 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8018/v1
  # PROXY UNVERIFIED — vllm-mlx's tool-call parsing is model-dependent,
  # not universal (see AGENTS.md). Spot-check the raw endpoint directly
  # before trusting a hermes_ops/coding result here.

orchestration:
  raw_port: 8018
  needs_proxy: false   # provisional — see benchmark_endpoint note above.
  hermes_provider: ornith9b-mlx   # registered in
    # ~/.hermes/profiles/bench/config.yaml 2026-08-23.
  viable: full

settings:
  - name: quant
    value: "MLX 4-bit (ornith-ai/Ornith-1.5-9B-MLX-4bit, official — same
      org as configs/Ornith-1.5-9B-oQ4e-fp16's underlying base model, but
      a distinct artifact from that directory's scottlowry community oMLX
      requant). Single-file 5.04GB safetensors, confirmed via the HF
      models API 2026-08-23."
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-9B-MLX-4bit
      (revision a48173b246ac705be75c05bedf1a0666db522d53, checked
      2026-08-23). Official 8-bit/6-bit MLX quants also exist if a
      higher-precision leg is wanted later — not added here, matching
      this repo's 'one quant per new model' default."
  - name: temperature / top_p / top_k
    value: 0.7 / 0.8 / 20
    source: "Same as configs/Ornith-1.5-9B-oQ4e-fp16/omlx.yaml's own
      --temperature/--top-p/--top-k launch flags. Sampling recommendations
      are a checkpoint property, not an engine-specific one, so reused
      directly rather than re-derived — NOT independently re-confirmed
      against a model-card citation specifically for this repo (the omlx
      sibling config itself doesn't cite one either); flagged in
      known_gaps."
  - name: context_length
    value: 65536 prompt / 32768 generated
    source: "Same caps as configs/Ornith-1.5-9B-oQ4e-fp16/omlx.yaml, for
      direct cross-engine comparability."

known_gaps:
  - "Sampling settings (temperature/top_p/top_k) were carried over from
    the omlx sibling config rather than independently verified against
    this model's own card — that sibling config also lacks a direct
    citation for these values. Worth double-checking
    https://huggingface.co/ornith-ai/Ornith-1.5-9B's model card directly
    if results here look off."
  - "Tool-call parsing (native vs. proxy-required) is UNVERIFIED for this
    checkpoint. Confirm with a direct raw-endpoint request before
    trusting any hermes_ops or coding result."
  - "Never run live as of authoring."

last_updated: 2026-08-23
