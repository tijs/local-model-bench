model: trohrbaugh/Qwen3.8-27B-heretic-ara-gguf-Q5:Q5_K_M
# Added 2026-08-30 (user request, following a Level1Techs forum article:
# https://forum.level1techs.com/t/why-your-local-llm-feels-dumber-than-it-is/253917).
# REPLACES gguf-q5.yaml (JonathanColetti/Qwen3.8-27B-Uncensored-GGUF) as
# this family's active Uncensored representative going forward -- not an
# additional candidate alongside it. The article ran an identical
# methodology across four different abliterated/uncensored builds of this
# exact base model (Qwen3.8-27B) and found abliteration QUALITY varies
# enormously by author/technique, not just by whether a model is
# uncensored at all -- top-1 token-flip rates ranged from 0.717%
# (heretic-org's own build, "remarkably functional") up to 5.831% with
# 44/299 invalid reasoning branches for the worst build tested (one
# build corrupted a literal port number, 5432 -> 543ql). heretic-org's
# build ("ara" = the Heretic tool's abliteration recipe) was the
# article's best-scoring variant of this exact model.
#
# Why this matters for gguf-q5.yaml's own recorded result: that config's
# hermes_ops pass rate regressed sharply at Q5 (100% -> 62%) versus its
# own Q4_K_M sibling, previously written up in results/SUMMARY.md as "a
# real, checkpoint-specific finding." This project had only ever tested
# ONE abliteration of this base model, so that regression's real cause
# was never isolated -- it could be a genuine quant x abliteration
# interaction, or it could be an artifact of JonathanColetti's specific
# abliteration job being lower quality to begin with (this config's
# GGUF is a third-party re-quant by trohrbaugh, not by heretic-org
# themselves, but of heretic-org's own upstream safetensors checkpoint --
# see https://huggingface.co/heretic-org/Qwen3.8-27B-heretic-ara).
#
# Not a perfectly matched comparison to gguf-q5.yaml's own retirement:
# this is a genuinely different abliteration job on the same base model,
# not a different quant of the same fine-tune -- if results differ, that
# could be quant method, abliteration technique, or both. Same caveat
# class as gguf-q5.yaml's own header note about the base-model UD-Q5_K_M
# comparison.
temperature: 1.0
reasoning_mode: thinking
reasoning_effort: medium
  # Same reasoning as gguf-q5.yaml's own note: this is the chat template
  # fix's hardcoded default whenever no --reasoning-effort flag is passed,
  # not a claim that medium is optimal for this specific build.
hermes_ops_max_tokens: 16384
  # Added 2026-08-31 (benchmark-v4 hermes_ops quick fix): this exact config
  # was the one that reproduced the finish_reason=length truncation on
  # hermes_ops-targeted-edit at the default 4096-token cap (confirmed live,
  # 2026-08-31 rerun) -- a thinking-mode model exhausting its budget on
  # reasoning before answering, not a real capability gap. hermes_ops's
  # one-shot run_prompt.py client has no finish_reason=length continuation
  # logic (unlike the coding suites' real `hermes chat` agentic loop), so
  # this raises the cap instead. See gguf-unsloth-ud-q5-64k.yaml's own note
  # for the fuller family-wide rationale.
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo trohrbaugh/Qwen3.8-27B-heretic-ara-gguf-Q5:Q5_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 20 \
    --ctx-size 65536 \
    --jinja --chat-template-file configs/Qwen3.8-27B/chat_template.jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls expected -- same precedent as every other config in
  # this family. Not independently re-verified live for this specific
  # quant file before the first run -- same open question every sibling
  # config in this family carries.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen38-heretic-q5-gguf   # registered in
    # ~/.hermes/profiles/bench/config.yaml alongside the other Qwen3.8-27B
    # providers, with context_length: 65536 matching this config's real
    # --ctx-size.
  viable: full

settings:
  - name: quant
    value: "Q5_K_M, single-file GGUF re-quant by trohrbaugh of
      heretic-org's own upstream safetensors checkpoint."
    source: "https://huggingface.co/trohrbaugh/Qwen3.8-27B-heretic-ara-gguf-Q5"
  - name: fine-tune method (uncensoring)
    value: "Abliteration via the Heretic tool's \"ara\" recipe
      (heretic-org/Qwen3.8-27B-heretic-ara) -- a DIFFERENT abliteration
      job than gguf-q5.yaml's JonathanColetti build, selected specifically
      because a third-party evaluation (see header comment) scored it as
      the highest-quality abliteration among four tested builds of this
      exact base model."
    source: "https://huggingface.co/heretic-org/Qwen3.8-27B-heretic-ara ;
      https://forum.level1techs.com/t/why-your-local-llm-feels-dumber-than-it-is/253917"
  - name: context_length
    value: 65536
    source: "Same reasoning as every other Qwen3.8-27B family config --
      hermes's hard >=64K minimum for the coding suite."
  - name: temperature / top_p / top_k (thinking mode)
    value: 1.0 / 0.95 / 20
    source: "Same as every other config in this model family -- no
      separate sampling guidance published for this build."
  - name: chat_template (community fix, inherited defensively)
    value: "Same file as every other Qwen3.8-27B config
      (configs/Qwen3.8-27B/chat_template.jinja) -- not confirmed necessary
      for this build's own shipped template, applied defensively per this
      family's standing precedent."

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops -- see
    every sibling config's own note on this, unchanged here."
  - "Native tool_calls format not independently verified live for this
    specific quant file -- confirm before trusting hermes_ops/coding
    results, same open question as every sibling config."
  - "This is a third-party re-quant (trohrbaugh) of a third-party
    abliteration (heretic-org), not an author-published GGUF -- two
    hops removed from the base model, same trust model this whole
    Uncensored sub-family already accepts."
  - "First run should watch for OOM/swap behavior, same standing caution
    as every new ctx-size/quant combination in this repo."
  - "The article's token-flip-rate evaluation is one forum author's own
    methodology, not independently reproduced by this project -- treat
    \"heretic-org's build scored best\" as a reasonable prior for model
    selection, not as an established fact this benchmark has verified
    itself. This benchmark's own hermes_ops/coding results are what
    actually matter for the Hermes-backend decision."

last_updated: 2026-08-30
last_verified_against_docs: 2026-08-30
