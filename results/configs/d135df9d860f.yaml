model: empero-ai/Qwen3.8-27B-Ridge-GGUF
backend: gguf
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.7
reasoning_mode: instruct
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo empero-ai/Qwen3.8-27B-Ridge-GGUF \
    --hf-file Qwen3.8-27B-Ridge-3.7bpw.gguf \
    --host 127.0.0.1 --port 8017 \
    --reasoning off \
    --temp 0.7 --top-p 0.80 --top-k 20 --presence-penalty 1.5 \
    --ctx-size 65536 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Untested as of setup — verify live whether native tool_calls come back
  # clean (same embedded Qwen3.8 <tool_call> template as configs/Qwen3.8-27B,
  # which DID work natively without a proxy) or whether this needs
  # bench_local_proxy.py like the MLX-side Qwen3-Coder does.

orchestration:
  raw_port: 8017
  needs_proxy: false   # provisional — flip to true + set proxy_parser if
    # native tool_calls don't come back clean, matching this repo's usual
    # verify-live discipline for every new model.
  hermes_provider: qwen38ridge-gguf
  viable: full

settings:
  - name: quant / file
    value: "Qwen3.8-27B-Ridge-3.7bpw.gguf (single-file Ridge mix, 3.69 bpw,
      11.73 GiB) — Q8_0 for the Gated-DeltaNet state path, Q4_K for mixers,
      native MTP draft head (blk.64) kept but unused here (no --spec-type
      flag in this base config; see below for the speculative-decoding
      follow-up)."
    source: "https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF
      README.md, 'Files' and 'Recipe' sections."
  - name: temperature / top_p / top_k / presence_penalty
    value: "0.7 / 0.80 / 20 / 1.5 (instruct mode, thinking disabled via
      --reasoning off)"
    source: "https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF
      README.md 'Sampling' table, instruct-mode row (matches the base
      Qwen/Qwen3.8-27B card's own instruct-mode recommendation, same
      family as configs/Qwen3.8-27B). Thinking-mode alternative (temp 1.0/
      top_p 0.95/top_k 20/presence 0.0) intentionally not used here —
      picked instruct mode for turn latency in a 40-max-turn agentic loop,
      per AGENTS.md's standing practice of recording this choice per model
      rather than forcing one global policy."
  - name: context_length
    value: "65536 (native 262144, extensible to 1M via YaRN) — capped to
      match this repo's other GGUF configs and comfortably clear hermes's
      64K hard minimum; not pushing to native since KV cache cost at 262K
      is the dominant memory cost per the model card's own 'Long context'
      section, not something this benchmark's tasks need."
    source: "https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF
      README.md 'Long context' section."
  - name: MTP speculative decoding (draft-mtp)
    value: "NOT enabled in this base config. The GGUF keeps a native MTP
      draft head (blk.64) usable via --spec-type draft-mtp --spec-draft-n-max
      6 on a sufficiently recent llama.cpp build. Follow-up: verify whether
      the installed Homebrew build (10470) actually supports draft-mtp
      (unlike DFlash2, which needed a custom fork) before adding a
      gguf-mtp.yaml variant."
    source: "https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF
      README.md 'llama.cpp with MTP draft speculation' section."
  - name: tool-calling format
    value: "Embedded Qwen3.8 chat template, <tool_call>...</tool_call> XML
      tags — same family/format as configs/Qwen3.8-27B/gguf.yaml, which
      confirmed native tool_calls parsing works without a proxy on this
      base architecture. Re-verify live for this specific quant before
      trusting needs_proxy: false above."
    source: "https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF
      README.md 'Sampling' section + configs/Qwen3.8-27B/gguf.yaml's own
      settings entry."

  - name: measured result (2026-08-20, full sanity + hermes_ops + coding run)
    value: "sanity 2/2 PASS (native tool_calls confirmed, needs_proxy:
      false correct as provisioned). hermes_ops 1/3: selection FAIL
      (exceeded max_turns(40) without a final non-tool-call response,
      ~926K cumulative prompt_tokens across the 40 turns — stuck
      tool-calling rather than concluding), chaining PASS (fast, 21.7s),
      error-recovery FAIL (same max_turns exhaustion pattern, ~918K
      cumulative prompt_tokens). kiem_mini-feature (coding spot-check):
      PASS (1010s — slow, ~17 min, but correct). No signs of a harness
      bug in the two hermes_ops FAILs (well-established 'exceeded
      max_turns' signal seen across many other models); read as a genuine
      trait of this specific Ridge quant, possibly related to its +9%
      wiki-style PPL degradation vs the BF16 convert — not independently
      confirmed as the cause."
    source: "Direct runs via runner/run_prompt_suite.py and
      runner/run_fixture_suite.py, 2026-08-20."

last_updated: 2026-08-20
