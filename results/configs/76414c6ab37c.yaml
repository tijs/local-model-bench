model: ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit
# Added 2026-08-23 — closes the "all three engines for one model" gap
# Tijs asked about: this directory previously only had gguf.yaml (~30.1
# tok/s avg hermes_ops, see that file's own leaderboard row). This is the
# official ornith-ai MLX 4-bit quant (distinct artifact/org from
# configs/Ornith-1.5-9B-oQ4e-fp16's scottlowry community oMLX quant, hence
# a separate directory for that one rather than folding in here).
temperature: 0.6
reasoning_mode: unspecified
inference_engine: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) uv run --locked python -m vllm_mlx.server \
    --model ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.6 --default-top-p 0.95 --default-top-k 20 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8018/v1
  # PROXY UNVERIFIED — this model's GGUF sibling (gguf.yaml) confirmed
  # native tool_calls on llama-server (qwen3_xml-style blocks auto-parsed
  # by that runtime), but vllm-mlx's tool-call parsing is model-dependent,
  # not universal (see e.g. Qwen3-Coder-30B-A3B needing its own proxy
  # parser despite also being qwen3_xml-style) — spot-check the raw
  # endpoint directly before trusting a hermes_ops/coding result here.

orchestration:
  raw_port: 8018
  needs_proxy: false   # provisional — see benchmark_endpoint note above.
  hermes_provider: ornith35b-mlx   # registered in
    # ~/.hermes/profiles/bench/config.yaml 2026-08-23.
  viable: full

settings:
  - name: quant
    value: "MLX 4-bit (ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit, official —
      same org as the GGUF sibling, not a third-party requant). 19.51GB
      total safetensors bytes, confirmed via the HF models API 2026-08-23."
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit
      (revision 19504d912fa8fc7622bf6b1de3db5d5d890b1f02, checked
      2026-08-23). An 8-bit official MLX quant also exists
      (Ornith-1.5-35B-A3B-MLX-8bit, ~2x the shard count) if a
      higher-precision MLX leg is wanted later — not added here, matching
      this repo's 'one quant per new model' default."
  - name: temperature / top_p / top_k
    value: 0.6 / 0.95 / 20
    source: "Same as configs/Ornith-1.5-35B-A3B/gguf.yaml — see that
      file's own citation (model card 'general tasks' preset, not the
      'benchmark reproduction' 1.0 value). Sampling recommendations are a
      checkpoint property, not an engine-specific one, so reused directly
      rather than re-derived."
  - name: context_length
    value: 65536 (native 262144, YaRN to ~1M per the model card)
    source: "Same as configs/Ornith-1.5-35B-A3B/gguf.yaml — capped
      identically for direct cross-engine comparability."

known_gaps:
  - "Tool-call parsing (native vs. proxy-required) is UNVERIFIED for this
    specific MLX checkpoint — the GGUF sibling's native-parsing result
    does not automatically transfer to vllm-mlx. Confirm with a direct
    raw-endpoint request before trusting any hermes_ops or coding result."
  - "Never run live as of authoring."

last_updated: 2026-08-23
