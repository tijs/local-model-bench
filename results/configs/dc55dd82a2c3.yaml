model: gpt-5.6-luna
backend: api
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: null  # no local sampling control (hosted API)
reasoning_mode: unspecified
framework: hermes (openai-codex provider, OAuth)

benchmark_launch_command: |
  # No local server — hosted model, reached via hermes's built-in
  # openai-codex provider (OAuth against Tijs's ChatGPT/Codex session,
  # https://chatgpt.com/backend-api/codex). Invoked directly:
  hermes chat --profile bench --provider openai-codex -m gpt-5.6-luna

benchmark_endpoint: "https://chatgpt.com/backend-api/codex (via hermes's own
  OAuth client — not a plain OpenAI-compatible endpoint, so run_prompt.py
  cannot hit it directly)"

orchestration:
  raw_port: null   # no local server — hosted model via hermes's own client
  needs_proxy: false
  hermes_provider: openai-codex
  viable: coding_only   # sanity/hermes_ops structurally unreachable (see
    # settings entry below) — only kiem_mini-feature was run

settings:
  - name: scope decision — coding spot-check only, no sanity/hermes_ops
    value: "Only kiem_mini-feature (the same one-task spot-check used for
      every other model per the established scope decision) was run for
      this candidate. sanity/hermes_ops require --base-url pointed at a
      plain OpenAI-compatible chat-completions endpoint (see
      tasks/SCHEMA.md) — Codex's backend isn't one; it's only reachable
      through hermes's own OAuth-authenticated client. Reimplementing that
      auth flow in run_prompt.py to reach parity with the other candidates
      was judged not worth doing for one hosted comparison point, and out
      of scope for a *local*-model benchmark to begin with."
    source: "AGENTS.md / kiem todo (2026-08-19): 'For Luna: just point
      --hermes-provider openai-codex -m gpt-5.6-luna at the existing
      suites, no proxy needed' — the coding suites (driven by hermes chat,
      not run_prompt.py) are the one suite family this actually works for
      without extra plumbing."
  - name: access method — explicit user decision, CORRECTED 2026-08-20
    value: "Reached via hermes's real openai-codex OAuth provider (Tijs's
      live Codex/ChatGPT session). CORRECTION: an earlier version of this
      note claimed this was 'NOT the same situation as the earlier Haiku
      exclusion' — that was WRONG, stated before actually reading the
      relevant code. Confirmed live 2026-08-20 (reading
      agent/auxiliary_client.py's _codex_cloudflare_headers()): hermes's
      Codex path DOES spoof a specific client's identity —
      'originator: codex_cli_rs' and a codex_cli_rs-shaped User-Agent,
      explicitly to get past a Cloudflare allowlist that 403s any request
      not advertising an approved first-party originator, 'regardless of
      auth correctness.' This is the same category of behavior as the
      Anthropic/Claude-Code impersonation that got Haiku excluded, just
      enforced at the network/CDN layer instead of the model-serving
      layer. Once this was found and explained, Tijs was asked again with
      accurate information and explicitly chose to keep the existing
      coding-suite result and NOT pursue building new code (a Responses-
      API translation + token-extraction proxy) that would require
      independently reimplementing this same spoofing — see the
      'sanity/hermes_ops expansion' entry below for why that specific
      idea was dropped even with his go-ahead."
    source: "agent/auxiliary_client.py:_codex_cloudflare_headers()
      docstring/implementation, read directly 2026-08-20; kiem note
      (2026-08-19) f51318dc-...-Haiku decision for the original precedent;
      direct user confirmation 2026-08-20 (both before and after the
      correction)."
  - name: sanity/hermes_ops expansion — investigated and dropped 2026-08-20
    value: "Considered building a Responses-API translation proxy (so
      run_prompt.py could reach Luna directly for sanity/hermes_ops, like
      every local model). Checked for a sanctioned path first: hermes's
      own 'hermes proxy' command ('Local OpenAI-compatible proxy to OAuth
      providers') exists for exactly this purpose, but only supports
      'nous' and 'xai' upstreams — NOT openai-codex. Building a bespoke
      version would mean extracting hermes's stored OAuth token and
      reimplementing the Cloudflare-bypass client-spoofing described
      above in new code, which is a materially different (and clearly
      worse) act than the existing coding-suite result going through
      hermes's own already-built, sanctioned client. Even attempting to
      grep for the relevant token-handling function names was blocked by
      the coding agent's own permission classifier. Dropped — not
      attempted, and not planned for a future session either unless the
      access-control picture changes (e.g. hermes adds openai-codex to
      'hermes proxy', or a real, non-subscription API key becomes the
      access method — see the Haiku decision for why that would be the
      only clean path)."
    source: "Investigation and decision, 2026-08-20."
  - name: context_length
    value: "272000 (per ~/.hermes/context_length_cache.yaml,
      gpt-5.6-luna@https://chatgpt.com/backend-api/codex)"
    source: "hermes's own cached model metadata, not independently
      verified against an OpenAI/Codex model card (none published for
      this internal codename at time of writing)."

known_gaps:
  - "No sanity/hermes_ops coverage for this candidate — see the scope-
    decision entry above. This makes Luna's leaderboard row thinner than
    every local candidate's (which get 5-6 rows: sanity + hermes_ops +
    one coding spot-check, sometimes across 2 backends/quants). Treat any
    direct pass-rate comparison against Luna with that caveat in mind."
  - "Real cost/usage note: unlike every other candidate in this benchmark,
    this run consumes Tijs's personal Codex/ChatGPT subscription quota,
    not free local compute. Do not re-run repeatedly without cause."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
