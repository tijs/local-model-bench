name: config-option
prompt: Add an optional attempts setting. load_config(raw) must default it to 3 and reject anything except
  integers 1..8 with ValueError (including booleans). Preserve unknown fields and avoid changing raw.
  In worker.py retry_indices(raw) returns 1-based attempt numbers using the parsed option.
files:
  config.py: |
    def load_config(raw):
        return dict(raw)
  worker.py: |
    def retry_indices(raw):
        return [1, 2, 3]
imports: |-
  from config import load_config
  from worker import retry_indices
visible:
- expression: retry_indices({'attempts':2})
  expected:
  - 1
  - 2
hidden:
- expression: load_config({'mode':'sync'})
  expected:
    mode: sync
    attempts: 3
- expression: retry_indices({'attempts':8})
  expected:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
- expression: retry_indices({'attempts':False})
  expected:
    raises: ValueError
- expression: load_config({'attempts':'3'})
  expected:
    raises: ValueError
- expression: retry_indices({'attempts':0})
  expected:
    raises: ValueError
- expression: (lambda x:(load_config(x),x))({'x':1})
  expected:
  - x: 1
    attempts: 3
  - x: 1
