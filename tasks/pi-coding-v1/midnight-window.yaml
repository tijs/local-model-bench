name: midnight-window
prompt: Fix active(clock,start,end) for HH:MM strings on a 24-hour clock. Use a half-open interval. Support
  crossing midnight. Equal endpoints mean an empty window.
files:
  hours.py: |
    def active(clock, start, end):
        return start <= clock <= end
imports: from hours import active
visible:
- expression: active('00:30','23:00','07:00')
  expected: true
hidden:
- expression: active('07:00','23:00','07:00')
  expected: false
- expression: active('23:00','23:00','07:00')
  expected: true
- expression: active('08:00','08:00','08:00')
  expected: false
- expression: active('12:00','09:00','17:00')
  expected: true
- expression: active('17:00','09:00','17:00')
  expected: false
