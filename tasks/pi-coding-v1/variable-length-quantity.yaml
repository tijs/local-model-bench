name: variable-length-quantity
prompt: Implement encode(numbers) and decode(bytes_) for MIDI variable-length quantities. Use most-significant
  7-bit group first, high continuation bit on all but the last group. Handle concatenated unsigned values
  through 0xffffffff. Raise ValueError('incomplete sequence') for an unfinished group.
