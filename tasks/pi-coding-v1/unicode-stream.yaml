name: unicode-stream
prompt: Repair decode_chunks(chunks). Decode one UTF-8 byte stream over an iterable of arbitrary byte
  chunks. Empty chunks are legal. Raise UnicodeDecodeError on malformed or incomplete data.
files:
  stream.py: |
    def decode_chunks(chunks):
        return ''.join(chunk.decode('utf-8') for chunk in chunks)
imports: from stream import decode_chunks
visible:
- expression: decode_chunks([b'A\xc3',b'\xa9'])
  expected: "A\xE9"
hidden:
- expression: decode_chunks(iter([b'',b'\xf0', b'\x9f',b'',b'\x8c\xb1']))
  expected: "\U0001F331"
- expression: decode_chunks([])
  expected: ''
- expression: decode_chunks([b'\xf0\x9f'])
  expected:
    raises: UnicodeDecodeError
- expression: decode_chunks([b'\xff'])
  expected:
    raises: UnicodeDecodeError
