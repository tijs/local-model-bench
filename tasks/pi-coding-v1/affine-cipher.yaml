name: affine-cipher
prompt: Implement encode(plain_text,a,b) and decode(ciphered_text,a,b) over the 26-letter ASCII alphabet.
  Encrypt index x as (a*x+b) mod 26. Keep digits, skip spaces/punctuation, lowercase, and group encrypted
  output in fives. Decryption removes grouping. Raise ValueError('a and m must be coprime.') when required.
files:
  affine_cipher.py: |
    def encode(*args, **kwargs):
        raise NotImplementedError

    def decode(*args, **kwargs):
        raise NotImplementedError
