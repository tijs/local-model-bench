name: ledger-rounding
prompt: Fix cents(text) to convert a decimal currency string to integer cents, with ties rounded away
  from zero. totals(rows) returns totals per account, summing individually rounded posted entries only.
  Preserve accounts whose posted entries total zero.
files:
  money.py: |
    def cents(text):
        return round(float(text)*100)
  ledger.py: |
    from money import cents

    def totals(rows):
        return {r['account']:cents(r['amount']) for r in rows}
imports: |-
  from ledger import totals
  from money import cents
visible:
- expression: cents('1.005')
  expected: 101
hidden:
- expression: cents('-0.005')
  expected: -1
- expression: totals([{'account':'a','amount':'0.005','status':'posted'}]*2)
  expected:
    a: 2
- expression: totals([{'account':'a','amount':'0','status':'posted'},{'account':'b','amount':'5','status':'pending'}])
  expected:
    a: 0
- expression: cents('90071992547409.93')
  expected: 9007199254740993
