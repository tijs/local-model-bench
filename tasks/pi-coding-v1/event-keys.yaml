name: event-keys
prompt: Implement event_key in keys.py by stripping whitespace and case-folding. Have unique_events in
  events.py use it to deduplicate nonblank events, keeping first original spelling and order. Change both
  modules.
files:
  keys.py: |
    def event_key(value):
        return value
  events.py: |
    def unique_events(values):
        return list(values)
imports: |-
  from keys import event_key
  from events import unique_events
visible:
- expression: unique_events([' A ', 'a', 'B'])
  expected:
  - ' A '
  - B
hidden:
- expression: "event_key(' Stra\xDFe ')"
  expected: strasse
- expression: "unique_events(['','  ','Stra\xDFe','STRASSE',' A ','a'])"
  expected:
  - "Stra\xDFe"
  - ' A '
- expression: unique_events([])
  expected: []
transient_first_write: true
