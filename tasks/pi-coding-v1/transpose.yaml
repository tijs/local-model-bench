name: transpose
prompt: Implement transpose(text) over newline-separated rows. Return the transposed rows joined by newlines.
  Preserve actual spaces. For ragged input add spaces only where needed to reach a later character in
  an output row; omit absent trailing cells.
files:
  transpose.py: |
    def transpose(*args, **kwargs):
        raise NotImplementedError
imports: from transpose import transpose
visible:
- expression: transpose('')
  expected: ''
- expression: transpose('A1')
  expected: |-
    A
    1
hidden:
- expression: transpose('A\n1')
  expected: A1
- expression: transpose('ABC\n123')
  expected: |-
    A1
    B2
    C3
- expression: transpose('Single line.')
  expected: "S\ni\nn\ng\nl\ne\n \nl\ni\nn\ne\n."
- expression: transpose('The fourth line.\nThe fifth line.')
  expected: "TT\nhh\nee\n  \nff\noi\nuf\nrt\nth\nh \n l\nli\nin\nne\ne.\n."
- expression: transpose('The first line.\nThe second line.')
  expected: "TT\nhh\nee\n  \nfs\nie\nrc\nso\ntn\n d\nl \nil\nni\nen\n.e\n ."
- expression: transpose('The longest line.\nA long line.\nA longer line.\nA line.')
  expected: "TAAA\nh   \nelll\n ooi\nlnnn\nogge\nn e.\nglr\nei \nsnl\ntei\n .n\nl e\ni .\nn\ne\n."
- expression: transpose('HEART\nEMBER\nABUSE\nRESIN\nTREND')
  expected: |-
    HEART
    EMBER
    ABUSE
    RESIN
    TREND
- expression: transpose('FRACTURE\nOUTLINED\nBLOOMING\nSEPTETTE')
  expected: |-
    FOBS
    RULE
    ATOP
    CLOT
    TIME
    UNIT
    RENT
    EDGE
- expression: transpose('T\nEE\nAAA\nSSSS\nEEEEE\nRRRRRR')
  expected: |-
    TEASER
     EASER
      ASER
       SER
        ER
         R
- expression: transpose('11\n2\n3333\n444\n555555\n66666')
  expected: |-
    123456
    1 3456
      3456
      3 56
        56
        5
