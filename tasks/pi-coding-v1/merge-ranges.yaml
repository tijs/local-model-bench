name: merge-ranges
prompt: Implement merge_ranges(items) in ranges.py. Merge overlapping or adjacent closed integer intervals,
  sort them, and return a list of tuples. Leave the input unchanged.
files:
  ranges.py: |
    def merge_ranges(items):
        return list(items)
imports: from ranges import merge_ranges
visible:
- expression: merge_ranges([(7,8),(1,3),(4,5)])
  expected:
  - - 1
    - 5
  - - 7
    - 8
hidden:
- expression: merge_ranges([])
  expected: []
- expression: merge_ranges([(2,2),(0,0),(1,1),(2,3)])
  expected:
  - - 0
    - 3
- expression: '(lambda x: (merge_ranges(x), x))([(5,5),(2,2)])'
  expected:
  - - - 2
      - 2
    - - 5
      - 5
  - - - 5
      - 5
    - - 2
      - 2
- expression: all(isinstance(p,tuple) for p in merge_ranges([(1,2)]))
  expected: true
