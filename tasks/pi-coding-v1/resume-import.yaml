name: resume-import
prompt: Fix resume(saved, incoming, limit=None). Simulate an interrupted import by appending at most limit
  new events. Skip IDs already saved or seen in this batch; preserve the first complete record and input
  order. None means unlimited. Do not mutate inputs.
files:
  ingest.py: |
    def resume(saved, incoming, limit=None):
        return list(saved) + list(incoming)[:limit]
imports: from ingest import resume
visible:
- expression: resume([{'id':'a'}],[{'id':'a'},{'id':'b'}],1)
  expected:
  - id: a
  - id: b
hidden:
- expression: resume(resume([], [{'id':2},{'id':2},{'id':3}],1),[{'id':2,'v':1},{'id':3}])
  expected:
  - id: 2
  - id: 3
- expression: resume([], [{'id':3}],0)
  expected: []
- expression: (lambda a,b:(resume(a,b),a,b))([{'id':1}],[{'id':2}])
  expected:
  - - id: 1
    - id: 2
  - - id: 1
  - - id: 2
