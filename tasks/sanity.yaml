suite: sanity
description: >-
  Tier 0 minimum-viability gate. Run this first, before any other suite,
  for every model+inference-engine combo. If sanity-basic fails, skip
  everything else for that combo and log it as not viable — there's no point spending
  20 minutes on coding tasks a model can't even hold a coherent reply
  through. If sanity-basic passes but sanity-tool fails, skip hermes_ops and
  the coding suites (all of them depend on tool use) but log the result —
  "talks fine, can't reliably call tools" is itself a useful, real finding
  about that model.
timeout_seconds: 60
runner: prompt   # not fixture-based — see tasks/SCHEMA.md "prompt-based tasks"

tasks:
  - id: sanity-basic
    title: Bare prompt, no tools, no system-prompt overhead
    type: prompt-response
    difficulty: 0
    prompt_spec:
      system_prompt: ""
      user_prompt: "What is 15 + 27? Answer with only the number, nothing else."
    check:
      type: regex
      pattern: "^42$"

  - id: sanity-tool
    title: Minimal single-tool call, minimal context
    type: tool-call
    difficulty: 0
    prompt_spec:
      system_prompt: "You are a helpful assistant with access to one tool."
      user_prompt: "What is 15 + 27? Use the add_numbers tool to compute it, then tell me the result."
      tools:
        - type: function
          function:
            name: add_numbers
            description: Adds two numbers and returns the sum.
            parameters:
              type: object
              properties:
                a: { type: number }
                b: { type: number }
              required: [a, b]
      mock_tool_responses:
        add_numbers: '{"sum": 42}'
    check:
      type: tool_call_then_response
      expected_tool: add_numbers
      expected_args: { a: 15, b: 27 }
      response_contains: "42"
