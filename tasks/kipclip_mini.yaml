suite: kipclip_mini
languages: [typescript]
# Bumped 1500 -> 3000 (2026-08-27, benchmark v2) -- see kiem_mini.yaml's
# own comment for the full reasoning (composite score now has a time
# component, so a hard kill is no longer needed to keep the leaderboard
# meaningful).
timeout_seconds: 3000

tasks:
  - id: kipclip_mini-feature
    title: Add multi-tag AND filtering for bookmarks
    type: feature
    difficulty: 2
    language: typescript
    prompt: |
      This is a small bookmark-manager library (src/types.ts, src/bookmarks.ts
      already has `findByTag` for a single tag). Implement a new function in
      src/bookmarks.ts:

        export function filterByTags(bookmarks: Bookmark[], tags: string[]): Bookmark[]

      Returning only bookmarks that have every tag in `tags` (AND semantics,
      not OR). An empty `tags` array should return all bookmarks unchanged.
    expected_tools: [file_edit]
    check:
      type: command
      command: "deno task check && deno task test"
      cwd: .
      check_dest: tests
      expect_exit_code: 0

  - id: kipclip_mini-debug
    title: Only one tracking param gets stripped from bookmarked URLs
    type: debug
    difficulty: 2
    language: typescript
    prompt: |
      Bug report: when a bookmarked URL has more than one tracking parameter
      (e.g. both `utm_source` and `fbclid`), only one of them gets stripped
      by `normalizeUrl` — the other stays in the saved URL. Every tracking
      param in TRACKING_PARAMS that's present should be stripped. Find and
      fix the bug in src/url_utils.ts.
    expected_tools: [file_edit]
    check:
      type: command
      command: "deno task check && deno task test"
      cwd: .
      check_dest: tests
      expect_exit_code: 0

  - id: kipclip_mini-testwrite
    title: Write tests for tag normalization
    type: test-writing
    difficulty: 3
    language: typescript
    prompt: |
      src/tag_utils.ts already has `normalizeTag(tag: string): string`
      implemented: it trims, lowercases, collapses any run of
      non-alphanumeric characters (punctuation or whitespace) into a single
      dash, and strips leading/trailing dashes. Write tests for it in
      tests/tag_normalize.test.ts covering: lowercasing, collapsing mixed
      punctuation/whitespace into a single dash, and stripping leading and
      trailing dashes. Do not modify src/tag_utils.ts.
    expected_tools: [file_edit]
    check:
      type: mutation
      agent_test_file: tests/tag_normalize.test.ts
      source_file: src/tag_utils.ts
      test_command: "deno test tests/tag_normalize.test.ts"
      mutants:
        - checks/kipclip_mini/kipclip_mini-testwrite/mutants/mutant1_tag_utils.ts
        - checks/kipclip_mini/kipclip_mini-testwrite/mutants/mutant2_tag_utils.ts
      require_kill: all

  - id: kipclip_mini-merge
    title: Deduplicate bookmarks by hostname case when merging an import
    type: debug
    difficulty: 3
    language: typescript
    prompt: |
      This library has a new src/import_merge.ts with:

        export function mergeImports(existing: Bookmark[], incoming: Bookmark[]): Bookmark[]

      It's meant to merge an imported batch of bookmarks into an existing
      list: an incoming bookmark whose URL already exists should be merged
      into the existing entry (keeping the existing entry, unioning both
      copies' tags), not added as a second entry; an incoming bookmark with
      no matching URL should be appended unchanged.

      Bug report: importing a bookmark whose URL differs from an existing
      one only by hostname case (e.g. existing "https://example.com/a" and
      incoming "https://EXAMPLE.com/a") is not recognized as a duplicate —
      it gets added as a second entry instead of being merged. Find and fix
      the bug in src/import_merge.ts.
    expected_tools: [file_edit]
    check:
      type: command
      command: "deno task check && deno task test"
      cwd: .
      check_dest: tests
      expect_exit_code: 0
