suite: hearth_full
languages: [typescript]
# Same reasoning as hearth_mini.yaml/kiem_mini.yaml's own comment: the
# composite score has a time component now, so a hard kill before a
# slow-but-correct model finishes is no longer needed to keep the
# leaderboard meaningful.
timeout_seconds: 3000

tasks:
  - id: hearth_full-feature
    title: Add the market building and resource trading
    type: feature
    difficulty: 3
    language: typescript
    prompt: |
      This settlement-simulation library is organized as src/types.ts
      (shared types), src/resources/ (costs, production, storage caps),
      src/buildings/ (what can be built and how), and src/sim/ (turn
      advancement, events, history). Add a new building kind, "market",
      costing `{ wood: 20, stone: 15 }`, which requires a "storehouse" to
      already be built before it's available. Then implement, in a new
      module `src/sim/trade.ts`:

        export function sellResource(settlement: Settlement, resource: ResourceKind, amount: number): Settlement

      Converting `amount` of the given resource into stone at a 2:1 ratio
      (rounded down), never taking the sold resource below 0. Throws if no
      market is built. Export it from src/sim/index.ts alongside the
      module's other exports.
    expected_tools: [file_edit]
    check:
      type: command
      command: "npm test"
      cwd: .
      check_dest: tests
      expect_exit_code: 0

  - id: hearth_full-debug
    title: Food stockpiles ignore storage limits
    type: debug
    difficulty: 3
    language: typescript
    prompt: |
      Playtesters report that food stockpiles keep climbing well past what
      storehouses should allow, even though wood and stone are correctly
      capped at the same storage limit. Find and fix the bug so food is
      capped the same way every other resource already is.
    expected_tools: [file_edit]
    check:
      type: command
      command: "npm test"
      cwd: .
      check_dest: tests
      expect_exit_code: 0

  - id: hearth_full-testwrite
    title: Write tests for building repair
    type: test-writing
    difficulty: 3
    language: typescript
    prompt: |
      src/buildings/actions.ts already has `repairBuilding(settlement, kind)`
      implemented: it repairs an already-built building for half its
      original cost (rounded up, per resource), is a no-op if the
      settlement doesn't have that building, and never takes any resource
      below 0. Write tests for it in tests/repair.test.ts covering all
      three of those behaviors, including a rounding-up case (an
      odd-numbered cost, e.g. storehouse) and a case where the settlement
      has less of a resource than the repair would cost. Do not modify
      src/buildings/actions.ts.
    expected_tools: [file_edit]
    check:
      type: mutation
      agent_test_file: tests/repair.test.ts
      source_file: src/buildings/actions.ts
      test_command: "npx vitest run tests/repair.test.ts"
      mutants:
        - checks/hearth_full/hearth_full-testwrite/mutants/mutant1_actions.ts
        - checks/hearth_full/hearth_full-testwrite/mutants/mutant2_actions.ts
        - checks/hearth_full/hearth_full-testwrite/mutants/mutant3_actions.ts
      require_kill: all
