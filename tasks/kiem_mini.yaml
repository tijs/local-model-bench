suite: kiem_mini
languages: [rust, swift]
timeout_seconds: 1500

tasks:
  - id: kiem_mini-feature
    title: Add a tag filter to the notes CLI
    type: feature
    difficulty: 2
    language: rust
    prompt: |
      This is a small notes CLI (notekeep) with `Note` { id, title, body,
      tags, pinned } and `kiem_mini/rust` as its crate root. Implement a new
      public function in src/lib.rs:

        pub fn filter_by_tag<'a>(notes: &'a [Note], tag: &str) -> Vec<&'a Note>

      It should return the notes whose `tags` contain exactly `tag` (exact
      match, not substring), preserving their relative order. Then wire a
      `--tag <TAG>` flag into the `list` CLI command in src/main.rs so it
      filters output through this function when given.
    expected_tools: [file_edit, cargo]
    check:
      type: command
      command: "cargo test --test check_tag_filter"
      cwd: rust
      check_dest: rust/tests
      expect_exit_code: 0

  - id: kiem_mini-debug
    title: Fix tags not being recognized near punctuation
    type: debug
    difficulty: 2
    language: swift
    prompt: |
      Users report that tags right next to punctuation aren't being picked
      up — e.g. a note body of "shopping list,#urgent." doesn't register
      #urgent as a tag, and "(#ideas)" doesn't register #ideas either. Find
      and fix the bug in `extractTags(from:)` in
      Sources/NoteKit/NoteKit.swift so a tag is recognized as '#' followed by
      one or more letters/digits/'-'/'_', regardless of surrounding
      punctuation, while still returning tags in the order they appear.
    expected_tools: [file_edit]
    check:
      type: command
      command: "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test"
      cwd: swift
      check_dest: swift/Tests/NoteKitTests
      expect_exit_code: 0

  - id: kiem_mini-testwrite
    title: Write tests for note pinning behavior
    type: test-writing
    difficulty: 3
    language: rust
    prompt: |
      This crate has pinning support already implemented in src/lib.rs:

        pub fn pin(notes: &mut [Note], id: &str)
        pub fn unpin(notes: &mut [Note], id: &str)
        pub fn ordered_pinned_first(notes: &[Note]) -> Vec<&Note>

      Write tests for this behavior in a new file, tests/pin_behavior.rs.
      Cover at minimum: pinning a note sets its `pinned` flag; unpinning
      clears it; pinning/unpinning a note by an id that doesn't exist in the
      slice is a harmless no-op; `ordered_pinned_first` puts every pinned
      note before every unpinned note while preserving each group's relative
      order. Do not modify src/lib.rs.
    expected_tools: [file_edit, cargo]
    check:
      type: mutation
      agent_test_file: rust/tests/pin_behavior.rs
      source_file: rust/src/lib.rs
      test_command: "cargo test --test pin_behavior"
      mutants:
        - checks/kiem_mini/kiem_mini-testwrite/mutants/mutant1_lib.rs
        - checks/kiem_mini/kiem_mini-testwrite/mutants/mutant2_lib.rs
      require_kill: all
