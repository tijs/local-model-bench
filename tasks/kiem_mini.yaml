suite: kiem_mini
languages: [rust, swift]
timeout_seconds: 1500

tasks:
  - id: kiem_mini-feature
    title: Add a tag filter to the notes CLI
    type: feature
    difficulty: 2
    language: rust
    prompt: |
      This is a small notes CLI (notekeep) with `Note` { id, title, body,
      tags, pinned } and `kiem_mini/rust` as its crate root. Implement a new
      public function in src/lib.rs:

        pub fn filter_by_tag<'a>(notes: &'a [Note], tag: &str) -> Vec<&'a Note>

      It should return the notes whose `tags` contain exactly `tag` (exact
      match, not substring), preserving their relative order. Then wire a
      `--tag <TAG>` flag into the `list` CLI command in src/main.rs so it
      filters output through this function when given.
    expected_tools: [file_edit, cargo]
    check:
      # Plain `cargo test` (no --test filter) runs every test binary in
      # tests/: the two held-out files overlaid at grading time
      # (check_tag_filter.rs, check_cli_tag_flag.rs) AND the fixture's own
      # pre-existing tests/basic.rs — a PASS_TO_PASS guard so a change that
      # breaks an unrelated function (e.g. extract_tags) can't pass just
      # because the grader only ever looked at the one new test target.
      type: command
      command: "cargo test"
      cwd: rust
      check_dest: rust/tests
      expect_exit_code: 0

  - id: kiem_mini-rename
    title: Rename a stored note without leaving a duplicate on disk
    type: feature
    difficulty: 4
    language: rust
    prompt: |
      notekeep's notes are persisted one-file-per-note under a data
      directory (see src/store.rs's `save`/`load_all`) — the file name is
      derived from the note's id, and the id is also stored as the first
      field inside the file's own content.

      Implement a new public function in src/store.rs:

        pub fn rename(dir: &Path, old_id: &str, new_id: &str, new_title: &str) -> std::io::Result<()>

      It should change an existing stored note's id to `new_id` and its
      title to `new_title`, leaving its body, tags, and pinned state
      unchanged. After calling it, `load_all(dir)` must return exactly one
      note for it — with the new id and title — and there must be no
      trace of the note under its old id left on disk.
      # Added 2026-08-22 (methodology review, findings F10 + F11): F10
      # found the language mix inverted relative to real usage (6 of 9
      # tasks TypeScript, only 2 Rust, 1 Swift, despite AGENTS.md
      # describing TS as the LIGHTEST of the three in real use) — this
      # shifts the balance toward Rust. F11 found difficulty capped at
      # 3/5 across every existing task — this is difficulty 4:
      # store.rs's on-disk format embeds the id in BOTH the filename
      # (`{id}.note`) and the file's own content, so a rename that only
      # updates one of the two (e.g. writes a new file but never deletes
      # the old one) leaves a stale duplicate that load_all() will
      # silently return alongside the renamed note — a real,
      # easy-to-miss cross-representation consistency bug, not a
      # transcribable spec like the earlier feature task.
    expected_tools: [file_edit, cargo]
    check:
      type: command
      command: "cargo test"
      cwd: rust
      check_dest: rust/tests
      expect_exit_code: 0

  - id: kiem_mini-debug
    title: Fix tags not being recognized near punctuation
    type: debug
    difficulty: 2
    language: swift
    prompt: |
      Users report that some tags aren't being picked up in their notes.
      Two examples that should work but currently don't: a note body of
      "shopping list,#urgent." should register #urgent as a tag, and
      "(#ideas)" should register #ideas. Find the bug in `extractTags(from:)`
      in Sources/NoteKit/NoteKit.swift and fix it so both examples work,
      without regressing any tag extraction that already works today, and
      while still returning tags in the order they appear.
      # Rewritten 2026-08-22 (methodology review, finding F11): the previous
      # prompt handed over the exact target character-class specification
      # ("recognized as '#' followed by one or more letters/digits/'-'/'_'"),
      # which — combined with a doc comment on extractTags itself that
      # stated the bug verbatim — meant no actual diagnosis was required,
      # just transcription of a given spec. This version gives only the two
      # symptom examples (still enough to make "correct" unambiguous once
      # the held-out check is applied) and requires reading the existing
      # implementation to find why it fails, then generalizing a fix that
      # also handles cases the examples don't literally spell out (multiple
      # tags with different punctuation separators, still-plain tags) — see
      # checks/kiem_mini/kiem_mini-debug/CheckExtractTagsPunctuation.swift,
      # unchanged, which still grades all of that.
    expected_tools: [file_edit]
    check:
      type: command
      command: "DEVELOPER_DIR=$(xcode-select -p) swift test"
      cwd: swift
      check_dest: swift/Tests/NoteKitTests
      expect_exit_code: 0

  - id: kiem_mini-testwrite
    title: Write tests for note pinning behavior
    type: test-writing
    difficulty: 3
    language: rust
    prompt: |
      This crate has pinning support already implemented in src/lib.rs:

        pub fn pin(notes: &mut [Note], id: &str)
        pub fn unpin(notes: &mut [Note], id: &str)
        pub fn ordered_pinned_first(notes: &[Note]) -> Vec<&Note>

      Write tests for this behavior in a new file, tests/pin_behavior.rs.
      Cover at minimum: pinning a note sets its `pinned` flag; unpinning
      clears it; pinning/unpinning a note by an id that doesn't exist in the
      slice is a harmless no-op; `ordered_pinned_first` puts every pinned
      note before every unpinned note while preserving each group's relative
      order. Do not modify src/lib.rs.
    expected_tools: [file_edit, cargo]
    check:
      type: mutation
      agent_test_file: rust/tests/pin_behavior.rs
      source_file: rust/src/lib.rs
      test_command: "cargo test --test pin_behavior"
      cwd: rust
      mutants:
        - checks/kiem_mini/kiem_mini-testwrite/mutants/mutant1_lib.rs
        - checks/kiem_mini/kiem_mini-testwrite/mutants/mutant2_lib.rs
      require_kill: all
