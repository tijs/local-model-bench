suite: hearth_and_oar
repo: ~/projects/hearth-and-oar
languages: [javascript, typescript]
base_ref: main
timeout_seconds: 900

tasks:
  - id: hearth-01
    title: Add a new exceptional location action
    difficulty: 1
    language: typescript
    prompt: |
      Add a new exceptional location action (alongside the existing
      danger/sacred-style actions) in src/simulation/game.ts, extending
      `exceptionalCopy` and `takeLocationAction`. Give it a plausible
      resource/reputation effect and player-facing message. Add a test in
      game.test.ts asserting the resource delta and message.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "npm test && npm run typecheck"
      cwd: .
      expect_exit_code: 0

  - id: hearth-02
    title: Add a new construction kind
    difficulty: 2
    language: typescript
    prompt: |
      Add a new ConstructionKind (e.g. "storehouse") in
      src/simulation/types.ts's CONSTRUCTION_KINDS and the cost table in
      game.ts, wired into availableConstructionProjects with a sensible
      prerequisite. Add a test asserting it appears once its prerequisite is
      built, with the correct cost.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "npm run build && npm test"
      cwd: .
      expect_exit_code: 0

  - id: hearth-03
    title: Fix a boundary-condition bug in population aging
    difficulty: 3
    language: typescript
    prompt: |
      Review the aging/birth-eligibility logic in `advancePopulation` in
      src/simulation/game.ts. Find and fix an edge case where a boundary
      condition on health or mood is handled incorrectly (off-by-one, wrong
      comparison operator, or missing bound). Add a test in game.test.ts that
      reproduces the bug and confirms the fix.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "npm test"
      cwd: .
      expect_exit_code: 0

  - id: hearth-04
    title: Add a housing-overcrowding HUD indicator
    difficulty: 3
    language: typescript
    prompt: |
      Add a HUD element in src/main.ts (renderHud) and index.html markup that
      shows a warning indicator when housing is overcrowded (population
      exceeds housing capacity). Add a DOM-based test similar in style to the
      existing dock-summary/touch-targets tests asserting the element appears
      with correct text/attributes under overcrowded conditions.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "npm test && npm run lint"
      cwd: .
      expect_exit_code: 0

  - id: hearth-05
    title: Add a new expedition event branch
    difficulty: 5
    language: typescript
    prompt: |
      Add a new ExpeditionIntent/event branch in src/simulation/game.ts
      (extending chooseExpeditionEvent and finishExpedition) with a new
      resource/reputation outcome, plus any new type needed in types.ts.
      Cover it with tests exercising the full flow: prepareExpedition ->
      launchExpedition -> chooseExpeditionEvent -> finishExpedition.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "npm run check"
      cwd: .
      expect_exit_code: 0
