name: page-cursors
prompt: Repair both store.page and client.collect. page(items,cursor,size) returns (slice,next_cursor);
  cursor is an integer offset or None for zero, next_cursor is None at end. collect(items,size) follows
  pages and returns all items in order. Assume size >= 1. Duplicates are valid.
files:
  store.py: |
    def page(items, cursor, size):
        start = cursor or 0
        return items[start:start+size], None
  client.py: |
    from store import page

    def collect(items, size):
        return page(items, None, size)[0]
imports: |-
  from store import page
  from client import collect
visible:
- expression: collect(['a','b','c'],2)
  expected:
  - a
  - b
  - c
hidden:
- expression: page([1,1,2],None,1)
  expected:
  - - 1
  - 1
- expression: page([1,2,3,4],2,2)
  expected:
  - - 3
    - 4
  - null
- expression: collect([1,1,1,2,2],2)
  expected:
  - 1
  - 1
  - 1
  - 2
  - 2
- expression: page([],None,2)
  expected:
  - []
  - null
