name: temporal-overlay
prompt: |
  Repair the revisioned availability calendar. render(records, lo, hi, asof) returns
  [start,end,value] segments for the half-open window [lo,hi). Each record is
  [key,revision,start,end,value]. For each key use its highest revision <= asof;
  last input record wins ties for that key. A null value retracts that key entirely.
  Select revisions before clipping to the window, even if an update moves away or
  has empty bounds. At overlapping points choose the active key with highest
  revision, breaking ties by lexicographically smallest key. Omit gaps. Merge
  adjacent equal values even across different winners, never across gaps. Return
  [] for an empty window. evaluate(records, windows) returns render results in
  input order for [lo,hi,asof] queries. No call may mutate inputs. Timestamps are
  signed integers, potentially trillions apart; operate on boundaries, not ticks.
files:
  calendar_store.py: |
    def latest(records, asof):
        result = {}
        for key, rev, start, end, value in records:
            if rev <= asof:
                result[key] = (rev, start, end, value)
        return result
  timeline.py: |
    from calendar_store import latest

    def render(records, lo, hi, asof):
        return sorted([max(lo,s),min(hi,e),v] for _,s,e,v in latest(records,asof).values()
                      if v is not None and s < hi and e > lo)

    def evaluate(records, windows):
        return [render(records,lo,hi,t) for lo,hi,t in windows]
imports: |
  from timeline import render, evaluate
  r=[['a',1,0,10,'A'],['b',2,3,7,'B']]
visible:
- expression: "render(r,0,10,2)"
  expected: [[0,3,A],[3,7,B],[7,10,A]]
- expression: "render(r,2,8,1)"
  expected: [[2,8,A]]
hidden:
- expression: "evaluate(r+[['b',3,0,0,None]],[[2,9,3],[3,7,2],[6,6,5]])"
  expected: [[[2,9,A]],[[3,7,B]],[]]
- expression: "render([['b',2,0,4,'B'],['a',2,1,3,'A'],['a',1,0,4,'old']],0,4,9)"
  expected: [[0,1,B],[1,3,A],[3,4,B]]
- expression: "render(r+[['b',2,9,10,'B']],0,8,4)"
  expected: [[0,8,A]]
- expression: "render([['a',2,0,2,'X'],['b',1,2,4,'X'],['c',1,5,6,'X']],0,6,2)"
  expected: [[0,4,X],[5,6,X]]
- expression: "render(r+[['a',3,8,8,'z']],0,10,3)"
  expected: [[3,7,B]]
- expression: "render([['x',2,-10**12,10**12,'X']],-10**12,10**12,2)"
  expected: [[-1000000000000,1000000000000,X]]
- expression: "(lambda rows:(evaluate(rows,[[0,4,2],[1,6,1]]),rows)[1])(list(reversed(r)))"
  expected: [[b,2,3,7,B],[a,1,0,10,A]]
