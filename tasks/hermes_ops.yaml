suite: hermes_ops
description: >-
  Tier 1: tool-use behavior under Hermes's real operating conditions — a
  ~26-27K-token fixed system prompt + 41-tool manifest (see
  fixtures/hermes_ops/README.md for provenance) — not coding ability. Run
  after sanity passes, before the coding suites. All tools in the manifest
  are present in every task; only 1-2 are ever actually relevant, so a wrong
  tool call or a hallucinated tool name is itself a meaningful failure.
timeout_seconds: 1000
  # Bumped from 120s -> 600s -> 1000s 2026-08-19. Must stay above whatever
  # --timeout a model's own server is configured with (e.g.
  # vllm_mlx.server's --timeout 900 for Qwen3.8-27B/mlx.yaml) — otherwise
  # the CLIENT gives up before the server's own generous window closes,
  # defeating the point of raising the server-side timeout. A generous
  # timeout is harmless for small/fast models (they just don't use the full
  # budget); too short a timeout for a large model looks identical to a
  # hung/failing model, which is misleading.
max_turns: 40
  # CRITICAL FIX, discovered live 2026-08-20: run_prompt_suite.py never
  # passed --max-turns to run_prompt.py at all before this fix, so EVERY
  # hermes_ops run in this benchmark used run_prompt.py's hardcoded CLI
  # default of 6 — an arbitrary number, never researched or matched against
  # anything. This suite's own stated goal is testing tool-use "under
  # Hermes's real operating conditions" (see description above), but 6 is
  # dramatically tighter than hermes's actual configured max_turns (40 in
  # THIS benchmark's own ~/.hermes/profiles/bench/config.yaml, 150 in
  # Tijs's main daily-driver config) — so the suite was testing "can this
  # model conclude within an artificially tiny budget," not real operating
  # conditions. Verified concretely on Qwen3.8-27B GGUF's error-recovery
  # task: at max_turns=6 it hits 'exceeded max_turns' with no final answer;
  # at max_turns=15 (same model, same temperature=0, same everything else)
  # it converges cleanly at turn 11 with a correct, complete answer that
  # passes the check. The model wasn't stuck in an infinite loop — it was
  # doing reasonable (if inefficient) diagnostic exploration (retrying
  # different path variants, even attempting execute_code as a fallback)
  # and simply ran out of an artificially small turn budget. Set to 40 to
  # match this benchmark's own bench profile exactly, not a new arbitrary
  # guess. 14 log rows across nearly every model tested this session
  # (chaining and selection failures too, not just error-recovery) hit
  # 'exceeded max_turns' under the old default and needed rerunning under
  # this fix — see kiem notes / commit history for exactly which.
runner: prompt

tasks:
  - id: hermes_ops-selection
    title: Pick the right tool out of 41 available
    type: tool-selection
    difficulty: 2
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: "What's the current weather in Amsterdam?"
      mock_tool_responses:
        web_search: '{"results": [{"title": "Amsterdam weather", "snippet": "Currently 18C, light rain, wind 15km/h."}]}'
    check:
      type: tool_call_then_response
      expected_tool: web_search
      expected_args: {}
      response_contains: "18"

  - id: hermes_ops-chaining
    title: Two-step tool chain, second call depends on the first's result
    type: tool-chaining
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        Search the web for the current population of Amsterdam, then write
        just that number to a file called population.txt.
      mock_tool_responses:
        web_search: '{"results": [{"title": "Amsterdam population", "snippet": "Amsterdam has a population of 912046."}]}'
        write_file: '{"status": "ok", "bytes_written": 6}'
    check:
      type: chained_tool_calls
      expected_sequence: [web_search, write_file]
      write_file_arg_contains: "912046"

  - id: hermes_ops-error-recovery
    title: Tool call fails — must not hallucinate success or loop
    type: error-recovery
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: "Read the file called notes.txt and tell me what it says."
      force_tool_error: [read_file]
      mock_tool_responses:
        search_files: '{"matches": []}'
        terminal: '{"stdout": "ls: notes.txt: No such file or directory", "exit_code": 1}'
    check:
      type: contains_any
      phrases:
        - "couldn't find"
        - "could not find"
        - "not found"
        - "doesn't exist"
        - "does not exist"
        - "no such file"
        - "unable to"
        - "failed"
        - "error"
