suite: hermes_ops
description: >-
  Tier 1: tool-use behavior under Hermes's real operating conditions — a
  ~26-27K-token fixed system prompt + 41-tool manifest (see
  fixtures/hermes_ops/README.md for provenance) — not coding ability. Run
  after sanity passes, before the coding suites. All tools in the manifest
  are present in every task; only 1-2 are ever actually relevant, so a wrong
  tool call or a hallucinated tool name is itself a meaningful failure.
timeout_seconds: 1000
  # TOTAL budget for ONE HTTP turn (see tasks/SCHEMA.md, "Timeout and
  # liveness budgets"). Bumped from 120s -> 600s -> 1000s 2026-08-19. Must
  # stay above whatever --timeout a model's own server is configured with
  # (e.g. vllm_mlx.server's --timeout 900 for Qwen3.8-27B/mlx.yaml) —
  # otherwise the CLIENT gives up before the server's own generous window
  # closes, defeating the point of raising the server-side timeout. A
  # generous timeout is harmless for small/fast models (they just don't use
  # the full budget); too short a timeout for a large model looks identical
  # to a hung/failing model, which is misleading.
  #
  # Deliberately NOT lowered by the 2026-08-25 timeout/liveness redesign:
  # the value is fine, the problem was that it was the ONLY bound and was
  # applied as a socket INACTIVITY timeout, so an occasional dribble of
  # bytes kept a stalled stream alive indefinitely. Slow-but-progressing
  # models genuinely need this much (a passing hermes_ops-selection row on
  # scottlowry/Ornith-1.5-9B-oQ4e-fp16 took 1277.383s across its turns, and
  # passing hermes_ops rows reach 8839.930s overall) — the fix is the three
  # budgets below, not a smaller number here.
task_timeout_seconds: 14400
  # 4 hours: the total budget for ONE task (all its turns together),
  # enforced by run_prompt_suite.py as a process-group kill with partial
  # output preserved. Replaces the old DERIVED ceiling of
  # timeout_seconds * max_turns + 60 = 40060s ≈ 11 hours, which was not a
  # deliberate choice and was actually reached: an Ornith-1.5-9B oMLX run
  # sat stalled for a full 11 hours before a human killed it, and at least
  # four other oMLX configs had to be killed by hand after 2+ hours in the
  # same session. Still comfortably above the slowest genuine PASS ever
  # recorded here (8839.9s ≈ 2.5h).
first_progress_timeout_seconds: 600
  # Response headers -> first MEANINGFUL SSE event (content delta, tool-call
  # delta, finish_reason, or [DONE] — NOT blank lines, SSE comments,
  # keepalives, or usage-only chunks). Generous because this suite's
  # ~26-27K-token fixed system prompt is mostly prefill, and prefill emits
  # nothing at all on most backends.
stream_idle_timeout_seconds: 300
  # Gap BETWEEN two meaningful events. This is the watchdog that actually
  # catches the observed oMLX failure mode — a stream that emits one small
  # partial response and then never converges — in minutes rather than
  # hours. A slow-but-progressing model is unaffected: it only has to
  # produce SOMETHING every 5 minutes, which even the slowest config in
  # results/log.jsonl (0.15 tok/s) clears by a wide margin.
max_turns: 40
  # CRITICAL FIX, discovered live 2026-08-20: run_prompt_suite.py never
  # passed --max-turns to run_prompt.py at all before this fix, so EVERY
  # hermes_ops run in this benchmark used run_prompt.py's hardcoded CLI
  # default of 6 — an arbitrary number, never researched or matched against
  # anything. This suite's own stated goal is testing tool-use "under
  # Hermes's real operating conditions" (see description above), but 6 is
  # dramatically tighter than hermes's actual configured max_turns (40 in
  # THIS benchmark's own ~/.hermes/profiles/bench/config.yaml, 150 in
  # Tijs's main daily-driver config) — so the suite was testing "can this
  # model conclude within an artificially tiny budget," not real operating
  # conditions. Verified concretely on Qwen3.8-27B GGUF's error-recovery
  # task: at max_turns=6 it hits 'exceeded max_turns' with no final answer;
  # at max_turns=15 (same model, same temperature=0, same everything else)
  # it converges cleanly at turn 11 with a correct, complete answer that
  # passes the check. The model wasn't stuck in an infinite loop — it was
  # doing reasonable (if inefficient) diagnostic exploration (retrying
  # different path variants, even attempting execute_code as a fallback)
  # and simply ran out of an artificially small turn budget. Set to 40 to
  # match this benchmark's own bench profile exactly, not a new arbitrary
  # guess. 14 log rows across nearly every model tested this session
  # (chaining and selection failures too, not just error-recovery) hit
  # 'exceeded max_turns' under the old default and needed rerunning under
  # this fix — see kiem notes / commit history for exactly which.
runner: prompt

tasks:
  - id: hermes_ops-selection
    title: Pick the right tool out of 41 available
    type: tool-selection
    difficulty: 2
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: "What's the current weather in Amsterdam?"
      mock_tool_responses:
        web_search: '{"results": [{"title": "Amsterdam weather", "snippet": "Currently 18C, light rain, wind 15km/h."}]}'
    check:
      type: tool_call_then_response
      expected_tool: web_search
      expected_args: {}
      # Added 2026-08-21 (2nd adversarial review, finding M-3):
      # mock_tool_responses is keyed by tool name only, so any web_search
      # call got the Amsterdam-weather mock back regardless of its actual
      # query — this task is titled "Pick the right tool out of 41
      # available" but never verified the model searched for anything
      # relevant, only that SOME call to web_search happened.
      expected_args_match:
        query: "amsterdam"
      # A bare `response_contains: "18"` matched "18" as a substring of
      # ANYTHING, including "2018" or "180" — confirmed adversarially: "In a
      # 2018 article, I could not retrieve the weather" passed (adversarial
      # review finding L4). response_matches with digit-boundary lookaround
      # requires "18" as a standalone number instead — but that alone still
      # matched a standalone "18" from anything else in the mock, e.g. "The
      # wind is 18 km/h but I could not get the temperature" (the mock's
      # wind speed is a DIFFERENT number, 15km/h, but this exact phrasing
      # would have coincidentally hit "18" anyway) — confirmed adversarially
      # (2nd review, finding L-9). Anchored to the actual unit (C/°C) so it
      # can only match the temperature value the mock actually returned.
      response_matches: "(?<!\\d)18\\s*(?:°\\s*C\\b|C\\b|degrees?\\s*Celsius\\b)"
      # CRITICAL BUG, found by a third independent adversarial review
      # 2026-08-21 (finding CR3-10): the previous pattern made "Celsius"
      # OPTIONAL after "degrees?", so a bare "18 degrees" — of anything,
      # not necessarily temperature — matched. Confirmed live:
      # "The wind is 18 degrees off north; I could not get the
      # temperature." passed, even though the model explicitly said it
      # could NOT get the temperature. "Celsius" is now mandatory when the
      # spelled-out word is used; "C"/"°C" alone are still accepted since
      # that unit is unambiguous in this context.
      #
      # response_matches is now case-INSENSITIVE (grade_prompt.py's
      # re.search gained re.IGNORECASE — same finding, second half): a
      # correct lowercase "18c" answer used to fail this check purely on
      # casing. Verified both fixes live: the "18 degrees off north" case
      # now correctly fails, a lowercase "it's currently 18c" now
      # correctly passes, and the original true-positive phrasings ("18C",
      # "18 C", "18°C", "18 degrees Celsius") all still pass.

  - id: hermes_ops-chaining
    title: Two-step tool chain, second call depends on the first's result
    type: tool-chaining
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        Search the web for the current population of Amsterdam, then write
        just that number to a file called population.txt.
      mock_tool_responses:
        web_search: '{"results": [{"title": "Amsterdam population", "snippet": "Amsterdam has a population of 912046."}]}'
        write_file: '{"status": "ok", "bytes_written": 6}'
    check:
      type: chained_tool_calls
      expected_sequence: [web_search, write_file]
      # write_file_arg_equals, not _contains (adversarial review finding
      # L5): the prompt says "just that number" — a _contains check would
      # pass a file containing "The population is 912046 people.", which
      # isn't what was asked for. The mock's own bytes_written: 6 already
      # implied an exact 6-character expectation.
      write_file_arg_equals: "912046"
      # Added 2026-08-21 (2nd adversarial review, finding M-2): nothing
      # previously checked the path itself — a write_file call to any
      # location at all, as long as the content matched, satisfied a
      # prompt that specifically says "a file called population.txt".
      write_file_arg_path: "population.txt"

  - id: hermes_ops-error-recovery
    title: Tool call fails — must not hallucinate success or loop
    type: error-recovery
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: "Read the file called notes.txt and tell me what it says."
      force_tool_error: [read_file]
      mock_tool_responses:
        search_files: '{"matches": []}'
        terminal: '{"stdout": "ls: notes.txt: No such file or directory", "exit_code": 1}'
    check:
      type: contains_any
      phrases:
        - "couldn't find"
        - "could not find"
        - "couldn't locate"
        - "could not locate"
        - "could not be located"
        - "no matching file"
        - "not found"
        - "doesn't exist"
        - "does not exist"
        - "no such file"
      # "could not be located" / "no matching file" added 2026-08-20 after
      # LFM2.5-8B-A1B's DSpark config produced a genuinely correct answer
      # ("it appears that notes.txt could not be located; no matching file
      # was found") that this check failed on pure substring strictness —
      # a grading gap, not a model deficiency, and one that would silently
      # penalize any model phrasing the same correct diagnosis this way.
      #
      # "unable to" / "failed" REMOVED 2026-08-21 (adversarial review,
      # finding C2): those two words are so generic that a model narrating
      # the tool's own error text, or fabricating the file's contents
      # while mentioning "no errors occurred" elsewhere, still passed —
      # confirmed live: "I read notes.txt for you. It says: 'Buy milk...'"
      # passed this check purely because some sentence nearby happened to
      # contain "failed"/"error"-adjacent wording. This task's own title
      # is "must not hallucinate success or loop" — a positive keyword
      # match was never proof of that; see must_not_contain_any below for
      # the actual guard against exactly this failure mode.
      must_not_match: >-
        (?<!what )(?:the file|notes\.txt)\s+(?:says|contains|reads)|(?<!what
        )the contents of notes\.txt|(?:it says|here'?s?\s+(?:is\s+)?what it
        says)(?!.{0,80}?(?:no such file|not found|does not exist|doesn'?t
        exist|could not be located|no matching file|couldn'?t find|could not
        find))
      # None of this task's mock tool responses (search_files: no matches,
      # terminal: "No such file or directory") ever supply real file
      # content — so any answer that reports the file's contents is
      # fabricating them outright, regardless of what else it says. This
      # is a hard veto, checked before the positive phrases above, so a
      # fabricated-content answer can't slip through by also mentioning an
      # unrelated correct-sounding word.
      #
      # CRITICAL BUG, found by a second independent adversarial review
      # 2026-08-21: a stray "- "error"" line used to sit here, at the same
      # indentation as must_not_contain_any's items, with only a COMMENT
      # block (not a real list boundary) separating it from them. YAML
      # comments don't terminate a list, so it silently became this list's
      # 9th item — inverting "error" from a word I'd deliberately REMOVED
      # from the positive phrases (see above) into a hard VETO that failed
      # any answer mentioning the word "error" at all, including the most
      # natural correct phrasing of this exact task ("the tool returned an
      # error: the file does not exist"). Confirmed live: this flipped a
      # textbook-correct answer to FAIL. Deleted outright — "error" should
      # never have been in this check at all, positively or negatively.
      #
      # CRITICAL BUG, found by a third independent adversarial review
      # 2026-08-21 (finding CR3-3): the plain-substring must_not_contain_any
      # list above ("it says", "the file contains", etc.) was still broad
      # enough to veto legitimate correct answers that QUOTE the mock's own
      # real error text, or that explicitly state they don't know the
      # content (a negation, not a fabrication). Confirmed live — all three
      # failed the OLD check despite being correct:
      #   "I tried to read notes.txt, but it says 'No such file or
      #   directory'." (quotes the mock's real terminal output verbatim)
      #   "notes.txt does not exist - here's what it says in the terminal:
      #   ls: notes.txt: No such file or directory" (same, different phrasing)
      #   "I checked and there is no such file; I can't tell you what the
      #   file contains because it isn't there." (explicit negation, not a
      #   content claim)
      # Replaced the substring list with a single regex that keeps the
      # original veto's INTENT (catch a claimed file content that isn't the
      # mock's real error text) while discriminating these cases:
      #   - "the file"/"notes.txt" + says/contains/reads, or "the contents
      #     of notes.txt", is NOT forbidden when immediately preceded by
      #     "what " (catches the reported-question/negation shape: "...tell
      #     you WHAT THE FILE CONTAINS because...").
      #   - "it says" / "here's what it says" is NOT forbidden when the
      #     mock's own real error vocabulary ("no such file", "not found",
      #     "does not exist", "could not be located", etc. — the same terms
      #     already required positively above) appears within the next 80
      #     characters, i.e. the model is quoting/paraphrasing the actual
      #     tool output rather than inventing new content.
      # Verified against both original C2 fabrication examples (still
      # correctly vetoed) and all three CR3-3 false-negative examples above
      # (now correctly pass), plus additional sanity cases (a subject-first
      # "the contents of notes.txt are: ..." fabrication; a negated "I don't
      # know what the contents of notes.txt are" correct answer) — see
      # commit message for the exact verification script.

  - id: hermes_ops-targeted-edit
    title: Prefer a targeted patch over a full-file rewrite for a small change
    type: tool-selection
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        The app config at ~/app/notes_config.json has auto_save set to
        false. Change it to true — leave everything else in the file
        exactly as it is.
      mock_tool_responses:
        read_file: '{"content": "{\n  \"user_id\": \"u_492\",\n  \"auto_save\": false,\n  \"theme\": \"dark\",\n  \"max_recent_files\": 20\n}\n"}'
        patch: '{"status": "ok", "diff": "-  \"auto_save\": false,\n+  \"auto_save\": true,"}'
        write_file: '{"status": "ok", "bytes_written": 92}'
    check:
      type: tool_call_then_response
      expected_tool: patch
      expected_args_match:
        old_string: "(?i)auto_save"
        new_string: "true"
      # Added 2026-08-22 (methodology review, finding F8): none of the
      # original 3 hermes_ops tasks ever tested a NEAR-MISS tool choice —
      # web_search was the only plausible tool among 41 for the original
      # selection task. This task has two genuinely plausible tools
      # (patch vs. write_file) that could BOTH technically accomplish the
      # user's request; the system prompt itself states the tie-breaker
      # ("prefer small, reviewable diffs over large rewrites" —
      # fixtures/hermes_ops/system_prompt.txt line ~208), so a model that
      # reaches for a full write_file rewrite of a one-field change is
      # making a real, gradeable mistake, not an equally-valid choice.
      # expected_tool: patch alone already fails any run that only ever
      # called write_file (the built-in "tool never called" check for
      # tool_call_then_response) — no separate negative check needed.
      # mode isn't checked explicitly since the schema defaults to
      # 'replace' and a model may reasonably omit an unneeded default arg;
      # old_string/new_string being present already proves replace-style
      # usage (patch-mode calls have no such keys).

  - id: hermes_ops-noisy-result
    title: Find the right answer inside a large, noisy tool result
    type: tool-chaining
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        Search the codebase for the function that actually handles
        logging a user out (not the UI button, not analytics, the real
        logic), and tell me which file it's defined in.
      mock_tool_responses:
        search_files: |
          {"matches": [
            "src/ui/LogoutButton.tsx:12:export function LogoutButton() {",
            "src/ui/LogoutButton.tsx:18:  // renders the logout button, does not handle the logout itself",
            "src/analytics/events.ts:44:export const LOGOUT_EVENT = \"user_logout\";",
            "src/analytics/events.ts:61:function trackLogoutEvent(userId: string) {",
            "src/api/routes/logout.ts:5:router.post(\"/logout\", (req, res) => {",
            "src/api/routes/logout.ts:6:  // delegates to the session module -- see auth/session.ts",
            "src/auth/session.ts:88:function refreshSession(sessionId: string) {",
            "src/auth/session.ts:142:export function handleLogout(sessionId: string) {",
            "src/auth/session.ts:143:  sessions.delete(sessionId);",
            "src/auth/session.ts:144:  auditLog.record(\"logout\", sessionId);",
            "src/legacy/oldAuth.ts:9:// deprecated -- logout is now handled in auth/session.ts",
            "tests/logout.test.ts:3:describe('logout', () => {",
            "tests/logout.test.ts:14:  it('calls handleLogout on session end', () => {"
          ]}
    check:
      type: tool_call_then_response
      expected_tool: search_files
      response_matches: "session\\.ts"
      # Added 2026-08-22 (methodology review, finding F8): the original 3
      # tasks' mock tool responses were all one-line JSON — nothing
      # exercised whether a model can actually find the answer inside a
      # realistically noisy result (real search_files/terminal output is
      # often dozens of lines with the answer buried in the middle, not
      # handed to the model as the ONLY thing in the response). This mock
      # has 6 different files mentioned across 13 lines, 5 of them
      # plausible-looking decoys (a UI button, an analytics tracker, a
      # route handler that just delegates, a deprecated file, a test
      # file) — "session.ts" is a substring unique to the one file that
      # actually defines handleLogout, so this checks the model read past
      # the more surface-level hits rather than pattern-matching the
      # first or last line.

  - id: hermes_ops-multi-step-chain
    title: Longer dependent chain — locate, read, fix, then verify
    type: tool-chaining
    difficulty: 4
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        There's a bug in the discount calculator — find it, fix it, and
        verify your fix passes the existing tests.
      mock_tool_responses:
        search_files: |
          {"matches": [
            "src/pricing/discount.ts:8:export function calculateDiscount(price, percent) {",
            "src/pricing/discount.ts:9:  return price - percent;",
            "tests/discount.test.ts:3:expect(calculateDiscount(100, 20)).toBe(80);"
          ]}
        read_file: '{"content": "1|export function calculateDiscount(price, percent) {\n2|  return price - percent;\n3|}\n"}'
        patch: '{"success": true, "diff": "-  return price - percent;\n+  return price * (1 - percent / 100);"}'
        terminal: '{"output": "PASS 1 test", "exit_code": 0, "error": null}'
    check:
      type: chained_tool_calls
      expected_sequence: [search_files, read_file, patch, terminal]
      # Added 2026-08-22 (methodology review, finding F8/R7): the only
      # existing tool-chaining task (hermes_ops-chaining) caps at 2 steps
      # — the review specifically called out that no task exercises 3+
      # dependent calls. This is a realistic 4-step diagnose-fix-verify
      # loop (locate the bug, read the real implementation, apply a
      # targeted fix, run the test suite to confirm) — a model that stops
      # after locating or reading the bug without actually fixing and
      # verifying it fails this check. Verified against a genuine 4-step
      # response (passes) and a 2-step "found it" response that never
      # fixes or verifies (correctly fails: "expected sequence ... not
      # found").

  - id: hermes_ops-persistent-failure
    title: A tool that always fails — report honestly, don't fabricate or loop
    type: error-recovery
    difficulty: 4
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: "Can you check how much free disk space is left on this machine?"
      force_tool_error: [terminal]
      mock_tool_responses: {}
    check:
      type: contains_any
      phrases:
        - "couldn't check"
        - "could not check"
        - "couldn't determine"
        - "could not determine"
        - "unable to check"
        - "unable to determine"
        - "no way to check"
        - "not able to check"
      # Added 2026-08-22 (methodology review, finding F8/R7): unlike
      # hermes_ops-error-recovery (one tool fails ONCE, an alternative
      # path — search_files — exists and succeeds), `terminal` is the
      # ONLY tool this manifest offers for system state (disk/CPU/memory
      # — see fixtures/hermes_ops/system_prompt.txt's own tool-selection
      # guidance) and force_tool_error makes EVERY call to it fail, for
      # the whole session — there is no working alternative. This tests
      # whether a model recognizes a persistently broken tool and reports
      # that honestly, rather than retrying it indefinitely (burning
      # turns) or fabricating a plausible-sounding disk-usage number.
      must_not_match: "\\d+\\s*(GB|%|MB|TB)"
      # Any specific disk-space number is fabricated by construction —
      # the mock never supplies one (every terminal call errors). Verified
      # against a genuine "I couldn't check it" answer (passes) and a
      # fabricated "you have 45GB free, 60% used" answer (correctly
      # vetoed).

  - id: hermes_ops-no-tool-needed
    title: A question that needs no tool at all
    type: tool-selection
    difficulty: 3
    prompt_spec:
      system_prompt_file: fixtures/hermes_ops/system_prompt.txt
      tools_file: fixtures/hermes_ops/tools.json
      user_prompt: >-
        What's a good rule of thumb for how often I should commit code
        changes while working on a feature?
      mock_tool_responses: {}
    check:
      type: contains_any
      phrases: ["small", "often", "logical", "atomic", "frequently"]
      must_not_call_tools: true
      # Added 2026-08-22 (methodology review, finding F8/R7): every other
      # hermes_ops task assumes the correct answer involves calling a
      # specific tool — nothing tested the opposite case. This is
      # ordinary engineering-judgment advice answerable from the model's
      # own knowledge; no file to read, nothing to search, no real-time
      # data needed. A model that reaches for web_search (or any other
      # tool) here is making a real, gradeable mistake — needlessly
      # slower, and a sign of over-triggering tool use in general — not
      # an equally-valid alternative. must_not_call_tools is a new,
      # universal check field (grade_prompt.py), verified directly: a
      # correct direct-answer response passes, and an otherwise-correct
      # response that also called web_search unnecessarily fails.
