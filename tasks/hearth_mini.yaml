suite: hearth_mini
languages: [typescript]
timeout_seconds: 900

tasks:
  - id: hearth_mini-feature
    title: Add the storehouse building
    type: feature
    difficulty: 2
    language: typescript
    prompt: |
      This is a small settlement-simulation library (src/types.ts,
      src/sim.ts). Add a new `BuildingKind`, "storehouse", costing
      `{ wood: 25, stone: 10 }`, which requires a "hut" to already be built
      before it's available (unlike "hut"/"farm"/"quarry", which have no
      prerequisite). Then implement:

        export function availableBuildings(settlement: Settlement): BuildingKind[]

      Returning every building kind that is currently both affordable (per
      `canAfford`) and allowed given prerequisites.
    expected_tools: [file_edit]
    check:
      type: command
      command: "npm test"
      cwd: .
      expect_exit_code: 0

  - id: hearth_mini-debug
    title: Population grows even without a real food surplus
    type: debug
    difficulty: 2
    language: typescript
    prompt: |
      Playtesters noticed population keeps growing turn after turn even in
      settlements that are just barely breaking even on food, which
      shouldn't happen — population should only grow when there's an actual
      surplus, not when production merely equals consumption. Find and fix
      the bug in `advanceTurn` in src/sim.ts.
    expected_tools: [file_edit]
    check:
      type: command
      command: "npm test"
      cwd: .
      expect_exit_code: 0

  - id: hearth_mini-testwrite
    title: Write tests for building repair
    type: test-writing
    difficulty: 3
    language: typescript
    prompt: |
      src/sim.ts already has `repairBuilding(settlement, kind)` implemented:
      it repairs an already-built building for half its original cost
      (rounded up, per resource), is a no-op if the settlement doesn't have
      that building, and never takes any resource below 0. Write tests for
      it in tests/repair.test.ts covering all three of those behaviors,
      including a rounding-up case (an odd-numbered cost) and a case where
      the settlement has less of a resource than the repair would cost. Do
      not modify src/sim.ts.
    expected_tools: [file_edit]
    check:
      type: mutation
      agent_test_file: tests/repair.test.ts
      source_file: src/sim.ts
      test_command: "npx vitest run tests/repair.test.ts"
      mutants:
        - checks/hearth_mini/hearth_mini-testwrite/mutants/mutant1_sim.ts
        - checks/hearth_mini/hearth_mini-testwrite/mutants/mutant2_sim.ts
      require_kill: all
