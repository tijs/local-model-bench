suite: kiem
repo: ~/projects/kiem
languages: [rust, swift]
base_ref: main
timeout_seconds: 900

tasks:
  - id: kiem-01
    title: Add --tag filter to todos listing
    difficulty: 1
    language: rust
    prompt: |
      Add a `--tag <TAG>` option to `kiem todos` that restricts the listing to
      todos whose note has the given tag. Wire it through the CLI arg parser
      and the listing logic. Write a test covering the filtered case.
    expected_tools: [file_edit, git, cargo]
    check:
      type: command
      command: "cargo build -p kiem-cli && cargo test -p kiem-cli"
      cwd: .
      expect_exit_code: 0

  - id: kiem-02
    title: Fix tag extraction edge case near punctuation
    difficulty: 1
    language: rust
    prompt: |
      `extract_tags` in crates/kiem-core/src/content/mod.rs mishandles tags
      directly adjacent to punctuation (e.g. "note.#tag," or "(#tag)"). Fix
      the extraction so punctuation-adjacent tags are recognized correctly,
      and add cases to fixtures/content-derivation.json covering it.
    expected_tools: [file_edit, git, cargo]
    check:
      type: command
      command: "cargo test --test content_fixtures"
      cwd: .
      expect_exit_code: 0

  - id: kiem-03
    title: Add a note pin/unpin subcommand
    difficulty: 3
    language: rust
    prompt: |
      Add a `kiem note pin <id>` / `kiem note unpin <id>` subcommand pair that
      toggles a "pinned" flag stored on the note, visible in `kiem list`
      output (e.g. a leading marker). Touch args.rs, main.rs, notes.rs, and
      the store layer as needed. Add an integration test in
      crates/kiem-cli/tests/cli_test.rs.
    expected_tools: [file_edit, git, cargo]
    check:
      type: command
      command: "cargo build && cargo test -p kiem-cli"
      cwd: .
      expect_exit_code: 0

  - id: kiem-04
    title: Add a tag-filter chip to the note list UI
    difficulty: 3
    language: swift
    prompt: |
      Add a tag-filter chip row above the note list in
      apple/Kiem/Views/NoteListView.swift (or SidebarView.swift) that lets the
      user tap a tag to filter the visible notes, wired through the existing
      KiemModel. Follow existing view/model conventions in that file.
    expected_tools: [file_edit, git]
    check:
      type: command
      command: "cd apple && xcodegen generate && xcodebuild -project Kiem.xcodeproj -scheme Kiem build"
      cwd: .
      expect_exit_code: 0

  - id: kiem-05
    title: Extend a content-derivation rule across Rust and Swift
    difficulty: 5
    language: rust
    prompt: |
      Pick one derivation rule in crates/kiem-core/src/content (title or todo
      derivation) and extend it to handle one additional real-world case of
      your choosing (document which case in a code comment). Update
      fixtures/content-derivation.json with matching cases, run
      apple/build-kiemkit.sh to regenerate the embedded Swift core so the two
      sides stay in sync, per the parity contract described in CLAUDE.md.
    expected_tools: [file_edit, git, cargo, bash]
    check:
      type: command
      command: "cargo test --test content_fixtures && cd apple && xcodegen generate && xcodebuild -project Kiem.xcodeproj -scheme Kiem build"
      cwd: .
      expect_exit_code: 0
