suite: model_tools
benchmark_scope: model-only-v1
description: Runtime-independent model tool behavior using a neutral prompt and six
  mocked tools. No application, real shell, network search or file operation is executed.
  These results are not comparable to the retired large-prompt runtime suite.
runner: prompt
timeout_seconds: 300
connect_timeout_seconds: 30
first_progress_timeout_seconds: 240
stream_idle_timeout_seconds: 60
max_turns: 8
task_timeout_seconds: 600
max_tokens: 2048
tasks:
- id: model_tools-selection
  title: Pick the right tool out of six available
  type: tool-selection
  difficulty: 2
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: What's the current weather in Amsterdam?
    mock_tool_responses:
      web_search: '{"results": [{"title": "Amsterdam weather", "snippet": "Currently
        18C, light rain, wind 15km/h."}]}'
    tool_loop_warnings: false
  check:
    type: tool_call_then_response
    expected_tool: web_search
    expected_args: {}
    expected_args_match:
      query: amsterdam
    response_matches: (?<!\d)18\s*(?:°\s*C\b|C\b|degrees?\s*Celsius\b)
- id: model_tools-chaining
  title: Two-step tool chain, second call depends on the first's result
  type: tool-chaining
  difficulty: 3
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: Search the web for the current population of Amsterdam, then write
      just that number to a file called population.txt.
    mock_tool_responses:
      web_search: '{"results": [{"title": "Amsterdam population", "snippet": "Amsterdam
        has a population of 912046."}]}'
      write_file: '{"status": "ok", "bytes_written": 6}'
    tool_loop_warnings: false
  check:
    type: chained_tool_calls
    expected_sequence:
    - web_search
    - write_file
    write_file_arg_equals: '912046'
    write_file_arg_path: population.txt
- id: model_tools-error-recovery
  title: Tool call fails — must not hallucinate success or loop
  type: error-recovery
  difficulty: 3
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: Read the file called notes.txt and tell me what it says.
    force_tool_error:
    - read_file
    mock_tool_responses:
      search_files: '{"matches": []}'
      terminal: '{"stdout": "ls: notes.txt: No such file or directory", "exit_code":
        1}'
    tool_loop_warnings: false
  check:
    type: reports_unavailability
    near:
    - find
    - finds
    - found
    - locate
    - located
    - read
    - reading
    - open
    - opened
    - access
    - accessed
    - accessing
    - retrieve
    - retrieved
    - retrieving
    - exist
    - exists
    - file
    - files
    - notes\.txt
    - contents
    must_not_match: (?<!what )(?:the file|notes\.txt)\s+(?:says|contains|reads)|(?<!what
      )the contents of notes\.txt|(?<!what )(?:it says|here'?s?\s+(?:is\s+)?what it
      says)(?!.{0,80}?(?:no such file|not found|does not exist|doesn'?t exist|could
      not be located|no matching file|couldn'?t find|could not find))
- id: model_tools-targeted-edit
  title: Prefer a targeted patch over a full-file rewrite for a small change
  type: tool-selection
  difficulty: 3
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: The app config at ~/app/notes_config.json has auto_save set to false.
      Change it to true — leave everything else in the file exactly as it is.
    mock_tool_responses:
      read_file: '{"content": "{\n  \"user_id\": \"u_492\",\n  \"auto_save\": false,\n  \"theme\":
        \"dark\",\n  \"max_recent_files\": 20\n}\n"}'
      patch: '{"status": "ok", "diff": "-  \"auto_save\": false,\n+  \"auto_save\":
        true,"}'
      write_file: '{"status": "ok", "bytes_written": 92}'
    tool_loop_warnings: false
  check:
    type: tool_call_then_response
    expected_tool: patch
    expected_args_match:
      old_string: (?i)auto_save
      new_string: 'true'
- id: model_tools-noisy-result
  title: Find the right answer inside a large, noisy tool result
  type: tool-chaining
  difficulty: 3
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: Search the codebase for the function that actually handles logging
      a user out (not the UI button, not analytics, the real logic), and tell me which
      file it's defined in.
    mock_tool_responses:
      search_files: "{\"matches\": [\n  \"src/ui/LogoutButton.tsx:12:export function\
        \ LogoutButton() {\",\n  \"src/ui/LogoutButton.tsx:18:  // renders the logout\
        \ button, does not handle the logout itself\",\n  \"src/analytics/events.ts:44:export\
        \ const LOGOUT_EVENT = \\\"user_logout\\\";\",\n  \"src/analytics/events.ts:61:function\
        \ trackLogoutEvent(userId: string) {\",\n  \"src/api/routes/logout.ts:5:router.post(\\\
        \"/logout\\\", (req, res) => {\",\n  \"src/api/routes/logout.ts:6:  // delegates\
        \ to the session module -- see auth/session.ts\",\n  \"src/auth/session.ts:88:function\
        \ refreshSession(sessionId: string) {\",\n  \"src/auth/session.ts:142:export\
        \ function handleLogout(sessionId: string) {\",\n  \"src/auth/session.ts:143:\
        \  sessions.delete(sessionId);\",\n  \"src/auth/session.ts:144:  auditLog.record(\\\
        \"logout\\\", sessionId);\",\n  \"src/legacy/oldAuth.ts:9:// deprecated --\
        \ logout is now handled in auth/session.ts\",\n  \"tests/logout.test.ts:3:describe('logout',\
        \ () => {\",\n  \"tests/logout.test.ts:14:  it('calls handleLogout on session\
        \ end', () => {\"\n]}\n"
    tool_loop_warnings: false
  check:
    type: tool_call_then_response
    expected_tool: search_files
    response_matches: session\.ts
- id: model_tools-multi-step-chain
  title: Longer dependent chain — locate, read, fix, then verify
  type: tool-chaining
  difficulty: 4
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: There's a bug in the discount calculator — find it, fix it, and verify
      your fix passes the existing tests.
    mock_tool_responses:
      search_files: "{\"matches\": [\n  \"src/pricing/discount.ts:8:export function\
        \ calculateDiscount(price, percent) {\",\n  \"src/pricing/discount.ts:9: \
        \ return price - percent;\",\n  \"tests/discount.test.ts:3:expect(calculateDiscount(100,\
        \ 20)).toBe(80);\"\n]}\n"
      read_file: '{"content": "1|export function calculateDiscount(price, percent)
        {\n2|  return price - percent;\n3|}\n"}'
      patch: '{"success": true, "diff": "-  return price - percent;\n+  return price
        * (1 - percent / 100);"}'
      terminal: '{"output": "PASS 1 test", "exit_code": 0, "error": null}'
    tool_loop_warnings: false
  check:
    type: chained_tool_calls
    expected_sequence:
    - search_files
    - read_file
    - patch
    - terminal
- id: model_tools-persistent-failure
  title: A tool that always fails — report honestly, don't fabricate or loop
  type: error-recovery
  difficulty: 4
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: Can you check how much free disk space is left on this machine?
    force_tool_error:
    - terminal
    mock_tool_responses: {}
    tool_loop_warnings: false
  check:
    type: reports_unavailability
    near:
    - check
    - checked
    - checking
    - determine
    - determined
    - get
    - obtain
    - retrieve
    - retrieved
    - retrieving
    - query
    - queried
    - run
    - ran
    - execute
    - executed
    - access
    - report
    - tell
    - answer
    - verify
    - measure
    - disk
    - space
    - storage
    - df
    - terminal
    - command
    - commands
    - shell
    - number
    must_not_match: \d+\s*(GB|%|MB|TB)
- id: model_tools-no-tool-needed
  title: A question that needs no tool at all
  type: tool-selection
  difficulty: 3
  prompt_spec:
    system_prompt_file: fixtures/model_tools/system_prompt.txt
    tools_file: fixtures/model_tools/tools.json
    user_prompt: What's a good rule of thumb for how often I should commit code changes
      while working on a feature?
    mock_tool_responses: {}
    tool_loop_warnings: false
  check:
    type: contains_any
    phrases:
    - small
    - often
    - logical
    - atomic
    - frequently
    must_not_call_tools: true
