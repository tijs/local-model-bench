model: batiai/Gravity-30BA5B-RL-GGUF:Q4_K_M
# QUEUED / UNRANKED — BatiAI community Q4_K_M llama.cpp arm of the Gravity
# (Trillion Labs) research track, the authorized post-AXQ-6-bit queue slot.
# No results/log.jsonl rows exist under this config's hash, so it is ranked
# nowhere until a COMPLETE current-suite benchmark run lands (the 25-row
# default battery: sanity 2 + hermes_ops 8 + kiem_mini 5 + hearth_mini 3 +
# kipclip_mini 4 + hearth_full 3 — run_bench.py --coding-suites default
# since 2026-08-25). Do not treat any claim in this file as a quality or
# benchmark result — only as artifact + setup provenance.
#
# What this arm is: an imatrix-calibrated Q4_K_M GGUF conversion of
# trillionlabs/Gravity-30BA5B-RL (~30B total / ~5B active per token; 64
# experts top-8, MLA attention) published by BatiAI at an immutable HF
# revision, served on plain mainline llama.cpp. It is a FIRST-CLASS
# SEPARATE candidate (its own repo, revision, blob, quant, and served
# identity) — NOT a quantization of the authorized gated
# trillionlabs/Gravity-30B-A5B-Base slot: the card's base_model tag is
# trillionlabs/Gravity-30BA5B-RL (the RL derivative), a different lineage
# whose rows/claims must never be merged with the Base candidate's.
#
# NOT STAGED (as of 2026-09-17): the model weights are NOT on this machine.
# The launch-block model path below is the EXPECTED HF hub-cache snapshot
# location for this exact repo/revision/file, used as a placeholder per
# config convention — do NOT launch this config until the immutable
# revision is staged there (or the path re-pointed, which changes
# config_hash). The runner re-gates identity at run time anyway
# (assert_serving_expected_model with a runner-appended
# bench-<config-hash> identity alias + a plain-completion probe), so a
# future run re-verifies independently.
temperature: 0.6
reasoning_mode: thinking   # card-default: with --jinja, reasoning lands in
                           # reasoning_content; NOT an explicit llama-server
                           # flag here (card-proven usage, see settings)
hermes_ops_max_tokens: 16384
  # Defensive thinking-mode cap, same pre-emptive rationale and value as
  # configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml (benchmark-v4 hermes_ops
  # fix): run_prompt_suite.py's one-shot hermes_ops client has no
  # finish_reason=length continuation, so the default 4096-token cap risks
  # truncating a reasoning-emitting family before a final answer. The card
  # notes this model's reasoning is short (~150 chars for a simple tool
  # question), so the cap is defensive belt-and-braces, not a known need —
  # no hermes_ops rows exist yet to confirm or deny truncation.
inference_engine: llama.cpp   # plain mainline llama.cpp — same control binary
                              # family as the Qwen3.6 track arms, NOT a
                              # fork/spec build; see
                              # orchestration.server_binary + settings
source_revision: ae61d230482a5a6efa869bc6b72fb784bb630cdb  # batiai repo rev
                              # (immutable), pinned; verified live via HF API
                              # 2026-09-17 (NOT staged on-disk)
model_bytes: 19613407328      # == 18.266 GiB (task-pinned value == HF tree
                              # API size at the revision, 2026-09-17)
quant_family: GGUF Q4_K_M (BatiAI imatrix-calibrated k-quant, single-file,
              19,613,407,328 B / 18.266 GiB)
context_cap: 65536

benchmark_launch_command: |
  # Absolute binary + expected local model path so THIS machine reproduces it
  # exactly IF the artifact is staged at the expected location first. Binary:
  # official ggml-org/llama.cpp mainline build produced by
  # runner/setup_dspark_head.sh into runner/.dspark-head (gitignored, NOT
  # committed) — commit a302733, build 1, 2026-08-23, AppleClang 21.0.0
  # arm64 (`llama-server --version` re-verified 2026-09-17); see
  # settings/binary_build_provenance and orchestration.server_binary.
  # Model: NOT STAGED — this is the PLACEHOLDER HF hub-cache snapshot path for
  # the verified public artifact (repo batiai/Gravity-30BA5B-RL-GGUF,
  # revision ae61d230482a5a6efa869bc6b72fb784bb630cdb, file
  # Gravity-30BA5B-RL-Q4_K_M.gguf, 19,613,407,328 bytes, sha256
  # cc134bbc858cbc9186172cf582234d606c15352e9c016e0f3e1cccfe17ccd4e5 — the HF
  # LFS oid at the pin, NOT a local on-disk re-verification). The path below
  # is where a staged snapshot lands; do NOT launch until staged (the runner
  # preflight / unload_all.sh discipline applies), and re-verify the on-disk
  # sha256 equals the LFS oid at staging time. The runner appends its own
  # bench-<config-hash> identity alias to the last command line, and its
  # guard refuses a launch block that already sets a fixed sampling seed
  # (the check is a substring scan over the whole block, comments included —
  # so this comment must not name that flag literally). Keep the last line a
  # plain flag with no trailing backslash.
  /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server \
    --model /Users/tijs/.cache/huggingface/hub/models--batiai--Gravity-30BA5B-RL-GGUF/snapshots/ae61d230482a5a6efa869bc6b72fb784bb630cdb/Gravity-30BA5B-RL-Q4_K_M.gguf \
    --host 127.0.0.1 --port 8017 \
    --ctx-size 65536 --parallel 1 --n-gpu-layers 99 --flash-attn on \
    --jinja --cache-prompt \
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Card-attested native tool_calls for this exact quant family on llama.cpp
  # ("Pass --jinja and the model emits standard JSON tool calls that
  # /v1/chat/completions parses directly" — card, all four quants) — no proxy
  # needed, same family precedent as the Qwen3.6 track arms. NOT locally
  # gated yet; see known_gaps for the required run-time gate before any
  # battery.

orchestration:
  raw_port: 8017          # shared with every other llama.cpp config — never
                          # run two local backends concurrently (unload_all.sh
                          # discipline); see known_gaps
  needs_proxy: false
  hermes_provider: null   # no coding-suite bench-profile provider exists for
    # this candidate yet (verified absent from
    # ~/.hermes/profiles/bench/config.yaml 2026-09-17). Same pattern as
    # configs/Ling-3.0-tiny/mei.yaml: viable: full keeps coding ELIGIBLE but
    # run_bench.py skips coding while hermes_provider is unset. A bench
    # profile entry (api http://127.0.0.1:8017/v1, context_length 65536 >=
    # hermes's 64K coding minimum) must be created/reused before a full
    # coding battery; until then only sanity/hermes_ops coverage is possible.
  server_binary: /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server
    # NOT the Homebrew llama.cpp (build 10470 / commit 34af94cd9, 2026-08-17).
    # This is the official ggml-org/llama.cpp mainline source build at commit
    # a302733 ("metal : clamp K extent in tensor API mat-mat kernel for K not
    # a multiple of 32 (#27450)", 2026-08-23) — newer than the bottle, built
    # via runner/setup_dspark_head.sh into runner/.dspark-head/ (gitignored).
    # Same codebase family as Homebrew's llama-server (official mainline, no
    # fork patches), so results stay comparable to historical `llama.cpp`
    # rows; the provenance is recorded because a build-commit gap is a real
    # confound if a comparison gets close. Identical control binary to the
    # Qwen3.6 official/ManniX arms (configs/Qwen3.6-35B-A3B/gguf-official-
    # q4km.yaml, configs/Qwen3.6-27B-A3B-Coder-MTP-GGUF/gguf-cd-iq4km.yaml).
  viable: full            # QUEUED / UNRANKED candidate: runnable in
    # principle, but ranked nowhere until a COMPLETE 25-row current-suite
    # battery passes (see known_gaps). Same convention as the Qwen3.6
    # control arms and the DWQ/mixed46 Mei arms (viable: full to stay
    # runnable, banner in known_gaps).

settings:
  - name: artifact_identity
    value: "batiai/Gravity-30BA5B-RL-GGUF revision ae61d230482a5a6efa869bc6b72fb784bb630cdb, file Gravity-30BA5B-RL-Q4_K_M.gguf, 19,613,407,328 bytes (18.266 GiB), sha256 cc134bbc858cbc9186172cf582234d606c15352e9c016e0f3e1cccfe17ccd4e5. Revision + size + LFS oid verified live via the HF API at the pin 2026-09-17 (repo list + tree listing: sha ae61d230…, gated false, apache-2.0, tags gguf/moe/function-calling/tool-use/imatrix/conversational, base_model trillionlabs/Gravity-30BA5B-RL). The sha256 is the HF LFS blob-store oid — NOT a local on-disk re-computation, because the model is NOT staged (expected snapshot path placeholder: ~/.cache/huggingface/hub/models--batiai--Gravity-30BA5B-RL-GGUF/snapshots/ae61d230482a5a6efa869bc6b72fb784bb630cdb/Gravity-30BA5B-RL-Q4_K_M.gguf). At staging time re-verify blob == symlink target == LFS oid, exactly like the Qwen3.6 arms record."
    source: "https://huggingface.co/batiai/Gravity-30BA5B-RL-GGUF/commit/ae61d230482a5a6efa869bc6b72fb784bb630cdb + HF tree API at the pin (size 19613407328, lfs oid cc134bbc858cbc9186172cf582234d606c15352e9c016e0f3e1cccfe17ccd4e5), both queried 2026-09-17."
  - name: lineage_and_separation (why this is NOT the gated Base arm)
    value: "Trillion Labs Gravity family, but a SEPARATE lineage: the card's base_model tag is trillionlabs/Gravity-30BA5B-RL (the RL derivative — quantized from Trillion Labs' official RL weights, 'never a re-quant', per the BatiAI card). The authorized gated queue slot is trillionlabs/Gravity-30BA5B-Base @ ee52d6f6ff6572ed72851dbaac5a79ef982a74a4 (56.96 GB public bf16 base, needs a compatible pinned quant/repack or resource-gate change before staging — see artifacts/qwen36-decision-audit-post-mannix-complete-20260916.md). This Q4_K_M GGUF is NOT that base quantized: different repo, revision, artifact bytes, and served identity. Never merge this arm's rows/claims with the Base candidate's. Queue position (authorized, Kiem durable plan): AXQ 4-bit (COMPLETE) -> AXQ 6-bit -> Gravity RL Q4_K_M (THIS config) -> gated BF16 Gravity Base."
    source: "BatiAI model card at the pin (base_model block, 'From the source — Quantized from Trillion Labs' official weights, never a re-quant') + HF API tags at the pin + artifacts/qwen36-decision-audit-post-mannix-complete-20260916.md (Base slot pin ee52d6f6…)."
  - name: quant (why this exact Q4_K_M)
    value: "Q4_K_M — llama.cpp's canonical k-quant medium variant (per ggml-org/llama.cpp GGUF quantization docs, Q4_K for ~2/3 of tensors and Q6_K for the rest). This specific artifact is also imatrix-quantized per the packager: the card states 'All quants are imatrix-quantized' with measured corpus (4.90 M characters, 20.06% Hangul, 0.17% Han, Korean technical prose + English wikitext, --chunks 200). The card additionally documents a conversion bug fix baked into the files at quantization time (q_lora_rank 0 so llama.cpp builds wq instead of wq_a/wq_b) — no --override-kv or patched build is needed to load, and none is passed here. Packager's own measured table for Q4_K_M: 18.3 GiB (19.6 GB), 24.98 tok/s llama-bench CPU-only floor on 2x Xeon Gold 6442Y (ngl 0) — reproduction context only, NOT a benchmark claim of this harness and NOT a quality claim."
    source: "BatiAI model card at the pin (sizes/speed table, imatrix section, conversion-bug section) + ggml-org/llama.cpp GGUF quantization docs."
  - name: temperature / top_p / top_k / min_p
    value: "0.6 / 0.95 / 20 / 0.0 — the repo's standing local-agentic llama.cpp preset, inherited unchanged from the Qwen3.6 track arms (configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml and its ManniX sibling). The BatiAI card publishes NO sampling preset (it only documents --jinja and -c), so there is no model-card citation to inherit; per configs/README.md process rule this is stated explicitly rather than inventing a plausible model-specific value. Sanity/hermes_ops still run at hardcoded temperature 0 (run_prompt.py, tasks/SCHEMA.md). Revisit only if a gate exposes a family-specific working point."
    source: "configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml (the inherited preset) + BatiAI model card at the pin (no sampling guidance present) + tasks/SCHEMA.md (temperature fixed at 0 for sanity/hermes_ops)."
  - name: thinking / reasoning mode mechanism
    value: "Template-default thinking: the card states that with plain --jinja on llama.cpp the model emits reasoning into reasoning_content 'where it belongs', and that upstream's vLLM-side extras (--tool-call-parser cyan_glm, --reasoning-parser glm45) are NOT needed here. The launch uses the card-proven usage: --jinja and NO explicit --reasoning flag. Whether the pinned binary's --reasoning [on|off|auto] flag is needed/desired for THIS binary+artifact is UNVERIFIED (it is a different family than the Qwen3.6 arms that pass --reasoning on); the run-time native gate must confirm reasoning emission + placement before any battery. reasoning_mode: thinking reflects the card-attested default behavior, not a proven explicit flag."
    source: "BatiAI model card at the pin ('Tool calling — simpler here than upstream' section) + this config's launch block (no --reasoning flag)."
  - name: context_length
    value: "65536 — the repo's standard benchmark ceiling and hermes's >=64K hard minimum, same as every llama.cpp config. The card documents native 131,072 ('The model supports 131,072 tokens') with a warning that upstream BFCL long-context problems need the full window and 'score drops to zero if you truncate'. This harness runs every model at the 65536 ceiling (established design), so any long-context-sensitive delta versus the card's upstream numbers must be attributed to the harness ceiling, not to the model or the quant."
    source: "BatiAI model card at the pin (Usage/Context section) + AGENTS.md hermes hard-minimum note + configs/README.md (repo ceiling)."
  - name: tool_call_path
    value: "native llama.cpp tool_calls, card-attested: 'Pass --jinja and the model emits standard JSON tool calls that /v1/chat/completions parses directly — we got a clean tool_calls entry on the first try' (all four quants verified by the packager, function-calling/tool-use tags on the repo). needs_proxy: false. This is admission evidence from the packager, NOT a local gate: the run-time identity + plain-completion gate re-checks serving anyway, and the track's bounded native probe (identity, plain + streaming generation, native non-streaming/streaming tool calls, cache reuse, context boundary) must PASS locally before any full battery."
    source: "BatiAI model card at the pin (Tool calling section) + runner/run_bench.py (assert_serving_expected_model)."
  - name: binary_build_provenance
    value: "runner/.dspark-head/build/bin/llama-server — official ggml-org/llama.cpp mainline source build. `llama-server --version` (re-verified 2026-09-17): 0.1.2-dev (build 1, commit a302733), built with AppleClang 21.0.0.21000101 for Darwin arm64; checkout HEAD a302733 'metal : clamp K extent in tensor API mat-mat kernel for K not a multiple of 32 (#27450)' from https://github.com/ggml-org/llama.cpp. Built 2026-08-23 via runner/setup_dspark_head.sh (gitignored, NOT committed). Same control binary the Qwen3.6 official and ManniX arms pin. Reasons it is the control binary rather than Homebrew's llama.cpp: the Homebrew bottle used by historical GGUF rows is build 10470 (commit 34af94cd9, 2026-08-17); this mainline build (2026-08-23) is the same official codebase and newer. Inference engine label stays `llama.cpp` (plain mainline, no fork/spec patches), so leaderboard grouping matches historical rows."
    source: "`./runner/.dspark-head/build/bin/llama-server --version` (2026-09-17) + configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml (same-build provenance) + runner/setup_dspark_head.sh."
  - name: launch flags (parallel / n-gpu-layers / flash-attn / jinja / cache-prompt / timeout)
    value: "--parallel 1 (single slot; the server default of 4 multiplies KV-cache memory and is a real Metal OOM risk at 65536 ctx with an 18.3 GiB model on 32 GB — same finding as configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml and configs/Qwen3.8-27B/gguf-dflash2.yaml); --n-gpu-layers 99 (full Metal offload, explicit); --flash-attn on (reduces KV memory at long ctx; on|off|auto in this binary); --jinja (mandatory per the card — the embedded chat template drives both standard tool_calls and reasoning_content placement); --cache-prompt (prefix reuse, mirrors Mei's cache-reuse arm); --timeout 1800 (server-side request cap). The card's usage example (--jinja -c 32768) is extended to the repo-standard control set; NO --reasoning flag (card-proven usage, see the reasoning setting above); NO draft/MTP flag of any kind exists for this single-file artifact."
    source: "BatiAI model card at the pin (Usage section) + configs/Qwen3.6-35B-A3B/gguf-official-q4km.yaml for the --parallel 1 / flag-set reasoning + llama-server --help for each flag (2026-09-17)."
  - name: staging_gate (model NOT staged — line in the sand before any run)
    value: "As of 2026-09-17 the artifact is NOT on this machine and no provenance sidecar exists (the stage tool writes one at staging time). The expected staging command (card): `hf download batiai/Gravity-30BA5B-RL-GGUF --include 'Gravity-30BA5B-RL-Q4_K_M.gguf'` which lands at ~/.cache/huggingface/hub/models--batiai--Gravity-30BA5B-RL-GGUF/snapshots/ae61d230482a5a6efa869bc6b72fb784bb630cdb/. Pre-launch gate at staging: on-disk file size == 19,613,407,328 bytes and shasum -a 256 == cc134bbc858cbc9186172cf582234d606c15352e9c016e0f3e1cccfe17ccd4e5 (the HF LFS oid at the pin); single-writer preflight (one backend on 8017), disk above the runner's 30.0 GB MIN_FREE_DISK_GB_BEFORE_LAUNCH gate (~18.3 GiB model + KV), teardown verification after. A run launched against the placeholder path fails fast at load — that is a staging error, not a model result."
    source: "BatiAI model card at the pin (Usage section) + runner/bench_common.py (MIN_FREE_DISK_GB_BEFORE_LAUNCH:78) + runner/run_bench.py preflight."
known_gaps:
  - "QUEUED / UNRANKED — NOT STAGED (2026-09-17): no results/log.jsonl rows exist for this config; the model weights are NOT staged on this machine, and the launch-block model path is the EXPECTED HF hub-cache snapshot location used as a placeholder. Do NOT launch until the immutable revision ae61d230482a5a6efa869bc6b72fb784bb630cdb is staged at that path (or the path re-pointed — which changes config_hash and invalidates this file's snapshot identity) AND the standard preflight passes: exactly one backend on 8017, disk above the 30 GB launch gate, teardown verified after. Until then, treat every line of this file as setup provenance, not a result."
  - "COMPLETION CONTRACT — unranked until a COMPLETE current 25-row battery passes: sanity 2 + hermes_ops 8 + kiem_mini 5 + hearth_mini 3 + kipclip_mini 4 + hearth_full 3 (run_bench.py --coding-suites default since 2026-08-25; shape confirmed in artifacts/qwen36-axq4-preflight-blocked-20260917-0755.md). A run does not rank the candidate until all 25 rows exist with zero harness errors and every partial/failed row is reviewed — partial/interrupted legs stay append-only evidence and never count as completion (repo-wide rule, see AGENTS.md post-run quality gate)."
  - "QUEUE ORDER (authorized serialized queue, durable Kiem plan): AXQ 4-bit (COMPLETE) -> AXQ 6-bit -> Gravity RL Q4_K_M (THIS config) -> gated BF16 Gravity Base (trillionlabs/Gravity-30BA5B-Base @ ee52d6f6ff6572ed72851dbaac5a79ef982a74a4). This slot must NOT start before the AXQ 6-bit leg (configs/AX-Qwen3.6-35B-A3B-MLX-AXQ-6bit-*) is terminal AND committed; the recurring worker prompt is updated by the parent after reviewing this config, not by this task."
  - "DISTINCT LINEAGE: this is the RL derivative (base_model trillionlabs/Gravity-30BA5B-RL), NOT a quantization of the authorized gated trillionlabs/Gravity-30B-A5B-Base. Different repo/revision/blob/served identity — never merge rows, hashes, or claims between the two, and never treat this config as the Base slot's setup."
  - "hermes_provider: null — no coding-suite bench-profile provider exists for this candidate (verified absent from ~/.hermes/profiles/bench/config.yaml 2026-09-17). run_bench.py skips the coding suites while hermes_provider is unset, so a full battery requires creating/reusing a bench profile entry (api http://127.0.0.1:8017/v1, context_length 65536 >= hermes's 64K coding minimum) before launch; until then only sanity/hermes_ops coverage is possible. Port 8017 is shared with every llama.cpp config — the provider entry is only meaningful one-backend-at-a-time."
  - "Tool-call admission is CARD-ATTESTED, not locally gated: the packager verified clean native tool_calls on all four quants with --jinja, but no local probe has touched this binary+artifact. Before any battery, run the track's bounded native gate locally (exact served identity via the runner-appended bench-<config-hash> alias, plain + streaming generation, native non-streaming/streaming tool calls, cache reuse, context boundary as feasible) and record it under results-mei/ or artifacts/ — the runner re-gates identity at run time regardless."
  - "Reasoning-flag interplay UNVERIFIED: no --reasoning flag is passed (card-proven --jinja-only usage). The gate must confirm the template emits reasoning into reasoning_content on the pinned binary before ranking-eligible runs; if it does not, the flag question is a separate explicitly-pinned decision, not a silent edit."
  - "Context ceiling: model native 131,072 vs harness 65536 ceiling. The card warns upstream BFCL long-context scores drop when truncated; this repo runs every model at 65536 by design, so any long-context delta must be attributed to the harness ceiling. Benchmark scope is the English agentic fixture suites; the model is en+ko (Korean output is the packager's publish gate, not exercised here)."
  - "run_prompt_suite.py hardcodes temperature=0 for sanity/hermes_ops — the 0.6/0.95/20/0.0 sampling settings above only apply to the hermes-chat-driven coding suites, per this benchmark's established design (tasks/SCHEMA.md)."
  - "Port 8017 is shared with every other llama.cpp config (and all 8017-bound bench-profile providers); never run concurrently, and unload_all.sh must be allowed to reclaim it."
  - "imatrix calibration, sizes, and speeds are PACKAGER-ATTESTED only (BatiAI card at the pin; their speed numbers are llama-bench CPU-only floors on x86, not Apple Silicon and not this harness) — treat card claims as untrusted until locally measured; only local gate numbers are evidence."
  - "The artifact_identity sha256 is the HF LFS blob oid at the pin, NOT a local on-disk hash (model not staged). At staging time re-verify on-disk: blob == snapshots/<revision> symlink target == LFS oid (repo-wide provenance rule)."
  - "configs/README.md's config directory list was not extended: it predates the entire Qwen3.6-then-Gravity track (none of the Qwen3.6/Ornith-1.5-35B-A3B/AX-* dirs are listed either), so adding one entry would be inconsistent; queue state is tracked in the durable Kiem plan and artifacts/."
