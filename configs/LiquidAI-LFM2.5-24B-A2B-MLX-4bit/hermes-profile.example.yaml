# Repository template only; NOT an installed Hermes profile.
# Provision a fresh profile named bench-lfm25 explicitly before a live run.
# Schema: https://hermes-agent.nousresearch.com/docs/integrations/providers
model:
  provider: lfm25-mei
  default: LiquidAI/LFM2.5-24B-A2B-MLX-4bit
  # Pin main-model routing too; fresh profiles can inherit stale defaults.
  base_url: http://127.0.0.1:8029/v1
  api_mode: chat_completions
  context_length: 65536
  max_tokens: 4096
providers:
  lfm25-mei:
    api: http://127.0.0.1:8029/v1
    transport: chat_completions
    default_model: LiquidAI/LFM2.5-24B-A2B-MLX-4bit
    context_length: 65536
    discover_models: false
    # Keyless loopback server: no credentials in the template.
    # Explicit request body values prevent Hermes defaults from replacing the
    # vendor sampler or the output cap. Current Hermes ignores legacy provider
    # output-limit settings; the actual request body cap is intentional here.
    extra_body:
      temperature: 0.1
      top_k: 50
      top_p: 0.0
      min_p: 0
      repetition_penalty: 1.05
      max_tokens: 4096
      # No invented effort level: null, not Hermes's implicit medium. This
      # leaves Mei's optional request effort unset; thinking template untouched.
      reasoning_effort: null
# Reproduce the existing benchmark CLI policy, not fresh-profile defaults.
agent:
  max_turns: 40
approvals:
  # Benchmark fixtures only; never apply this to the user's normal profile.
  mode: "off"
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - file
    - terminal
    - todo
skills:
  # Shared skill roots match bench on this host; no profile state is copied.
  external_dirs:
    - /Users/tijs/.hermes/skills
    - /Users/tijs/.hermes/shared-skills
plugins:
  enabled: []
terminal:
  cwd: .
memory:
  memory_enabled: false
  user_profile_enabled: false
