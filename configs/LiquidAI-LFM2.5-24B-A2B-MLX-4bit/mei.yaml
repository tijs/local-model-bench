  - "STORAGE GATE: the weight pack is ~12.64 GiB; free disk was ~16.9 GiB (before this preparation's local builds) against the 10 GiB launch floor, and no matching cache or external volume exists. Do not stage until the parent frees or relocates storage."
  - "ROUTER-FIX GATE: the built vmlx must include work/lfm25-route-20261015 @ ed49a4da (LFM2MoE router parity fix). The current Package.resolved pin 633fe166 does not. Promote the pin or use a local package override for the build; a build without the fix produces invalid rows."
  - "UNMEASURED SETUP: prefill 64, anchors off, and the KV tier choice are safe defaults, not measured optima; run the bounded prefill-step sweep (and a cache-tier check) before trusting speed numbers. The model's 131072 advertised context is optional later work after safe admission at 65536."
  - "Tool-call format: verify live on the staged artifact (probe_mei.py, streaming + non-streaming) before trusting any row."
  - "Server build path: this config serves the mei-lfm25 worktree (--mei-repo). When that branch is merged/promoted, update --mei-repo/--build-dir to the promoted checkout and re-record the build identity here."
  - "hermes_provider is null: no coding-suite spot-check has been run; create the custom_providers entry only when the lane is actually exercised."

