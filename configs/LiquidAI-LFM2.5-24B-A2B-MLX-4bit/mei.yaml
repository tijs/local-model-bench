    top_k: 50              # 0.32.0 default); 0 disables nucleus filtering
    min_p: 0               # (vmlx applies top-p only when 0 < topP < 1)
    repetition_penalty: 1.05
    # NO reasoning_effort: the vendor specifies none (the model always
    # thinks). Never invented.
hermes_ops_generation_profile: vendor
# coding_reasoning_effort deliberately ABSENT: no vendor effort level is
# declared and the schema's absent = hermes/server default (never invented).

