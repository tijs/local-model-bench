model: AtomicChat/Laguna-XS-2.1-MLX-5bit
# Mei — the native Swift/MLX serving engine (see ~/projects/mei).
#
# EXPLORATORY CANDIDATE — GATE-REQUIRED. This is DURABLE SETUP / reproducible
# config only: it records the intended launch operating point for a full
# benchmark run AFTER (a) the exact staged artifact (file_bytes, shard set,
# checksums) is verified against the expected values below and (b) a bounded
# live probe (load, identity, native tool calls, cache reuse, context cap)
# passes on the mei-build-030 binary. There are NO benchmark/pass/fail/
# performance claims here — this file is not a completed run and must not be
# read as one.
#
# PRECEDING STEP (not this config): mei-build-030 has been confirmed to
# contain Laguna symbols; staging of the MLX artifact began separately. As of
# 2026-09-08 the staged directory holds only shard 5 of 5 — see known_gaps.
# This config adds NO download, NO staging and NO launch.
#
# MODEL-CARD SAMPLING (poolside/Laguna-XS-2.1 official-benchmarking settings,
# mirrored by the GGUF sibling config): temperature 1.0, top-p 1.0, top-k 20.
# generation_config.json additionally declares min_p 0.0 (no minimum-p
# filter). All four are passed explicitly in the launch line; --min-p and
# --enable-thinking are forwarded by runner/start_mei_server.sh as of
# 2026-09-08 (defaults unchanged for all other configs).
#
# THINKING MODE — REQUIRED TO MATCH THE MODEL CARD: generation_config.json
# declares default_chat_template_kwargs.enable_thinking=true, but the staged
# chat_template.jinja defaults enable_thinking to FALSE when unset. The launch
# line therefore forces --enable-thinking true explicitly (with
# --emit-reasoning true) so the served behavior matches the card's own
# official-benchmarking configuration instead of the template's quieter
# default.
#
# PORT NOTE: port 8024 is SHARED with configs/Ornith-1.5-35B-A3B/mei.yaml and
# the Qwen3.6 Mei configs (configs/Qwen3.6-35B-A3B/mei.yaml and
# configs/Qwen3.6-35B-A3B-textonly/mei.yaml; NVIDIA-Nemotron-3.5-Lightning's
# mei.yaml also declares 8024 but is viable: non-viable). This config must
# NEVER run concurrently with any of them — only one local Mei server per run.
# The runner's exact served_model_id identity gate protects against a stale
# cross-model bind; the never-concurrent rule is still mandatory.
temperature: 1.0
reasoning_mode: thinking   # --enable-thinking true + --emit-reasoning true (model-card thinking mode; see header)
inference_engine: mei
mei_commit: 91fed8be21319f92ce5220622c6dcde0b851bdae  # vmlx-swift pin (exact, Mei Package.resolved); mei-build-030 = Mei 0.3.0, vmlx pin e37d1d59 (fork main merged with 37 upstream commits)
mei_source_commit: 67e897e2160d80be65d2e2c2ff15746d4130ad72  # Mei streaming multi-tool-call SSE-index fix (2026-09-05); verified build at .../mei-build-030
source_revision: fc5643bbe0d54b3f76777fbcfd078d61eb0fb0f6  # AtomicChat/Laguna-XS-2.1-MLX-5bit exact HF revision (resolved commit, independently verified)
model_bytes: 22999930195   # EXPECTED staged file_bytes (parent-verified target); MUST be re-verified against the completed staged shard set — see known_gaps
quant_family: MLX 5-bit affine g64 with 8-bit router gates (per staged config.json quantization/quantization_config)
context_cap: 65536         # first-gate context cap (project parity ceiling; model native context 262144; satisfies Hermes >=64K coding-suite minimum)
prefill_step_size: 512     # start_mei_server.sh default convention (same as Ornith/Qwen3.6 Mei legs)
tool_call_path: native_mei_requires_live_probe   # native tool-call compatibility UNVERIFIED — the model declares generation_config tool_call_parser poolside_v1; see settings.native_tool_call_parser

benchmark_launch_command: |
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/Laguna-XS-2.1-MLX-5bit \
    --served-model-id AtomicChat/Laguna-XS-2.1-MLX-5bit --port 8024 --context-cap 65536 \
    --prefill-step-size 512 --max-tokens 32768 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-laguna-XS-2.1 \
    --temperature 1.0 --top-p 1.0 --top-k 20 --min-p 0.0 \
    --emit-reasoning true --enable-thinking true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-030
# Deliberately NOT passed: --compiled-decode (default false), any
# VMLX_ENABLE_UNSAFE_COMPILE=1, optimization/memory/cache-limit controls, and
# VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0. No compiled-decode or unsafe-compile
# forcing for this exploratory candidate; the fused-gate-up env is only added
# if a model-specific gate shows the SwitchGLU cache engages (it is pinned for
# the qwen3_5_moe legs because their gates traced it — nothing is known yet
# for laguna). --load-mmap is not a supported flag in the pinned build.
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  raw_port: 8024          # SHARED with Ornith + Qwen3.6 (and Nemotron, non-viable) — never run concurrently
  needs_proxy: false      # native tool_calls required; probe_mei.py gates this. NOT yet verified for this model/arch.
  hermes_provider: null   # no coding-suite run yet; a custom_providers entry is created only if/when this exploratory leg is actually exercised
  served_model_id: AtomicChat/Laguna-XS-2.1-MLX-5bit
  viable: full            # gate-required: runnable once the staged artifact is verified and the live probe passes; not a completed benchmark

settings:
  - name: artifact_identity
    value: "AtomicChat/Laguna-XS-2.1-MLX-5bit @ fc5643bbe0d54b3f76777fbcfd078d61eb0fb0f6 (model_type laguna, architecture LagunaForCausalLM, 33.4B total params, 40 layers, 256 experts / top-8, 262144 native context, 5-bit affine g64 + 8-bit router gates). EXPECTED staged file_bytes 22999930195 — the on-disk staged directory is INCOMPLETE as of 2026-09-08 (only model-00005-of-00005.safetensors present, 2075297177 bytes; no .provenance.json yet), so the exact final shard set/file_bytes/checksums MUST be re-verified after staging completes before any run."
    source: "Staged config.json (quantization/quantization_config: bits 5, mode affine, group_size 64, gate.proj bits 8 on layers 1-39; layer_types 10 full_attention + 30 sliding_attention with sliding_window 512; max_position_embeddings 262144; num_experts 256, num_experts_per_tok 8) + task-verified expected file_bytes; model.safetensors.index.json metadata total_size 22999711232 (tensor payload)."
  - name: vmlx_swift_pin
    value: "91fed8be21319f92ce5220622c6dcde0b851bdae (Mei Package.resolved, tijs/vmlx-swift fork). Verified build dir: mei-build-030 = Mei 0.3.0 with vmlx pin e37d1d59 (fork main merged with 37 upstream commits). Laguna symbols confirmed present in this binary by the preceding symbol check; live loadability still requires the probe."
    source: "~/projects/mei/Package.resolved; mei-build-030 build provenance (2026-09-07 convention from the active Mei configs)."
  - name: mei_source_pin
    value: "67e897e2160d80be65d2e2c2ff15746d4130ad72 — Mei streaming multi-tool-call SSE-index fix (2026-09-05). This config pins the verified local build at ~/.local/share/local-model-bench/mei-build-030 (not an unverified remote build): --build-dir in benchmark_launch_command resolves exactly there."
    source: "Verified binary/build; mei-build-030/release/mei."
  - name: architecture
    value: "laguna (LagunaForCausalLM): 33.4B total params, 40 layers in a 3:1 pattern — 10 full_attention layers (every 4th; 48 heads) + 30 sliding_attention layers (64 heads) with sliding_window 512; 256 experts / top-8 routed MoE + a shared expert, first layer dense MLP (mlp_only_layers [0], decoder_sparse_step 1); per-head gating; head_dim 128, 8 KV heads; vocab 100352; native context 262144."
    source: "Staged config.json (layer_types, num_attention_heads_per_layer, sliding_window, num_experts, num_experts_per_tok, gating, vocab_size, max_position_embeddings); total-params figure task-verified."
  - name: quant_family
    value: "MLX 5-bit affine, group size 64, with 8-bit router gates (all layer mlp.gate.proj at bits 8 per quantization_config)."
    source: "Staged config.json quantization/quantization_config blocks."
  - name: thinking_mode
    value: "enable_thinking=true FORCED via --enable-thinking true — REQUIRED, not optional: generation_config.json default_chat_template_kwargs.enable_thinking=true matches the model card's official-benchmarking thinking mode, but the staged chat_template.jinja defaults enable_thinking to FALSE when unset (line: enable_thinking | default(false)). Without the explicit flag the served template would run quieter than the card's own numbers. --emit-reasoning true exposes reasoning_content."
    source: "Staged generation_config.json + staged chat_template.jinja (confirmed 2026-09-08); model card (poolside/Laguna-XS-2.1)."
  - name: generation_config_parsers
    value: "Staged generation_config.json declares tool_call_parser=poolside_v1 AND reasoning_parser=poolside_v1. This is the MODEL's declaration of its own tool/reasoning output format — NOT a claim about Mei's native parsing. See native_tool_call_parser."
    source: "Staged generation_config.json (2026-09-08)."
  - name: native_tool_call_parser
    value: "UNVERIFIED — requires the live probe. The model's declared poolside_v1 format (XML-style <tool_call> blocks) is NOT the qwen-style JSON parser Mei's vmlx pre-parsing uses; whether Mei surfaces this model's tool calls as native OpenAI tool_calls (streaming and non-streaming) can only be established by runner/probe_mei.py add_numbers probes on the live server. No native parser result is asserted here; the proxy/parser-shim path is NOT allowed for these rows."
    source: "runner/probe_mei.py; mei-toolcall-parse-contract; staged generation_config.json."
  - name: disk_kv_tier
    value: "Explicit disk KV dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-laguna-XS-2.1 passed via --kv-cache-dir (task-required operating point; same recipe as the qwen3_5_moe/nemotron_h legs). Whether the laguna hybrid topology *needs* the disk tier for cross-turn reuse (needsDiskKVTier classification) is itself unverified pending the gate — the explicit dir is recorded regardless. --kv-bits is not set (fp16 KV)."
    source: "Task-required value; sibling disk-KV convention from configs/Ornith-1.5-35B-A3B/mei.yaml; live behavior pending gate."
  - name: prefill_chunking
    value: "GenerateParameters.prefillStepSize = 512 (start_mei_server.sh default; the chunked-prefill safeguard convention used by the Ornith/Qwen3.6 Mei legs)."
    source: "Mei Engine makeParameters / vmlx TokenIterator prefillStepSize; sibling Mei configs."
  - name: context_and_generation_caps
    value: "65536 prompt tokens (first-gate context cap; model native context is 262144, capped here at the project parity ceiling and Hermes >=64K minimum). Up to 32768 generated tokens."
    source: "Mei ServerConfig contextCap/maxTokensDefault; probe_mei.py exact-token gate (to be run on this candidate)."
  - name: in_process_kv_reuse
    value: "cache-reuse true — exact-extension token-prefix slot; usage.prompt_tokens_details.cached_tokens reports the reused prefix. UNVERIFIED for this arch pending the gate (works for the qwen3_5_moe/nemotron_h hybrids with the disk tier)."
    source: "Mei Engine SlotDecision; sibling Mei configs; live behavior pending gate."
  - name: benchmark_sampling
    value: "temperature 1.0, top-p 1.0, top-k 20, min-p 0.0 — the model card's official-benchmarking sampling for agentic/coding tasks (generation_config.json: temperature 1.0, top_p 1.0, min_p 0.0). All four passed explicitly in the launch line; --min-p is forwarded by start_mei_server.sh as of 2026-09-08. max 32768 generated tokens (generation_config max_new_tokens matches)."
    source: "Staged generation_config.json + model card (poolside/Laguna-XS-2.1, as mirrored by configs/Laguna-XS-2.1/gguf.yaml)."

