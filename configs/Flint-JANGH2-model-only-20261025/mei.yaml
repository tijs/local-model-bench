    --served-model-id OsaurusAI/Flint-40B-A2.5B-JANGH2 --port 8024 --context-cap 65536 \
    --prefill-step-size 64 --max-tokens 8192 \
    --temperature 1.0 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --cache-limit-bytes 536870912 --compiled-decode false \
    --enable-flint true --enable-flint-jangh true --load-mmap true \
    --mei-repo /Users/tijs/projects/mei-flint-jangh2-20261025 \
