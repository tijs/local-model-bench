model: bartowski/Muse-Glimmer-30B-GGUF:Q4_K_M
backend: gguf
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo bartowski/Muse-Glimmer-30B-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 64 --ctx-size 65536

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls confirmed live, clean int args, no proxy needed.

system_prompt_suffix: "Reasoning strength: high"
  # Appended (never replaces) the suite's fixed system prompt by
  # run_prompt_suite.py, since this model needs it to run as intended —
  # NOT a task-content hint, exactly like Qwen's enable_thinking or
  # Laguna's enable_thinking chat_template_kwargs, just expressed as a
  # system-prompt directive for this model family instead of a template
  # kwarg. See the reasoning_strength settings entry below for why this
  # was revisited and actually applied this time.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: muse-gguf
  viable: full

settings:
  - name: temperature / top_p / top_k
    value: 1.0 / 0.95 / 64
    source: "https://huggingface.co/meta-models/Muse-Glimmer-30B model card,
      'optimal performance' preset."
  - name: context_length
    value: 65536 (native 131072+, capped for hermes's needs)
    source: "https://huggingface.co/meta-models/Muse-Glimmer-30B model card"
  - name: reasoning_strength (thinking-mode-equivalent setting — see
      AGENTS.md's standing practice on tracking this per model)
    value: "high, injected via system_prompt_suffix (see above)"
    source: "https://unsloth.ai/docs/models/muse-glimmer +
      https://huggingface.co/meta-models/Muse-Glimmer-30B model card:
      'Reasoning strength can be defined as part of the system prompt as
      \"Reasoning strength: <value>\"' (low/medium/high/xhigh), 'For
      specific use cases like coding, you can force reasoning strength in
      the system prompt with \"Reasoning strength: high\".' Also requires
      llama.cpp build b10353+ (Muse Glimmer support merged 2026-08-10) —
      the installed build (10470) satisfies this."
    note: "REVISED 2026-08-20 (was previously a documented known_gap, not
      applied at all) — per Tijs's standing instruction to do deeper
      research whenever a model underperforms expectations, and the new
      standing practice of testing/tracking thinking-mode settings
      explicitly. This is model-specific config needed to run the model
      as intended, not a task-content hint (same category as Qwen's
      enable_thinking or Laguna's enable_thinking) — appending a generic
      capability-level directive doesn't reveal anything about the
      specific tasks being tested, so it doesn't compromise the
      fixed-system-prompt fairness principle. Retested hermes_ops's two
      prior failures (chaining, error-recovery) under this setting — see
      kiem notes/commit log for the result."
  - name: quant
    value: Q4_K_M (17.3GB per GET /v1/models)
    source: "standard policy for this model size."

last_updated: 2026-08-20
