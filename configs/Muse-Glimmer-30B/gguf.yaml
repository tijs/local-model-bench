model: bartowski/Muse-Glimmer-30B-GGUF:Q4_K_M
backend: gguf
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo bartowski/Muse-Glimmer-30B-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 64 --ctx-size 65536

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls confirmed live, clean int args, no proxy needed.

settings:
  - name: temperature / top_p / top_k
    value: 1.0 / 0.95 / 64
    source: "https://huggingface.co/meta-models/Muse-Glimmer-30B model card,
      'optimal performance' preset."
  - name: context_length
    value: 65536 (native 131072+, capped for hermes's needs)
    source: "https://huggingface.co/meta-models/Muse-Glimmer-30B model card"
  - name: reasoning_strength
    value: "NOT applied — model card recommends injecting 'high'/'xhigh'
      reasoning strength via system prompt for agentic tasks, but this
      benchmark deliberately holds system prompts/task text identical
      across every model for fair comparison, so no per-model prompt
      tweak was added. Architecturally different from Qwen's
      enable_thinking toggle (this is prompt-based, not a template kwarg)."
    note: "KNOWN GAP: if this model underperforms specifically on agentic/
      tool-use tasks, this might be why — worth an isolated retest with
      the recommended reasoning-strength prompt injection if revisiting."
  - name: quant
    value: Q4_K_M (17.3GB per GET /v1/models)
    source: "standard policy for this model size."

last_updated: 2026-08-20
