model: mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit
# ============================================================================
# DISCARDED 2026-09-07 — NOT AN ACTIVE CANDIDATE.
# Kept for provenance and for the negative result; do not run in a sweep.
# Full benchmark: 7/25 (hermes_ops 1/8). The model does not emit tool calls
# when the prompt carries Hermes's ~22k-token tool payload; it narrates the
# intended call in prose and stops. Its decode speed is the best in the
# lineup (~68-70 tok/s) -- speed is not why it was dropped.
# ============================================================================
# Mei — the native Swift/MLX serving engine (see ~/projects/mei).
#
# EXPLORATORY CANDIDATE — NEW ARCHITECTURE (nemotron_h) ADMITTED AFTER ITS OWN
# INDEPENDENTLY VERIFIED BOUNDED GATE only. This is DURABLE SETUP / reproducible
# config: the 2026-09-06 gate passed (12/12 probe_mei + 3x short-decode), and a
# bounded 2026-09-06 benchmark run recorded sanity 2/2 pass and hermes_ops 1/8
# pass (config_hash e7a6209b765d), with a measured 1.02 tok/s average BELOW the
# 4.0 speed gate — so the coding suites were correctly skipped (partial coverage,
# not a completed benchmark leg). The gate
# artifacts live in ~/.local/share/local-model-bench/results-mei/ (cited below,
# NOT copied into any benchmark log). This config adds NO automatic staging
# and NO launch — the artifact is already staged and is served by the
# benchmark_launch_command below exactly as the gate verified it.
temperature: 0.6
reasoning_mode: thinking   # emit-reasoning true; gate confirmed a heavy thinker (empty `content` at low max_tokens, probes need the 1024-token budget)
inference_engine: mei
mei_commit: 91fed8be21319f92ce5220622c6dcde0b851bdae   # vmlx-swift pin (exact, Mei Package.resolved) — the verified gate binary
mei_source_commit: 67e897e2160d80be65d2e2c2ff15746d4130ad72   # Mei streaming multi-tool-call SSE-index fix (2026-09-05)
source_revision: 55ac8c89261109b36c04371cd3f479a4594208c8   # mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit resolved == pinned HF commit (independently verified)
model_bytes: 17775425688   # POST-LOAD healed file_bytes (header-healed in-place by SafetensorsStorageHealer on first load); source file_bytes 17775425359 (+329 header bytes), tensor payload_total UNCHANGED 17775339392
quant_family: MLX 4-bit affine g64 (nemotron_h; 4 safetensors shards)
context_cap: 65536          # exact-cap gate value (project parity cap; also satisfies Hermes >=64K coding-suite minimum)
prefill_step_size: 256     # generic-profile value verified in the gate
tool_call_path: native_mei_only
tool_call_failure_mode: |
  Two distinct regimes, both observed live 2026-09-06/07 at temperature 0:
  (a) small system prompt + large tool payload (~5.5-32k tok): the model emits a
      BARE `<function=NAME><parameter=NAME>…` block with no enclosing <tool_call>
      wrapper. vmlx's XMLFunctionParser is gated on that startTag so it never
      fires and the text lands in `content`. bench_local_proxy.py's qwen3_coder
      parser CAN recover this (verified offline against the real captured forms).
  (b) real Hermes system prompt + large tool payload (~20-36k tok) — THE
      BENCHMARK'S ACTUAL SHAPE: the model emits only a prose preamble and stops.
      No tool-call syntax at all, so no parser can help.
  Ruled out as causes: chat template (the real 4,739-token Hermes prompt alone
  produces a valid call), tool count (22 tools fine), thinking mode
  (--enable-thinking false gives byte-identical failures), raw prompt length
  (6.3k tokens of repeated filler still works), and an explicit
  "you MUST call tools" instruction. With realistic varied context the threshold
  is ~5-6k tokens; Hermes sends ~22k, ~17k of which is tool schemas.
  Remaining untested lever: shrink the tool payload Hermes sends.
benchmark_launch_command: |
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit \
    --served-model-id mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit --port 8024 --context-cap 65536 \
    --prefill-step-size 256 --max-tokens 32768 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-nemotron-30B \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-67e897e
# Port 8024 is the shared bench-mei convention (also Ornith + Qwen3.6) — the
# exact served_model_id identity gate plus the never-concurrent rule keeps a
# stale cross-model bind safe. NEVER run this config concurrently with
# configs/Ornith-1.5-35B-A3B/mei.yaml or configs/Qwen3.6-35B-A3B/mei.yaml.
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  # 8024 is SHARED with the two qwen3_5_moe Mei configs (Ornith, Qwen3.6) —
  # only one local Mei server per run, never concurrently. Same precedent as
  # Qwen3.6 sharing Ornith's 8024.
  raw_port: 8024          # SHARED with Ornith-1.5-35B-A3B + Qwen3.6-35B-A3B — never run concurrently
  needs_proxy: false      # REVERTED 2026-09-07 after the proxy path was tested live and
                          # changed NOTHING (config_hash d9be6d0097ea: hermes_ops 1/8,
                          # identical to the pre-proxy run). The proxy ran correctly with
                          # tool_call_parser=qwen3_coder; it simply never had anything to
                          # recover, because under the real Hermes prompt shape this model
                          # emits NO tool-call syntax at all (`<function=` appears in none
                          # of the 8 results). See tool_call_path below for the two regimes.
                          # Mei DOES emit native tool_calls when the model
                          # produces the wrapped form (gate: 12/12). But under
                          # real Hermes-shaped prompts the model drops the
                          # <tool_call> wrapper and emits a bare
                          # <function=NAME><parameter=NAME>… block, which
                          # vmlx's XMLFunctionParser (gated on its startTag)
                          # never triggers on — so it lands in `content` as
                          # text, tool_calls is empty, and the agent loop ends
                          # after one turn. The proxy parser sees exactly that
                          # text and recovers it. It does NOT clobber native
                          # tool_calls: bench_local_proxy.py only sets
                          # message["tool_calls"] when its parser finds a call,
                          # and a natively-parsed response leaves no
                          # `<function=` text in content for it to match.
  hermes_provider: bench-mei  # 8024 bench-profile provider exists (custom_providers.bench-mei in ~/.hermes/profiles/bench/config.yaml) — the runner passes the served model explicitly via --hermes-model. Set so a future coding-only run could drive this exploratory leg; coding rows were SKIPPED because the hermes_ops speed gate fired (see known_gaps).
  served_model_id: mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit
  viable: non-viable      # DISCARDED 2026-09-07 (user decision). Full benchmark
                          # scored 7/25: sanity 2/2, hermes_ops 1/8, kiem_mini 0/5,
                          # hearth_mini 0/3, kipclip_mini 3/4, hearth_full 1/3.
                          # Cause is a model limit, not a config or harness bug --
                          # see tool_call_failure_mode above. Decode speed is
                          # excellent (~68-70 tok/s, fastest in the Mei lineup) and
                          # is NOT the reason for exclusion. Do not re-admit without
                          # new evidence that it emits tool calls at a ~22k-token
                          # tool payload.

