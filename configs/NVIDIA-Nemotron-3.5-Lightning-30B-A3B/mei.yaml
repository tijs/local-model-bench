model: mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit
# Mei — the native Swift/MLX serving engine (see ~/projects/mei).
#
# EXPLORATORY CANDIDATE — NEW ARCHITECTURE (nemotron_h) ADMITTED AFTER ITS OWN
# INDEPENDENTLY VERIFIED BOUNDED GATE only. This is DURABLE SETUP / reproducible
# config, NOT a completed benchmark row: the 2026-09-06 gate passed (12/12
# probe_mei + 3x short-decode), but NO full benchmark crumbs exist yet (no
# sanity/hermes_ops/coding rows, no hermes bench-profile provider). The gate
# artifacts live in ~/.local/share/local-model-bench/results-mei/ (cited below,
# NOT copied into any benchmark log). This config adds NO automatic staging
# and NO launch — the artifact is already staged and is served by the
# benchmark_launch_command below exactly as the gate verified it.
temperature: 0.6
reasoning_mode: thinking   # emit-reasoning true; gate confirmed a heavy thinker (empty `content` at low max_tokens, probes need the 1024-token budget)
inference_engine: mei
mei_commit: 91fed8be21319f92ce5220622c6dcde0b851bdae   # vmlx-swift pin (exact, Mei Package.resolved) — the verified gate binary
mei_source_commit: 67e897e2160d80be65d2e2c2ff15746d4130ad72   # Mei streaming multi-tool-call SSE-index fix (2026-09-05)
source_revision: 55ac8c89261109b36c04371cd3f479a4594208c8   # mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit resolved == pinned HF commit (independently verified)
model_bytes: 17775425688   # POST-LOAD healed file_bytes (header-healed in-place by SafetensorsStorageHealer on first load); source file_bytes 17775425359 (+329 header bytes), tensor payload_total UNCHANGED 17775339392
quant_family: MLX 4-bit affine g64 (nemotron_h; 4 safetensors shards)
context_cap: 65536          # exact-cap gate value (project parity cap; also satisfies Hermes >=64K coding-suite minimum)
prefill_step_size: 256     # generic-profile value verified in the gate
tool_call_path: native_mei_requires_live_probe

benchmark_launch_command: |
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit \
    --served-model-id mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit --port 8024 --context-cap 65536 \
    --prefill-step-size 256 --max-tokens 32768 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-nemotron-30B \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-67e897e
# Port 8024 is the shared bench-mei convention (also Ornith + Qwen3.6) — the
# exact served_model_id identity gate plus the never-concurrent rule keeps a
# stale cross-model bind safe. NEVER run this config concurrently with
# configs/Ornith-1.5-35B-A3B/mei.yaml or configs/Qwen3.6-35B-A3B/mei.yaml.
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  # 8024 is SHARED with the two qwen3_5_moe Mei configs (Ornith, Qwen3.6) —
  # only one local Mei server per run, never concurrently. Same precedent as
  # Qwen3.6 sharing Ornith's 8024.
  raw_port: 8024          # SHARED with Ornith-1.5-35B-A3B + Qwen3.6-35B-A3B — never run concurrently
  needs_proxy: false      # native tool_calls required; probe_mei.py gates this. Gate-verified 12/12.
  hermes_provider: null   # no coding-suite run yet; the gate gave sanity/ops/tool coverage only. A custom_providers entry is created only if/when this exploratory leg is actually benchmarked.
  served_model_id: mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit
  viable: full            # admitted after its independently verified bounded gate (see known_gaps re: no benchmark rows yet)

settings:
  - name: artifact_identity
    value: "mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit @ 55ac8c89261109b36c04371cd3f479a4594208c8 (arch NemotronHForCausalLM, model_type nemotron_h, 4-bit affine g64, 4 safetensors shards, config_sha256 2d4bdc543efd8ccd68fccbf1231b1d1216ab2a0482229ea5638d448127973b27). POST-LOAD on-disk file_bytes 17775425688; tensor payload_total 17775339392 UNCHANGED vs source (source file_bytes 17775425359; +329 header bytes from the in-place healer on first load — no raw byte-identity claimed). Staged at ~/.local/share/local-model-bench/mei-models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit. Gate evidence: results-mei/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit/20260906T160409Z/"
    source: "mei-models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit.provenance.json + post-load-verify.log + GATE-SUMMARY.md (2026-09-06)."
  - name: vmlx_swift_pin
    value: "91fed8be21319f92ce5220622c6dcde0b851bdae (vmlx pin; Mei Package.resolved) + Mei source build commit 67e897e2160d80be65d2e2c2ff15746d4130ad72. Verified gate binary: ~/.local/share/local-model-bench/mei-build-67e897e/release/mei"
    source: "~/projects/mei/Package.resolved; gate GATE-SUMMARY.md (2026-09-06)."
  - name: quant_family
    value: "MLX 4-bit affine, group 64 (nemotron_h; 4 safetensors shards)."
    source: "provenance verify (quant_bits 4, quant_group_size 64, quant_mode affine)."
  - name: disk_kv_tier_required
    value: "nemotron_h is a disk-backed hybrid (topology layers=29, kvLayers=6, mambaLayers=23, companion=ssm, restore=disk-backed) — it needs the disk KV tier. --kv-cache-dir passes it explicitly (same recipe as the qwen3_5_moe Ornith config); gate engaged the disk-backed prefix tier with a fresh KV dir. In-process KV/prefix reuse verified (cached_tokens 6171 / 786 / 808)."
    source: "gate GATE-SUMMARY.md + references/mei-nemotron-lightning-gate.md (topology, disk tier)."
  - name: prefill_chunking
    value: "GenerateParameters.prefillStepSize = 256, generic optimization profile — the value verified in the gate (context-cap prefill ~208s for 65536 tokens)."
    source: "gate GATE-SUMMARY.md (prefill-step 256, generic profile)."
  - name: context_and_generation_caps
    value: "65536 prompt tokens (exact-cap gate: accepted at 65536, 65537 rejected HTTP 400); up to 32768 generated tokens."
    source: "gate probe context_exact_cap / context_over_cap_rejected PASS."
  - name: in_process_kv_reuse
    value: "cache-reuse true; usage.prompt_tokens_details.cached_tokens reports the reused prefix (cached_tokens 6171 / 786 / 808) on the disk-backed tier."
    source: "gate probe cache_repeat_1/2 + cache_growing_turn1/2 PASS."
  - name: benchmark_sampling
    value: "temperature 0.6, top-p 0.95, top-k 20, emit-reasoning true (reasoning_mode thinking) — the exact verified gate values (matches start_mei_server.sh defaults)."
    source: "gate GATE-SUMMARY.md launch line; runner/start_mei_server.sh defaults."
  - name: native_tool_call_parser
    value: "must pass both non-streaming and streaming add_numbers schema probes on the live server; no proxy/parser shim. Gate-verified 12/12."
    source: "runner/probe_mei.py; gate probe tool_nonstreaming + tool_streaming + parity PASS."
  - name: gate_verified_launch_params
    value: "The independently verified gate launched the generic optimization profile with memory-limit-bytes 30000000000 (30 GB allocator), cache-limit-bytes 0, compiled-decode false, cache-reuse true, disk KV, port 8028. The repo's start_mei_server.sh forwards only a subset of these: cache-limit-bytes 0 and compiled-decode false coincide with the launcher's defaults, and optimization-profile generic is the auto default for this non-qwen3_5_moe arch (auto falls back to generic on unknown metadata); the launcher does NOT forward --memory-limit-bytes, so a plain start_mei_server.sh launch uses the launcher default (1.5x Metal recommended working set ~40 GB on this 32 GB machine) instead of the gate's 30 GB. See known_gaps for exact-reproduction caveat."
    source: "gate GATE-SUMMARY.md; runner/start_mei_server.sh (flags forwarded); mei --help (defaults: compiled-decode false, cache-limit 0, memory-limit default 1.5x)."
  - name: transient_status_timeout
    value: "The FIRST full probe_mei sample (probe-mei.json) reported 11/12 with a benign mei_status 30 s cold-stall. Immediately-after 5/5 direct /v1/mei/status calls returned HTTP 200 in <20ms, and the CLEAN REPEAT (probe-mei-2.json) passed 12/12 including mei_status (0.00s). Classified as a transient cold-status stall on the first probe_mei invocation after heavy probe_load activity — not reproducible, no probe silently skipped. The clean 12/12 repeat is the admission basis."
    source: "results-mei/.../20260906T160409Z/probe-mei.json (11/12) + probe-mei-2.json (12/12) + GATE-SUMMARY.md."

known_gaps:
  - "NO FULL BENCHMARK ROWS EXIST YET. This config is admitted after its independently verified bounded gate only (load + identity + native tool calls + context-cap + KV-reuse + short-decode 70.4/70.1/70.3 tok/s + peak ~19.4 GB). A real sanity/hermes_ops/coding benchmark leg still needs to run; hermes_provider is null until a bench-profile provider is created for it."
  - "Transient-status note: the FIRST probe_mei sample had a mei_status 30 s timeout (11/12) but the clean repeat passed 12/12; see settings.transient_status_timeout. Do not treat the 11/12 first-sample as a defect."
  - "The verified gate launched with --optimization-profile generic, --memory-limit-bytes 30000000000, --cache-limit-bytes 0, --compiled-decode false, disk KV. start_mei_server.sh forwards only --kv-cache-dir (disk KV) plus the sampling/context flags; generic profile, cache-limit 0, and compiled-decode false coincide with the launcher defaults, but --memory-limit-bytes is NOT forwarded, so the launcher's default allocator limit (~40 GB = 1.5x Metal recommended working set) would be used instead of the gate's 30 GB on a full benchmark run. For exact-reproduction of the gate operating point, pin the memory limit (direct `mei` invocation with --memory-limit-bytes 30000000000, or extend start_mei_server.sh) before trusting benchmark numbers."
  - "--load-mmap is deliberately NOT in this launch command: it is not a supported flag in the pinned build's --help (silently accepted, likely no-op in the gate baseline) and is unnecessary on this bare staged dir."
  - "Port 8024 is SHARED with configs/Ornith-1.5-35B-A3B/mei.yaml and configs/Qwen3.6-35B-A3B/mei.yaml — NEVER run this config concurrently with either (only one local Mei server per run). The runner's exact served_model_id identity gate protects against a stale cross-model bind."
  - "Live status/artifact paths are recorded in ~/.local/share/local-model-bench/results-mei/ after the gate; config existence alone is not proof of compatibility — this one's gate is documented in GATE-SUMMARY.md (2026-09-06, 12/12)."
