model: mlx-community/Devstral-Small-2507-4bit-DWQ
backend: mlx
# Added 2026-08-22 (methodology review, finding F12) — see gguf.yaml in
# this same directory for the full rationale (fills the "non-Qwen
# coding/agentic family" model-list gap).
temperature: 0.15
reasoning_mode: n/a
framework: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) uv run --locked --extra mlx python -m vllm_mlx.server \
    --model mlx-community/Devstral-Small-2507-4bit-DWQ --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.15 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8015/v1
  # PROXY LIKELY NEEDED — unlike Devstral's GGUF leg. AGENTS.md documents
  # vllm-mlx 0.4.1's native tool-call-parser registry includes "mistral"
  # by name (unlike Qwen2.5-Coder-14B's sibling config, which has no such
  # documented native-parser confirmation for its family) — this is the
  # one candidate in this batch with the STRONGEST prior for native
  # support working. Still UNVERIFIED for this specific checkpoint/DWQ
  # quantization; spot-check the raw endpoint before trusting. If native
  # parsing doesn't fire, this needs bench_local_proxy.py with a new
  # 'mistral' parser (none exists yet — see runner/bench_local_proxy.py's
  # existing parser list) pointed at this port instead, same as
  # Qwen3-Coder-30B-A3B needed one for its qwen3_xml format.

orchestration:
  raw_port: 8018
  needs_proxy: false   # provisional — see benchmark_endpoint note; the
    # single most likely thing to need correcting after a live spot-check
    # in this whole batch of new configs.
  hermes_provider: devstral-mlx   # needs registering in
    # ~/.hermes/profiles/bench/config.yaml before first use.
  viable: full   # native max_position_embeddings is 131072 — no
    # context-extension mechanism needed, unlike Qwen2.5-Coder-14B/mlx.yaml.

settings:
  - name: quant
    value: 4-bit DWQ (mlx-community/Devstral-Small-2507-4bit-DWQ)
    source: "Confirmed present via the HF models API 2026-08-22. DWQ
      (Distilled/Dynamic Weight Quantization — mlx-community's calibrated
      4-bit method) rather than a plain uniform 4-bit cast; an
      lmstudio-community 8-bit MLX repo
      (Devstral-Small-2507-MLX-8bit) also exists if a higher-precision
      MLX leg is wanted for a matched-quant comparison against a future
      GGUF Q8_0/F16 variant — not added here, this batch targets one
      quant per new model per the review's own 'ladders for finalists
      only' guidance (R9)."
  - name: context_length
    value: 65536 (native 131072, no scaling/extension needed)
    source: "https://huggingface.co/mistralai/Devstral-Small-2507
      config.json — same as gguf.yaml, framework-independent model
      property."
  - name: temperature
    value: 0.15
    source: "Model card's own documented example request — same as
      gguf.yaml. No top_p override set here either, for the same reason
      (not separately documented, so left at framework default)."

known_gaps:
  - "Tool-call parsing (native vs. proxy-required) is the single biggest
    open question for this config — see benchmark_endpoint note. Confirm
    with a direct raw-endpoint request before trusting any hermes_ops or
    coding result."
  - "Never run live as of authoring."
  - "hermes_provider entry not yet added to
    ~/.hermes/profiles/bench/config.yaml — do that before the first run."

last_updated: 2026-08-22
last_verified_against_docs: 2026-08-22
