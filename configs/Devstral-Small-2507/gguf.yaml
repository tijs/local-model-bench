model: unsloth/Devstral-Small-2507-GGUF:Q4_K_M
backend: gguf
# Added 2026-08-22 (methodology review, finding F12): fills the "non-Qwen,
# coding/agentic-tuned model family" gap the review identified — every
# other coding-capable model in this repo is Qwen-lineage. Devstral is
# Mistral-lineage, reports 53.6% SWE-Bench Verified (Mistral's own
# published number — genuine agentic-coding benchmark reputation, not
# just general chat capability), and Mistral's own model card explicitly
# describes it as fitting "a Mac with 32GB RAM" — directly on-target for
# this hardware. Both a GGUF quant repo (this one) and a real MLX quant
# repo (see mlx.yaml) confirmed to exist via the HF models API before
# authoring this config.
temperature: 0.15
reasoning_mode: n/a
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo unsloth/Devstral-Small-2507-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 0.15 --top-p 1.0 --ctx-size 65536 \
    --jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Assumed native tool_calls via llama-server's --jinja auto-detection of
  # the GGUF's embedded Mistral tool-calling chat template — NOT yet
  # confirmed live for this specific checkpoint/quantizer. Mistral-format
  # tool calling ([TOOL_CALLS] token format, distinct from Qwen/Hermes-
  # style JSON-in-tags) has broad llama.cpp support via --jinja, but spot
  # check before trusting any result, per this benchmark's standing
  # policy (AGENTS.md).

orchestration:
  raw_port: 8017
  needs_proxy: false   # assumed — see benchmark_endpoint note above.
  hermes_provider: devstral-gguf   # needs registering in
    # ~/.hermes/profiles/bench/config.yaml before first use.
  viable: full   # native max_position_embeddings is 131072 (confirmed
    # via config.json) — this model clears Hermes's 64K coding minimum
    # WITHOUT any context-extension mechanism, unlike Qwen2.5-Coder-14B
    # in the sibling config directory. Simpler, more confidently correct
    # config as a result.

settings:
  - name: quant
    value: Q4_K_M (unsloth/Devstral-Small-2507-GGUF)
    source: "Confirmed present via a live HF resolve HEAD request
      2026-08-22 (14.33GB). A larger UD-Q6_K_XL variant (20.79GB) is also
      confirmed available in the same repo — worth trying as a follow-up
      quant-ladder rung if this model ranks well (per the methodology
      review's own R9 recommendation: ladders for finalists, not every
      model)."
  - name: context_length
    value: "65536 (native 131072, no scaling/extension needed)"
    source: "https://huggingface.co/mistralai/Devstral-Small-2507
      config.json — max_position_embeddings: 131072, confirmed directly,
      not inferred from marketing copy."
  - name: temperature / top_p
    value: 0.15 / 1.0
    source: "temperature=0.15 is the model card's own documented example
      request (data = {..., 'temperature': 0.15}). top_p is NOT
      separately documented on the model card — 1.0 here means no
      nucleus-sampling restriction, i.e. framework default, not a
      specific Mistral recommendation. Flagged distinctly rather than
      implying both values came from the same citation."
  - name: architecture
    value: "Dense, 24B params, 40 layers, GQA (32 attention heads / 8 KV
      heads)"
    source: "https://huggingface.co/mistralai/Devstral-Small-2507
      config.json, confirmed directly."
  - name: tool_call_parser
    value: "assumed native via llama-server --jinja (Mistral
      [TOOL_CALLS]-format chat template) — UNVERIFIED, first use of this
      model in this benchmark."
    source: "Mistral's documented tool-calling format for this model
      family; not yet spot-checked against this specific
      checkpoint/quantizer's raw output."

known_gaps:
  - "Never run live as of authoring. First run should confirm native
    tool_calls come back non-empty from the raw endpoint (or this needs
    bench_local_proxy.py), and measure actual peak RSS at Q4_K_M + 64K KV
    cache (per the memory-instrumentation fix, finding F7)."
  - "hermes_provider entry not yet added to
    ~/.hermes/profiles/bench/config.yaml — do that before the first run."

last_updated: 2026-08-22
last_verified_against_docs: 2026-08-22
