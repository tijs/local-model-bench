    value: "Weights are ternary g128: {−1, 0, +1} values with one FP16 group-wise scale per 128 weights (true ~1.72 bits/weight), stored in a blockwise-Hadamard-rotated basis (block 1024, fixed ±1 signs, rotation folded into the stored weights; the runtime applies the matching activation transform or refuses to load). GGUF PTQ1_0 packs trits densely (1.75 bpw effective, 5.95 GB) — the pick where memory binds; it is NOT the pack the packager measured on Apple Silicon (their Apple rows are PQ2_0), so PTQ1_0-on-Metal throughput is packager-UNMEASURED. SIBLING PQ2_0 (2-bit slots, 2.13 bpw, 7.21 GB) is a SEPARATE artifact: Ternary-Bonsai-2-27B-PQ2_0.gguf, 7,206,168,928 bytes, HF LFS sha-256 3907dc1658db1f78a9826bf8d5bcb8dc65db0d466388937af57f2294fae62ec1 (verified via HF tree API at the pin 2026-09-18; NOT staged) — recorded here as an optional companion only; a PQ2_0 benchmark arm would be its OWN separate candidate/config with its own rows, hashes, and ranking, and must never merge with this one. mmproj files (Ternary-Bonsai-2-27B-mmproj-BF16.gguf 931,145,856 B; Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf 629,246,976 B, per HF tree API at the pin) are the optional vision tower and are NOT part of this text/tool candidate — text-only serving never pays for them (card: mmproj loads only when an image arrives)."
