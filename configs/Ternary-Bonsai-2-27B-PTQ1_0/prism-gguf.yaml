  # compiles (#177)", 2026-09-17) was BUILT LOCALLY (cmake, Metal, Release)
  # on 2026-09-18 into
  # /Users/tijs/.local/share/local-model-bench/prism-llama-5d80cff/
  # build/bin/llama-server (outside the repo, NOT committed); `llama-server
  # --version` re-verified 2026-09-18 == 0.2.0-dev (build 1, commit 5d80cff).
