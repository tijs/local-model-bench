    source: "gh api repos/PrismML-Eng/llama.cpp (license MIT), gh api repos/PrismML-Eng/llama.cpp/releases/tags/prism-b10687-5d80cff (tag/commit/assets), gh api repos/PrismML-Eng/llama.cpp/commits/5d80cff0b8cb9f2bf823cfc4e71e3abb97f290d6, model card at the pin (Quickstart section), https://github.com/PrismML-Eng/Bonsai-demo — all 2026-09-18."
