  # arm64 asset is NOT yet published as of 2026-09-18, see
  # settings/runtime_pin). The runner appends its own bench-<config-hash>
  # identity alias (engine label starts with "llama.cpp") and its guard
  # refuses a launch block that already sets a fixed sampling seed (the
  # check is a substring scan over the whole block, comments included — so
  # this comment must not name that flag literally). Keep the last line a
  # plain flag with no trailing backslash.
  # Model: NOT STAGED — this is the PLACEHOLDER HF hub-cache snapshot path for
  # the verified public artifact (repo prism-ml/Ternary-Bonsai-2-27B-gguf,
  # revision 6ed5e12bf84b7a63069882c91dd9e9218647d17b, file
  # Ternary-Bonsai-2-27B-PTQ1_0.gguf, 5,946,648,928 bytes, sha256
  # 53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3 — the HF
  # LFS oid at the pin, NOT a local on-disk re-verification). Do NOT launch
  # until staged (the runner preflight / unload_all.sh discipline applies),
  # and re-verify the on-disk sha256 equals the LFS oid at staging time.
  # Flags follow the repo's standing llama.cpp control set + the card's
  # published thinking-mode preset (temp 1.0 / top-p 0.95 / top-k 20 /
  # min-p 0.0). No --reasoning flag (card: thinks by default; token
  # flag interplay on this fork binary = gate item). No --hf-repo: exact
  # local file only.
  /Users/tijs/projects/local-model-bench/runner/.prism-llama/build/bin/llama-server \
    --model /Users/tijs/.cache/huggingface/hub/models--prism-ml--Ternary-Bonsai-2-27B-gguf/snapshots/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
    --host 127.0.0.1 --port 8017 \
    --ctx-size 65536 --parallel 1 --n-gpu-layers 99 --flash-attn on \
    --jinja --cache-prompt \
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Native tool_calls expected from the fork's server path (Bonsai-demo is the
  # packager's "source of truth" for server/tool-calling/reasoning-budget
  # flags). Agentic tool calling is card-attested ONLY via the thinking-mode
