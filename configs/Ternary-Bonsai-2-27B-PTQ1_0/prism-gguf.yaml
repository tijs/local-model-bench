    value: "inference_engine: llama.cpp-prism is an explicit SEPARATE engine label so leaderboard grouping (build_leaderboard.py groups rows by (model, inference_engine, quant, config_hash, runner_git_sha), reading the engine from the log row verbatim) keeps this fork's future rows in their own group — never mixed with, averaged against, or compared as if identical to stock `llama.cpp` rows from the ggml-org a302733 mainline build. run_bench.py's identity-alias logic keys on inference_engine.startswith('llama.cpp') (server_command/run_one), so the runner-appended bench-<config-hash> alias and the exact served-identity gate work unchanged for this label; the label is also what the speed-gate record and rows carry. Stock llama.cpp claims, leaderboard entries, or harness results must never be attributed to this fork (different kernels, different tail behavior, different admission evidence)."
