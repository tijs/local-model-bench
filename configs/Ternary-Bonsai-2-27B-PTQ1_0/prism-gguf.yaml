  # refuses a launch block that already sets a fixed sampling seed (the
  # check is a substring scan over the whole block, comments included — so
  # this comment must not name that flag literally). Keep the last line a
  # plain flag with no trailing backslash.
  # Model: STAGED — the exact HF hub-cache snapshot path for the verified
  # public artifact (repo prism-ml/Ternary-Bonsai-2-27B-gguf, revision
  # 6ed5e12bf84b7a63069882c91dd9e9218647d17b, file
  # Ternary-Bonsai-2-27B-PTQ1_0.gguf). On-disk re-verification 2026-09-18 at
  # that exact path: blob 5,946,648,928 bytes, sha256
  # 53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3 == the
  # HF LFS oid at the pin (snapshot symlink -> blobs/53107f53...). Standard
