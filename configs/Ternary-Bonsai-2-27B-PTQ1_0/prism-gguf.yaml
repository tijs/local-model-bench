    # serves the file without a load refusal) precedes even staging use.
  viable: full            # QUEUED / GATED / UNRANKED candidate: runnable in
    # principle, but ranked nowhere until a COMPLETE 25-row current-suite
    # battery passes AND every known_gap gate (fresh runtime, artifact,
    # native identity/plain+streaming/tool/cache/context) is closed. Same
    # convention as the Qwen3.6/Gravity GGUF arms (viable: full to stay
    # runnable, banner in known_gaps).

