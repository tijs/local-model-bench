model: prism-ml/Ternary-Bonsai-2-27B-gguf:PTQ1_0
# ADMITTED (bounded native gate) / GATED / UNRANKED — PrismML's Bonsai 2 27B
# GGUF PTQ1_0 arm, discovered via
# https://bsky.app/profile/indexx.dev/post/3mvqm7pplqs2r (2026-09-18) and
# pinned per parent task. The bounded native admission gate PASSED 2026-09-18
# on the pinned Prism runtime + staged artifact (identity / plain non-stream +
# stream / native tool non-stream + stream / cache reuse / context) — evidence:
# artifacts/bonsai2-ptq1-native-gate-20260918.md and
# artifacts/bonsai2-ptq1-canonical-alias-recheck-20260918.md (the recheck
# corrected the initial gate's one-hex-digit alias typo under the
# runner-canonical alias). That is admission capability evidence only: zero
# results/log.jsonl rows exist under this config's hash, so it is ranked
# nowhere until a COMPLETE current-suite benchmark run lands (the 25-row
# default battery: sanity 2 + hermes_ops 8 + kiem_mini 5 + hearth_mini 3 +
# kipclip_mini 4 + hearth_full 3 — run_bench.py --coding-suites default since
# 2026-08-25). The one-trial canary (artifacts/bonsai2-ptq1-canary-20260918.jsonl)
# is exploratory 2/6 model-behavior evidence (four max_turns/truncation
# errors), not benchmark rows. Do not treat any claim in this file as a quality
# or benchmark result — only as artifact + setup + admission provenance.
#
# CRITICAL ENGINE FACT: this is NOT a stock llama.cpp candidate. PTQ1_0 (and the
# sibling PQ2_0) are ternary hybrid-attention packings that ONLY the PrismML
# llama.cpp fork can load — the model card is explicit that stock llama.cpp
# rejects PTQ1_0/PQ2_0 as unknown types (and would silently load a Q2_0 build
# into garbage for lack of the Hadamard activation runtime). The run-time pin is
# therefore PrismML-Eng/llama.cpp release/tag prism-b10687-5d80cff, commit
# 5d80cff0b8cb9f2bf823cfc4e71e3abb97f290d6 (MIT), NOT the local ggml-org
# mainline build (commit a302733) that every other llama.cpp config pins. The
# inference_engine label is `llama.cpp-prism` — an explicit SEPARATE engine
# label so this candidate's future rows group under their own
# (model, engine, quant, config_hash, runner_git_sha) key in the leaderboard
# and can never be mistaken for, or merged with, stock `llama.cpp` rows.
# `server_command`'s identity-alias logic keys off
# `inference_engine.startswith("llama.cpp")`, so the runner's exact-identity
# gate (bench-<config-hash> alias + assert_serving_expected_model) still works
# for this label.
#
# STAGED and BOUNDED-GATE-ADMITTED (as of 2026-09-18): the immutable revision
# 6ed5e12bf84b7a63069882c91dd9e9218647d17b is present on-disk at the exact
# snapshot path below (blob 5,946,648,928 bytes, sha256
# 53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3 == the HF
# LFS oid, re-verified locally) AND the pinned Prism fork binary is built
# locally at orchestration.server_binary (source commit
# 5d80cff0b8cb9f2bf823cfc4e71e3abb97f290d6; `llama-server --version` ==
# 0.2.0-dev, build 1, commit 5d80cff). No benchmark has run under this
# config's hash; the bounded native gate (identity / plain+streaming / tool /
# cache / context) PASSED on this exact binary + artifact (2026-09-18,
# artifacts/bonsai2-ptq1-native-gate-20260918.md; the initial probe set's
# one-hex-digit alias typo was corrected by the canonical-alias recheck,
# artifacts/bonsai2-ptq1-canonical-alias-recheck-20260918.md). The runner
# re-gates identity at run time anyway (assert_serving_expected_model with a
# runner-appended bench-<config-hash> identity alias + a plain-completion
# probe), so the first real battery re-verifies independently.
temperature: 1.0
reasoning_mode: thinking   # card "Thinking Mode" preset (and the GGUF's own
                           # general.sampling.* defaults) — temp 1.0; NOT an
                           # explicit llama-server --reasoning flag here
                           # (card: "this is a reasoning model and it thinks by
                           # default"; flag interplay on the pinned fork binary
                           # is UNVERIFIED — see known_gaps)
hermes_ops_max_tokens: 16384
  # Defensive thinking-mode cap, same pre-emptive rationale and value as
  # configs/Gravity-30BA5B-RL-GGUF/gguf-q4km.yaml (benchmark-v4 hermes_ops
  # fix): run_prompt_suite.py's one-shot hermes_ops client has no
  # finish_reason=length continuation, so the default 4096-token cap risks
  # truncating this reasoning-emitting family before a final answer. The card
  # documents xhigh reasoning effort as the default (medium supported; low
  # unsupported), so reasoning output can be long — the cap is defensive
  # belt-and-braces, not a known need; no hermes_ops rows exist yet.
# OPTIONAL request-time generation profiles (2026-09-22, task-specific
# generation contract — per-model POLICY, on top of the infrastructure in
# configs/README.md): named lanes whose fields run_prompt_suite.py forwards
# onto the one-shot Hermes Ops client as per-request sampling/reasoning
# settings (schema + compatibility notes in configs/README.md). Every field
# is vendor-sourced — see settings/generation_profiles_policy for citations.
# A field a profile does not declare is NOT sent (backend launch/default
# applies); reasoning_effort is never invented.
generation_profiles:
  capability:      # capability/high lane — the card's own operating point.
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0
    reasoning_effort: xhigh   # card default: xhigh by default (medium
                              # supported, low unsupported).
  practical:       # practical/medium comparison lane — same card sampling,
    temperature: 1.0          # lower effort only. medium is explicitly
    top_p: 0.95               # supported by the card (unlike low), so the
    top_k: 20                 # overlay is vendor-sanctioned, not invented.
    min_p: 0
    reasoning_effort: medium
hermes_ops_generation_profile: capability
  # Explicit general/vendor default for Hermes Ops (plan 7f5c67e7): future
  # hermes_ops rows for this config run at the capability lane (card thinking
  # preset + card-default xhigh effort) instead of the historic temperature=0
  # wire shape. Historic rows are append-only and untouched; the no-profile
  # lane remains available by dropping this key or selecting none.
coding_reasoning_effort: xhigh
  # Model-specific coding profile: card-default effort for the hermes-chat
  # coding suites once a bench hermes_provider exists (currently null — coding
  # is not runnable for this config until one is registered; this key records
  # the intended lane, it creates no runs).
inference_engine: llama.cpp-prism   # SEPARATE engine label: the PrismML-Eng
                                    # llama.cpp FORK (ternary hybrid-attention
                                    # kernels), pinned to release/tag
                                    # prism-b10687-5d80cff / commit
