    value: "prism-ml/Ternary-Bonsai-2-27B-gguf revision 6ed5e12bf84b7a63069882c91dd9e9218647d17b, file Ternary-Bonsai-2-27B-PTQ1_0.gguf, 5,946,648,928 bytes, sha256 53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3. Revision + size + LFS oid verified live via the HF API at the pin 2026-09-18 (model repo API sha == 6ed5e12…, tree listing at the pin: Ternary-Bonsai-2-27B-PTQ1_0.gguf size 5946648928, lfs oid 53107f53…; git ls-remote shows 6ed5e12… is also refs/heads/main). The sha256 was the HF LFS blob-store oid and is now also a LOCAL on-disk re-computation: staged 2026-09-18 at the exact snapshot path ~/.cache/huggingface/hub/models--prism-ml--Ternary-Bonsai-2-27B-gguf/snapshots/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PTQ1_0.gguf (via `hf download prism-ml/Ternary-Bonsai-2-27B-gguf Ternary-Bonsai-2-27B-PTQ1_0.gguf --revision 6ed5e12…`), re-verified on-disk: blob == symlink target == LFS oid, size 5,946,648,928 bytes, shasum -a 256 == 53107f53… (snapshot symlink resolves to blobs/53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3). base_model Qwen/Qwen3.8-27B (hybrid-attention backbone, 27.36B total: 24.35B language backbone + 2.54B embedding/LM head + 0.46B vision tower), Apache-2.0. NOTE on the git tree oid: the task pin recorded 8c9da0522bd62bdda9347ed1855ea024d7e11765, but an independent `git fetch --depth 1` of this exact commit on 2026-09-18 resolved its tree to 9f0f3229eac97cf2e7358a261794c6c274bbe1ac — the 8c9da052 value could NOT be reproduced and is recorded here as supplied-but-unverified; the verified tree of 6ed5e12… is 9f0f3229…."
