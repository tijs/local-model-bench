model: LiquidAI/LFM2.5-8B-A1B-GGUF:Q8_0
backend: gguf
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.2
reasoning_mode: n/a
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo LiquidAI/LFM2.5-8B-A1B-GGUF:Q8_0 \
    --host 127.0.0.1 --port 8017 \
    --temp 0.2 --top-k 80 --repeat-penalty 1.05 \
    --ctx-size 65536 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # tool_call_parser: native (lfm format, same as LFM2.5-2.6B) — confirmed
  # llama-server handles it without a proxy for the 2.6B model; verify live
  # before trusting results, same standing policy as every new model+backend.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: lfm8b-gguf
  viable: full

settings:
  - name: quant
    value: Q8_0 (official LiquidAI/LFM2.5-8B-A1B-GGUF)
    source: "same quant policy as LFM2.5-2.6B's config — near-lossless,
      model is small enough (8.3B total, MoE) that aggressive quantization
      isn't needed."
  - name: architecture
    value: "MoE, 8.3B total / 1.5B active params (24 layers: 18 double-
      gated conv + 6 GQA) — expect speed closer to a 1.5B dense model."
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card."
  - name: temperature / top_k / repetition_penalty
    value: 0.2 / 80 / 1.05
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card,
      agentic/tool-use recommended settings. Distinct from LFM2.5-2.6B's
      (0.1/50/1.1) — do not reuse the smaller model's settings here, this
      is a separate model with its own tuned defaults."
  - name: context_length
    value: 65536 (native 128000, capped per hermes's >=64K hard minimum
      and this benchmark's standard ceiling)
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card +
      AGENTS.md hermes hard-minimum note."
  - name: tool_call_format
    value: "same <|tool_call_start|>[fn(arg=val)]<|tool_call_end|>
      Pythonic format as LFM2.5-2.6B"
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card —
      confirmed identical family format to the 2.6B model, so the existing
      bench_local_proxy.py 'lfm' parser applies unchanged if a proxy turns
      out to be needed on the MLX side (as it was for 2.6B)."

known_gaps:
  - "Native GGUF tool_calls assumed from the LFM2.5-2.6B precedent (same
    format family) — confirm via a live spot-check before trusting."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
