model: LiquidAI/LFM2.5-8B-A1B-MLX-bf16
backend: mlx
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.2
reasoning_mode: n/a
framework: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) ${BENCH_PYTHON:-/Users/tijs/.cocore/python/bin/python} -m vllm_mlx.server \
    --model LiquidAI/LFM2.5-8B-A1B-MLX-bf16 --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.2 --default-top-k 80 \
    --default-repetition-penalty 1.05 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8015/v1
  # bench_local_proxy.py (BENCH_TOOL_PARSER=lfm, same as LFM2.5-2.6B) —
  # vllm-mlx has no server-side tool-call parser at all, and this model
  # uses the same <|tool_call_start|>[fn(...)]<|tool_call_end|> format as
  # the 2.6B model, so the existing 'lfm' parser applies unchanged. Verify
  # live before trusting (standing policy), but no new parser expected.

orchestration:
  raw_port: 8018
  needs_proxy: true
  proxy_parser: lfm
  proxy_port: 8015
  hermes_provider: lfm8b-mlx
  viable: full

settings:
  - name: quant
    value: bf16 (LiquidAI/LFM2.5-8B-A1B-MLX-bf16)
    source: "8.3B total params at bf16 is ~16.6GB — comfortably fits this
      32GB Mac with headroom, same reasoning as the 2.6B model's bf16
      choice (small enough that quantization isn't needed for capacity)."
  - name: architecture
    value: "MoE, 8.3B total / 1.5B active params"
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card."
  - name: temperature / top_k / repetition_penalty
    value: 0.2 / 80 / 1.05
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card,
      agentic/tool-use recommended settings — same as the GGUF config
      (framework-independent model property)."
  - name: context_length
    value: 65536 (native 128000, capped per hermes's >=64K hard minimum)
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card +
      AGENTS.md hermes hard-minimum note."
  - name: tool_call_parser
    value: lfm (bench_local_proxy.py, same as LFM2.5-2.6B)
    source: "same format family confirmed on the model card — Pythonic
      <|tool_call_start|>[fn(arg=val)]<|tool_call_end|> syntax, identical
      to the already-verified 2.6B parser."

known_gaps:
  - "Native tool-call format assumed identical to LFM2.5-2.6B from the
    model card — not yet independently re-verified against this specific
    checkpoint's raw output; confirm before fully trusting results."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
