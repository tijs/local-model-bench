model: LiquidAI/LFM2.5-8B-A1B-GGUF:BF16
# Added 2026-08-23 — the other direction of the quant-matching gap Tijs
# flagged: the plain gguf.yaml (Q8_0) was being compared against mlx.yaml
# (bf16, full precision) as if they were the same quant. This config goes
# the other way — full-precision GGUF — to directly match mlx.yaml's own
# bf16 weights, completing the matrix alongside mlx-8bit.yaml (which goes
# the other direction: MLX at Q8_0 to match this directory's plain gguf.yaml).
temperature: 0.2
reasoning_mode: n/a
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo LiquidAI/LFM2.5-8B-A1B-GGUF:BF16 \
    --host 127.0.0.1 --port 8017 \
    --temp 0.2 --top-k 80 --repeat-penalty 1.05 \
    --ctx-size 65536 --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # tool_call_parser: native (lfm format) — same as gguf.yaml (Q8_0
  # sibling), same model/template, only the quant differs. Verify live
  # before trusting results, same standing policy as every new config.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: lfm8b-gguf-bf16   # needs registering in
    # ~/.hermes/profiles/bench/config.yaml before first coding-suite use.
  viable: full

settings:
  - name: quant
    value: "BF16 (official LiquidAI/LFM2.5-8B-A1B-GGUF), 16.95GB per the
      HF models API — full precision, matching configs/LiquidAI-LFM2.5-8B-A1B/
      mlx.yaml's bf16 weights exactly, for a genuine same-precision
      GGUF-vs-vllm-mlx comparison (the plain gguf.yaml sibling is Q8_0,
      which is NOT the same precision as that mlx.yaml config)."
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B-GGUF — file
      listing checked 2026-08-23 (LFM2.5-8B-A1B-BF16.gguf, 16.95GB)."
  - name: architecture
    value: "MoE, 8.3B total / 1.5B active params — same as gguf.yaml, this
      config only changes the quant, not the model."
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card."
  - name: temperature / top_k / repetition_penalty
    value: 0.2 / 80 / 1.05
    source: "Same as configs/LiquidAI-LFM2.5-8B-A1B/gguf.yaml — a
      checkpoint property, not quant- or engine-specific, so unchanged
      here."
  - name: context_length
    value: 65536 (native 128000, capped per hermes's >=64K hard minimum,
      same as gguf.yaml)
    source: "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B model card +
      AGENTS.md hermes hard-minimum note."

known_gaps:
  - "Native GGUF tool_calls assumed from the gguf.yaml (Q8_0) precedent —
    confirm via a live spot-check before trusting; a different quant of
    the same model+template should behave identically here, but this
    hasn't been independently re-verified for BF16 specifically."
  - "hermes_provider entry not yet added to
    ~/.hermes/profiles/bench/config.yaml — do that before the first
    coding-suite run."
  - "Never run live as of authoring."

last_updated: 2026-08-23
