model: AutomatosX/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP
# AXQ 4-bit mixed-precision quant of Qwen3.6-35B-A3B (AutomatosX, AXQuant
# v1.2.0) — the AXQ 4-bit leg of the post-0.5.0 Qwen3.6 research track
# (Kiem plan 7f5c67e7-b564-4df3-8209-14f7443b56e2, todo 19). MLX-served via Mei.
#
# CANONICAL SAFE-GATE CONFIG. Mirrors the Qwen3.6 OptiQ safe-gate control set
# (configs/Qwen3.6-35B-A3B-OptiQ/mei.yaml): VMLX_ENABLE_UNSAFE_COMPILE=0, NO
# --model-profile, --compiled-decode false, explicit --load-mmap false,
# MLX_SAFETENSORS_MMAP=0, fused-gate-up cache disabled, explicit KV disk tier,
# fixed 30 GB MLX allocator limit. The stock Qwen3.6 sibling configs' C1
# unsafe-compile=1 does NOT apply to this unproven candidate; the bounded
# native gate must pass before any coding suite runs.
#
# UNRANKED: this commit records a reproducible candidate + staging provenance
# only. No results/log.jsonl row, no leaderboard change. The bounded native
# Mei acceptance gate (run_mei_acceptance.py on THIS config) must pass before
# the full 25-row battery (2 sanity + 8 hermes_ops + 5 kiem_mini +
# 3 hearth_mini + 4 kipclip_mini + 3 hearth_full) is authorized.
#
# PORT NOTE: port 8024 is shared with the Ornith / Qwen3.6 stock / OptiQ /
# Nemotron Mei configs. NEVER run two of them concurrently.
temperature: 0.6
reasoning_mode: thinking   # emit-reasoning true (native reasoning_content); Qwen3.8 sibling convention
inference_engine: mei
mei_commit: 44461ffdf8dca836b624b2d0d268c800dedea05e  # vmlx-swift pin found IN the verified 0.5.0 build's checkout (mei-build-qwen36-optiq-050/checkouts/vmlx-swift) — the 0.5.0-shipped engine
mei_source_commit: 1518e7010875ff5fdfca2cfc29bb4a4f3bf31aeb  # Mei tag v0.5.0 (== research/sync-bisect HEAD, vmlx 44461ffd) — the shipped 0.5.0 baseline the gate binary reports (`mei 0.5.0`)
source_revision: d880b11584ae6ee1e18a1e86f082a8397cf2ce24  # AutomatosX/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP pinned HF commit — the snapshot this config serves
model_bytes: 23120765421   # dereferenced total of the pinned snapshot's 22 entries (4 main shards + mtp + vision + config/tokenizer/manifests), 21.53 GiB; == the carried preflight package size
quant_family: "AXQuant AXQ v1.2.0 (AutomatosX) text-path quantization of Qwen3.6-35B-A3B: config.json quantization default bits 4 / group_size 32 / mode affine with a 1045-entry per-module assignment map (16-bit bf16 574 entries — vision tower + protected norms; 8-bit affine 81 — embeddings/protected; 4-bit affine 390), preferred group 32; effective bpw 5.14 (manifest), nominal 4.66; vision.safetensors preserved BF16 (VLM quality not claimed by the packager); MTP sidecar mtp.safetensors (draft 1, MLX-LM support 'runtime-dependent')."
context_cap: 65536
prefill_step_size: 512
# The OptiQ gate's exact value on the 0.5.0 build (auto profile server line:
# 'requested auto, prefill 512'). Explicit here so the launch is unambiguous;
# the gate server log line is the live confirmation (recorded in the gate
# note, not re-derived here).
tool_call_path: native_mei_requires_live_probe
# BEFORE RUNNING: this config serves the PREBUILT 0.5.0 binary at
# mei-build-qwen36-optiq-050 (verified `mei 0.5.0`, vmlx 44461ffd in its
# checkout). start_mei_server.sh builds from the --mei-repo WORKING TREE only
# when the binary is missing; ~/projects/mei is currently at 950e8c2f (NOT tag
# v0.5.0, with unrelated untracked Casks/ and tap/) — do NOT rebuild from it.
# The prebuilt scratch binary is the only verified 0.5.0 source.
benchmark_launch_command: |
  env VMLX_ENABLE_UNSAFE_COMPILE=0 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 BENCH_NO_FUSED_GATE_UP=1 MLX_SAFETENSORS_MMAP=0 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP \
    --served-model-id AutomatosX/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP --port 8024 --context-cap 65536 \
    --prefill-step-size 512 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-axq4-mtp \
    --memory-limit-bytes 30000000000 \
    --compiled-decode false --load-mmap false \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-qwen36-optiq-050 \
    --mei-repo /Users/tijs/projects/mei
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  raw_port: 8024          # SHARED with other Mei configs — never run concurrently
  needs_proxy: false   # native tool_calls required; probe_mei.py gates this.
  hermes_provider: bench-mei   # bench-profile provider wired to port 8024
                               # (verified present in ~/.hermes/profiles/bench/config.yaml
                               # 2026-09-17); run_fixture_suite passes served_model_id explicitly.
  served_model_id: AutomatosX/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP
  viable: full   # CONTINGENT on the bounded native gate passing; the gate
                 # precedes any coding suite and a failed gate stops the unit.

settings:
  - name: artifact_identity
    value: "AutomatosX/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP @ d880b11584ae6ee1e18a1e86f082a8397cf2ce24 — stage tool verify block: arch Qwen3_5MoeForConditionalGeneration, model_type qwen3_5_moe, 4 index-mapped shards file_bytes/shard_bytes 20,516,858,235 (payload_total 20,516,621,952, header overhead 236,283), PLUS two pinned-revision module files outside the index: mtp.safetensors 1,689,283,776 B and vision.safetensors 893,179,624 B; full 22-entry dereferenced total 23,120,765,421 B; config_sha256 13953be5a055f1aa219fdd7bb9c0125cd4b1fcc66c39b10dbba7cf3cdcc3a830. Staged at ~/.local/share/local-model-bench/mei-models/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP."
    source: "mei-models/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP.provenance.json (tool-generated verify block, preserved verbatim) + independent 22-file byte/size and 6-container safetensors validation (verify_axq4_tree.py, 2026-09-17) + HF API file listing at the pin."
  - name: vmlx_swift_pin
    value: "44461ffdf8dca836b624b2d0d268c800dedea05e (shipping 0.5.0 pin; read directly from the verified 0.5.0 build's vmlx-swift checkout)"
    source: "mei-build-qwen36-optiq-050/checkouts/vmlx-swift git rev-parse HEAD (verified 2026-09-17)."
  - name: mei_source_pin
    value: "1518e7010875ff5fdfca2cfc29bb4a4f3bf31aeb — Mei tag v0.5.0; gate binary reports `mei 0.5.0`. --build-dir mei-build-qwen36-optiq-050 is the verified prebuilt 0.5.0 scratch build (binary + vmlx checkout re-verified 2026-09-17)."
    source: "mei --version on the prebuilt binary (2026-09-17); tag mapping as in configs/Qwen3.6-35B-A3B-OptiQ/mei.yaml."
  - name: quant_family
    value: "AXQuant AXQ v1.2.0 (axquant_manifest.json: axquant_version 1.2.0, effective_bpw 5.139999977009232, calibration null, created 2026-08-05). config.json quantization: bits 4 (default), group_size 32, mode affine, with per-tensor overrides (language_model.model.* entries). axquant_plan.json: 1045 assignments — 574 bf16 (16-bit; vision tower + protected modules), 81 8-bit affine (70 g64 + 11 g32; embed_tokens protected policy), 390 4-bit affine (332 g64 + 58 g32); plan group_size 32, nominal bpw 4.66. axquant_runtime.json: preferred_group_size 32; MTP detected draft 1, sidecar mtp.safetensors, 'mlx-lm' compatibility level B (standard inference; AXQuant MTP metadata may be ignored); optimization_scope text-path; vision BF16 preserved."
    source: "axquant_manifest.json / axquant_plan.json / axquant_runtime.json + config.json quantization block in the staged pin (read 2026-09-17)."
  - name: safe_gate_controls
    value: "EXACT control set mirroring the OptiQ post-mortem: env VMLX_ENABLE_UNSAFE_COMPILE=0 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 BENCH_NO_FUSED_GATE_UP=1 MLX_SAFETENSORS_MMAP=0; flags --compiled-decode false --load-mmap false; NO --model-profile (Mei auto); --prefill-step-size 512; --context-cap 65536; --memory-limit-bytes 30000000000; --kv-cache-dir mei-runtime/kv-axq4-mtp. Do NOT 'helpfully' add a profile or unsafe-compile=1 to this config — the OptiQ first wrapper run did exactly that and died with Metal Insufficient Memory (see configs/Qwen3.6-35B-A3B-OptiQ/mei.yaml known_gaps)."
    source: "configs/Qwen3.6-35B-A3B-OptiQ/mei.yaml (canonical safe set); verified candidate gate / launch-line provenance recorded in the gate note."
  - name: load_path
    value: "mmap=false — weights materialized into RAM at load ([Load] dtype-materialisation bf16=true mmap=false; MLX_SAFETENSORS_MMAP=0 env + explicit --load-mmap false flag, forwarded by the wrapper only when given). This avoids any unaligned-shard realignment copy tax on the default mmap path; memory facts after load are measured by the live gate (post-load active bytes + per-request mei_memory_active_bytes under the 30 GB limit) and recorded in the gate note."
    source: "start_mei_server.sh --load-mmap forwarding (runner); load-time memory lines from the gate server log (recorded in artifacts/gate note)."
  - name: kv_cache
    value: "fp16 KV with EXPLICIT disk-tier dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-axq4-mtp — qwen3_5_moe hybrid (MambaCache + RotatingKVCache) needs the disk tier for cross-turn restore (cached_tokens stays 0 without it). The runner's pre-run clear_kv_cache_dir deletes THIS cold leg's cache before the benchmark; the gate's growing-conversation cached_tokens evidence is recorded in the gate note."
    source: "Mei runtime/cache behavior inherited from the Ornith/Qwen3.6 disk-KV research (configs/Ornith-1.5-35B-A3B/mei.yaml); runner/run_bench.py clear_kv_cache_dir."
  - name: context_and_generation_caps
    value: "context cap 65536 (exact-gate probe set); max-tokens NOT set — the 0.5.0 auto profile applies 4096 (OptiQ gate server line 'listening … max-tokens 4096'), which subsumes the 8192 runaway-bound convention for this build vintage."
    source: "Mei ServerConfig contextCap/maxTokensDefault; probe_mei.py exact-token gate (context boundary as feasible on the live gate)."
  - name: native_tool_call_parser
    value: "native tool_calls required on BOTH non-streaming and streaming probes; no benchmark proxy/parser shim. Gate result recorded in the gate note (probe.json under results-mei)."
    source: "runner/probe_mei.py; gate probe artifacts (results-mei/<served-id>/)."
  - name: benchmark_sampling
    value: "temperature 0.6, top-p 0.95, top-k 20, emit-reasoning true, cache-reuse true — matches the Ornith/stock-Qwen3.6/OptiQ Mei convention. Sanity/hermes_ops suites still run at temperature 0 (run_prompt.py hardcode, see tasks/SCHEMA.md)."
    source: "configs/Ornith-1.5-35B-A3B/mei.yaml + runner/start_mei_server.sh defaults; sampling identical to the launch command above."
  - name: staging_provenance_caveat
    value: "stage tool provenance sidecar records ok=false with reasons 'unexpected weight file mtp.safetensors / vision.safetensors' — the tool's index-only weight-set check predates multi-module AXQ bundles; both files ARE pinned-revision components (HF API listing at the pin, sizes 1,689,283,776 / 893,179,624) and both containers validate independently (verify_axq4_tree.py, all 6 .safetensors PASS). The tool-generated sidecar is preserved VERBATIM (append-only; not rewritten)."
    source: "mei-models/AX-Qwen3.6-35B-A3B-MLX-AXQ-4bit-MTP.provenance.json + independent staged-tree verification (2026-09-17)."

known_gaps:
  - "EXPLORATORY CANDIDATE, NOT RANKED. A bounded native Mei acceptance gate (exact served identity, plain+streaming generation, native streaming + non-streaming tool calls, growing-conversation cache reuse, context boundary as feasible, active-memory evidence) MUST pass before any coding suite; gate evidence lives in results-mei/ (external, disposable) + an artifacts/ note, NOT in results/log.jsonl. This commit changes no results/ row."
  - "PROVENANCE SIDECAR IS ok=FALSE — DO NOT HIDE: the stage tool's verifier flags mtp.safetensors and vision.safetensors as unexpected (its index-only weight-set check predates this bundle layout). Independent verification confirms both are pinned-revision components with valid containers; the tool-generated sidecar stays as-recorded."
  - "Staging used a dedicated venv (mei-stage-venv) with huggingface_hub 0.26.2 because hf 1.24 (the repo uv lock) removed the local_dir_use_symlinks kwarg the Mei stage tool passes; the Mei tool itself is unmodified and the read-only ~/projects/mei checkout was not touched."
  - "0.5.0 BUILD REUSE, VERIFIED 2026-09-17: mei-build-qwen36-optiq-050/release/mei reports `mei 0.5.0` and its checkouts/vmlx-swift is at 44461ffd. ~/projects/mei HEAD is 950e8c2f (NOT tag v0.5.0, with unrelated untracked Casks/ and tap/) — a rebuild from the working tree would NOT reproduce the gated binary; do not rebuild."
  - "Qwen3.6 is a conditional-generation / vision-language checkpoint (qwen3_5_moe, image_token_id/video_token_id present, vision.safetensors BF16 tower). The gate and benchmark exercise the TEXT/TOOL path only; image conditioning and the bundled MTP path (mtp.safetensors, draft 1) are NOT benchmarked — report results with this scope caveat."
  - "AXQuant provenance is development evidence, not certified calibration: axquant_manifest calibration is null and the plan's own notes say 'artifacts are development evidence until certified'; vision quality is not claimed by the packager. Treat card claims as untrusted; only local gate numbers are evidence."
  - "Port 8024 is ALSO assigned to Ornith / stock-Qwen3.6 / OptiQ / Nemotron Mei configs. Never run concurrently; a single local Mei server per run (enforced by unload_all.sh + the exact served_model_id identity gate)."
  - "mmap=false materializes ~21 GiB of weights into RAM plus runtime/KV under a fixed 30 GB allocator limit on a 32 GiB machine; the live gate measures post-load active bytes, peak, and per-request memory — if the gate OOMs, the first failure plus the safe attempt are preserved and the unit stops."
  - "max-tokens is NOT set: the 0.5.0 auto profile applies 4096 (OptiQ gate server line), which already subsumes the 8192 runaway-bound convention for this build vintage."
  - "Config write precedes the gate (task order: config commit, then gate, then benchmark). Gate-measured facts (load memory, alignment warnings, cached_tokens, served /v1/models identity) are recorded in the gate note/artifacts, NOT back-patched into this byte-stable config — the config hash is what the benchmark rows will carry."
