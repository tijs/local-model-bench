model: rapid-mlx/Ling-3.0-tiny-MLX-4bit
# Mei — the native Swift/MLX serving engine (see ~/projects/mei). EXPERIMENTAL
# post-four-model candidate. This row is DURABLE SETUP so inclusionAI/Ling-3.0-tiny
# can be probed/benchmarked AFTER the four established active Mei configs
# (Gemma/Ornith/Qwen3.8/Qwen3.8-Uncensored) — not a completed benchmark row.
# The model is NOT staged and NOT loadability-accepted; running this config will
# fail its identity/load gate until the staging command in known_gaps runs.
#
# PROVENANCE — keep the two repositories DISTINCT (never conflate):
#   * requested SOURCE model: inclusionAI/Ling-3.0-tiny (official full-precision
#     source; architecture BailingMoeV3ForCausalLM, model_type bailing_hybrid,
#     max_position_embeddings 131072; HF revision
#     e3a47d5b986e7141b6efd62597d598ebb392060d). This is a separate provenance
#     reference (recorded as source_model_revision), NOT the artifact loaded.
#   * actual SELECTED MLX artifact for Mei: rapid-mlx/Ling-3.0-tiny-MLX-4bit
#     (THIRD-PARTY repack — NOT Mei-produced, NOT official; base_model tag
#     points to inclusionAI/Ling-3.0-tiny; root-level config/tokenizer/model.safetensors;
#     HF revision 328a497f3eb2cdd3d064f1da2b1084a2791387d5; model.safetensors =
#     4,447,478,988 bytes). This is what the launch command would serve.
#   * CAVEAT on the base_model tag: rapid-mlx's metadata declaring
#     base_model=inclusionAI/Ling-3.0-tiny does NOT prove the repack was
#     converted from the CURRENT official revision (e3a47d5). We do NOT assert
#     that derivation; the tag may point at an earlier/different snapshot.
temperature: 1.0
reasoning_mode: thinking
inference_engine: mei
mei_commit: 91fed8be21319f92ce5220622c6dcde0b851bdae  # vmlx-swift pin (exact, Mei Package.resolved); BailingMoeV3.swift + bailing_hybrid factory registration present at this pin — SOURCE-BACKED, not live-verified
mei_source_commit: 67e897e2160d80be65d2e2c2ff15746d4130ad72  # Mei streaming multi-tool-call SSE-index fix (2026-09-05)
source_revision: 328a497f3eb2cdd3d064f1da2b1084a2791387d5  # rapid-mlx/Ling-3.0-tiny-MLX-4bit (third-party MLX artifact, pinned)
source_model_revision: e3a47d5b986e7141b6efd62597d598ebb392060d  # inclusionAI/Ling-3.0-tiny OFFICIAL repo's current revision — separate provenance reference only; does NOT assert the third-party repack was converted from this revision
model_bytes: 4447478988   # exact model.safetensors byte size (parent-verified metadata-only)
quant_family: MLX 4-bit (rapid-mlx third-party repack; group_size/mode UNVERIFIED — metadata-only, confirm from staged config.json)
context_cap: 65536        # project parity cap (model supports 131072; capped at the four-model parity ceiling, <= 65536)
prefill_step_size: 256    # UNMEASURED INITIAL SETTING — see settings.prefill_chunking
tool_call_path: native_mei_requires_live_probe

benchmark_launch_command: |
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/Ling-3.0-tiny-MLX-4bit \
    --served-model-id rapid-mlx/Ling-3.0-tiny-MLX-4bit --port 8028 --context-cap 65536 \
    --prefill-step-size 256 --max-tokens 32768 \
    --temperature 1.0 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-pinned-91fed8be
benchmark_endpoint: http://127.0.0.1:8028/v1

orchestration:
  raw_port: 8028
  needs_proxy: false   # native tool_calls required; probe_mei.py gates this. NOT yet verified for bailing_hybrid.
  hermes_provider: null   # no coding-suite run yet; a custom_providers entry is created only if/when this experimental leg is actually exercised
  served_model_id: rapid-mlx/Ling-3.0-tiny-MLX-4bit
  viable: full
  # run_order: higher = later in the --all / engine sweep. New field (2026-09-05):
  # lets a late-added model (Ling-3.0-tiny, whose directory would lexically sort
  # before Ornith) run LAST in the four-model Mei sweep without renaming its
  # directory. Every other config has no field -> default 0, so existing order
  # (and historical results) are unchanged. Read by runner/run_bench.py
  # (_discover_ordered_configs); ignored for one-config --config runs.
  run_order: 1

settings:
  - name: artifact_identity
    value: "rapid-mlx/Ling-3.0-tiny-MLX-4bit @ 328a497f3eb2cdd3d064f1da2b1084a2791387d5 (model.safetensors = 4447478988 bytes, root-level config/tokenizer/model.safetensors) → staged-path ~/.local/share/local-model-bench/mei-models/Ling-3.0-tiny-MLX-4bit. NOT STAGED."
    source: "Parent-verified Hugging Face metadata only (model_info + repo tree); third-party rapid-mlx repack, base_model → inclusionAI/Ling-3.0-tiny."
  - name: provenance_separation
    value: "SOURCE model = inclusionAI/Ling-3.0-tiny @ e3a47d5b (OFFICIAL repo's current revision, BailingMoeV3ForCausalLM / bailing_hybrid, max_position_embeddings 131072) — a separate provenance reference, NOT the artifact loaded. ARTIFACT to load = rapid-mlx/Ling-3.0-tiny-MLX-4bit @ 328a497f (THIRD-PARTY repack, NOT Mei-produced, NOT official). rapid-mlx only DECLARES base_model=inclusionAI/Ling-3.0-tiny; that tag does NOT prove the repack was converted from revision e3a47d5b — the actual conversion parent is unverified. Never describe the third-party repack as official or Mei-produced, and do not assert it derives from e3a47d5b unless converted source proves it."
    source: "Hugging Face repo metadata (parent-verified); no local .provenance.json exists (artifact not staged)."
  - name: vmlx_swift_pin
    value: "91fed8be21319f92ce5220622c6dcde0b851bdae (Mei Package.resolved, tijs/vmlx-swift fork) — contains BailingMoeV3.swift + bailing_hybrid factory registration (SOURCE-BACKED); live loadability UNVERIFIED."
    source: "~/projects/mei/Package.resolved + vmlx-swift source inspection at the pin; NOT yet exercised on this model."
  - name: quant_family
    value: "MLX 4-bit (rapid-mlx repack); group_size/mode UNVERIFIED — metadata-only, confirm from the staged config.json at staging time."
    source: "Artifact repo name/bytes only (metadata); no local quant verification done."
  - name: prefill_chunking
    value: "GenerateParameters.prefillStepSize = 256 — UNMEASURED INITIAL SETTING, not claimed optimal. Conservative midpoint between the smallest proven boundary used on this stack (64) and the start_mei_server.sh default (512), taken as a memory-safe starting point for an architecture (bailing_hybrid) with zero measured data. Replace with a measured value from a bounded prefill-step sweep on the clean-GPU gate before trusting benchmark numbers."
    source: "No model-specific guidance yet (bailing_hybrid is new to this stack). Pending a prefill-step sweep analogous to the Ornith/Gemma sweeps."
  - name: context_and_generation_caps
    value: "65536 prompt tokens (project parity cap — model's max_position_embeddings is 131072, but it is capped at the four-model parity ceiling; also satisfies Hermes's >=64K context minimum for the coding suites). Up to 32768 generated tokens."
    source: "Mei ServerConfig contextCap/maxTokensDefault; probe_mei.py exact-token gate; parity with existing Mei configs."
  - name: native_tool_call_parser
    value: "must pass both non-streaming and streaming add_numbers schema probes; NOT yet verified for bailing_hybrid."
    source: "runner/probe_mei.py."
  - name: benchmark_sampling
    value: "temperature 1.0, top-p 0.95, top-k 20, emit-reasoning true (reasoning_mode thinking) — derived from the existing runner/model-card style (matches the active Mei Qwen/Gemma configs); top-k 20 is the Mei launcher default. No bailing_hybrid-specific card guidance was available, so these are the repo's established defaults, applied verbatim."
    source: "Neighboring configs/Qwen3.8-27B/mei.yaml + runner/start_mei_server.sh defaults."

known_gaps:
  - "NOT STAGED, NOT LOADABILITY-ACCEPTED. The artifact is NOT present at the configured model root; this config adds NO automatic download or staging step. Manual CPU-side staging when approved: /Users/tijs/projects/mei/tools/stage_mlx_checkpoint.py --repo rapid-mlx/Ling-3.0-tiny-MLX-4bit --revision 328a497f3eb2cdd3d064f1da2b1084a2791387d5 --target ~/.local/share/local-model-bench/mei-models/Ling-3.0-tiny-MLX-4bit --expect-bytes 4447478988"
  - "vmlx-swift has source-level BailingMoeV3 support (BailingMoeV3.swift + bailing_hybrid factory registration at pin 91fed8be), but live loadability, tool-call format, KV/reuse behavior, and any model-specific launch flags for bailing_hybrid are UNVERIFIED pending a clean-GPU loadability probe. Do not add speculative launcher flags (e.g. VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 or --kv-cache-dir) until a model-specific gate requires them."
  - "Quantization group_size/mode and config.json internals are metadata-only (unverified) until the artifact is staged and inspected."
  - "Bench runtime build provenance applies as recorded in the four active Mei configs (the mei-build scratch dir resolves the local vmlx clone unless the pinned build dir is used; this launch command uses the pinned build dir)."
