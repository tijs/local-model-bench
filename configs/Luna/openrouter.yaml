model: openai/gpt-5.6-luna
backend: api
framework: OpenRouter (plain OpenAI-compatible endpoint, real metered API key)

benchmark_launch_command: |
  # No local server — hosted model via OpenRouter's standard
  # /v1/chat/completions endpoint. Needs OPENROUTER_API_KEY set as an env
  # var (never committed to this repo or logged) — Tijs's own credits,
  # explicitly provided 2026-08-20 for this benchmark run.
  export OPENROUTER_API_KEY="<set locally, not in this file>"

benchmark_endpoint: https://openrouter.ai/api/v1
  # CONFIRMED LIVE 2026-08-20: standard OpenAI-compatible chat-completions
  # surface — native tool_calls array, no proxy/translation needed at all
  # (unlike the openai-codex/OAuth path — see AGENTS.md and this model's
  # sibling configs/Luna/api.yaml for the full story on why THAT path
  # can't reach sanity/hermes_ops). This is the clean alternative: a real,
  # metered API key with no client-impersonation concerns whatsoever,
  # reaching the exact same underlying model (gpt-5.6-luna). Per Tijs's
  # explicit request (2026-08-20) — his own OpenRouter credits, chosen
  # specifically because it also gives real, trackable per-request API
  # cost (see the cost-tracking settings entry below), which the OAuth
  # path has no equivalent for.

orchestration:
  raw_port: null   # remote hosted API, no local server
  needs_proxy: false
  api_base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  hermes_provider: openrouter   # hermes's built-in provider type (see
    # ~/.hermes/config.yaml's commented provider list) — needs
    # OPENROUTER_API_KEY set in the environment hermes chat runs in.
  viable: full   # unlike the OAuth-path sibling config, EVERY suite is
    # reachable here: sanity, hermes_ops, AND the coding spot-check.

settings:
  - name: model identity
    value: "openai/gpt-5.6-luna via OpenRouter — confirmed same underlying
      model as configs/Luna/api.yaml's gpt-5.6-luna via hermes's
      openai-codex OAuth provider (same name, same vendor-reported
      pricing tier description: 'fast, cost-efficient model in OpenAI's
      GPT-5.6 series ... high-volume, latency-sensitive tasks')."
    source: "https://openrouter.ai/openai/gpt-5.6-luna — model card,
      pricing, and routing info (OpenAI, Azure EU, and Amazon Bedrock US
      as of 2026-08-20)."
  - name: pricing (for the cost-tracking columns in results/log.jsonl)
    value: "$0.20 / 1M input tokens, $1.20 / 1M output tokens, $0.02 / 1M
      cached input tokens. Context window 1,050,000 tokens (128,000 max
      completion)."
    source: "https://openrouter.ai/openai/gpt-5.6-luna, checked live
      2026-08-20."
  - name: cost tracking
    value: "run_prompt.py now captures usage.cost directly from
      OpenRouter's own response (real, provider-reported USD per request,
      not something this benchmark computes from the price list above) —
      logged as total_cost_usd on every sanity/hermes_ops log row for
      this config. Local models always log total_cost_usd: null (no
      metered cost exists); this is the only candidate in the benchmark
      where that column is populated."
    source: "OpenRouter API response shape, confirmed live 2026-08-20
      (usage.cost field present on every chat completions response)."
  - name: temperature / sampling
    value: "left at API defaults — no vendor-published recommended
      sampling settings found for this specific hosted checkpoint (unlike
      the local models, which all have researched, cited settings).
      sanity/hermes_ops override to temperature=0 regardless (see
      tasks/SCHEMA.md), same as every other config."
    source: "no model-specific guidance found; framework default."

known_gaps:
  - "Coding-suite (kiem_mini-feature) cost is NOT tracked — hermes chat's
    CLI doesn't expose a simple per-run cost/usage output the way the raw
    run_prompt.py path does. Only sanity/hermes_ops rows get a real
    total_cost_usd value for this config."
  - "API key handling: OPENROUTER_API_KEY must be exported in the shell
    environment before running any suite against this config. Never
    written into this file or any committed config — Tijs provided the
    raw key directly in conversation 2026-08-20 for this one run; it is
    NOT stored anywhere in this repo or in hermes's own .env (which has
    an OPENROUTER_API_KEY line but it's commented out/inactive)."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
