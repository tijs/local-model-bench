model: gpt-5.6-luna
backend: api
framework: hermes (openai-codex provider, OAuth)

benchmark_launch_command: |
  # No local server — hosted model, reached via hermes's built-in
  # openai-codex provider (OAuth against Tijs's ChatGPT/Codex session,
  # https://chatgpt.com/backend-api/codex). Invoked directly:
  hermes chat --profile bench --provider openai-codex -m gpt-5.6-luna

benchmark_endpoint: "https://chatgpt.com/backend-api/codex (via hermes's own
  OAuth client — not a plain OpenAI-compatible endpoint, so run_prompt.py
  cannot hit it directly)"

orchestration:
  raw_port: null   # no local server — hosted model via hermes's own client
  needs_proxy: false
  hermes_provider: openai-codex
  viable: coding_only   # sanity/hermes_ops structurally unreachable (see
    # settings entry below) — only kiem_mini-feature was run

settings:
  - name: scope decision — coding spot-check only, no sanity/hermes_ops
    value: "Only kiem_mini-feature (the same one-task spot-check used for
      every other model per the established scope decision) was run for
      this candidate. sanity/hermes_ops require --base-url pointed at a
      plain OpenAI-compatible chat-completions endpoint (see
      tasks/SCHEMA.md) — Codex's backend isn't one; it's only reachable
      through hermes's own OAuth-authenticated client. Reimplementing that
      auth flow in run_prompt.py to reach parity with the other candidates
      was judged not worth doing for one hosted comparison point, and out
      of scope for a *local*-model benchmark to begin with."
    source: "AGENTS.md / kiem todo (2026-08-19): 'For Luna: just point
      --hermes-provider openai-codex -m gpt-5.6-luna at the existing
      suites, no proxy needed' — the coding suites (driven by hermes chat,
      not run_prompt.py) are the one suite family this actually works for
      without extra plumbing."
  - name: access method — explicit user decision
    value: "Reached via hermes's real openai-codex OAuth provider (Tijs's
      live Codex/ChatGPT session), the same mechanism hermes already uses
      for this model day-to-day. NOT the same situation as the earlier
      Haiku exclusion: that OAuth path deliberately spoofed the Claude
      Code client's own fingerprint to bypass Anthropic's throttling on
      non-Claude-Code clients (a genuine ToS/access-control workaround) —
      openai-codex has no such impersonation involved here, it's just
      hermes's normal, intended way of calling this model. Confirmed with
      Tijs directly (2026-08-20) before running: he opted to test Luna
      via this path rather than exclude it like Haiku."
    source: "kiem note (2026-08-19), f51318dc-...-Haiku decision, and
      direct user confirmation 2026-08-20."
  - name: context_length
    value: "272000 (per ~/.hermes/context_length_cache.yaml,
      gpt-5.6-luna@https://chatgpt.com/backend-api/codex)"
    source: "hermes's own cached model metadata, not independently
      verified against an OpenAI/Codex model card (none published for
      this internal codename at time of writing)."

known_gaps:
  - "No sanity/hermes_ops coverage for this candidate — see the scope-
    decision entry above. This makes Luna's leaderboard row thinner than
    every local candidate's (which get 5-6 rows: sanity + hermes_ops +
    one coding spot-check, sometimes across 2 backends/quants). Treat any
    direct pass-rate comparison against Luna with that caveat in mind."
  - "Real cost/usage note: unlike every other candidate in this benchmark,
    this run consumes Tijs's personal Codex/ChatGPT subscription quota,
    not free local compute. Do not re-run repeatedly without cause."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
