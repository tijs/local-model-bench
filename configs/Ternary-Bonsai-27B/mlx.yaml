model: prism-ml/Ternary-Bonsai-27B-mlx-2bit
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.7
reasoning_mode: unspecified
inference_engine: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) uv run --locked python -m vllm_mlx.server \
    --model prism-ml/Ternary-Bonsai-27B-mlx-2bit --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.7 --default-top-p 0.95 --default-top-k 20 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8018/v1
  # no proxy needed — standard vllm-mlx loads this natively, confirmed
  # live (no custom fork needed for MLX; GGUF would need PrismML's own
  # llama.cpp fork for Q2_0_g128 kernels, not attempted this session).

orchestration:
  raw_port: 8018
  needs_proxy: false
  hermes_provider: bonsai-mlx
  blocked_reason: "Marked non-viable 2026-08-23: hermes_ops averaged 0.538
    tok/s across 13 real trials — well under the 10 tok/s viability
    cutoff, and this model has no GGUF config to fall back to (native
    2-bit ternary training, not a post-hoc quant with a higher-precision
    GGUF sibling available). The omlx leg (configs/Ternary-Bonsai-27B/
    omlx.yaml) is equally slow (0.534 tok/s) — not an MLX-specific issue."
  viable: blocked   # BLOCKED 2026-08-23 — see blocked_reason above.
    # kiem_mini-feature retested 2026-08-20 (see known_gaps below for the
    # genuine, real-cause FAIL) — that was ALREADY a confirmed practical
    # limitation before this; the speed data now closes the question for
    # good.

settings:
  - name: quant / architecture
    value: "2-bit (native to this model's ternary training, NOT a
      post-hoc-quantized-down-from-bf16 quant like every other 2-bit case
      in this project)"
    source: "https://huggingface.co/prism-ml/Ternary-Bonsai-27B-mlx-2bit —
      model card describes 'Custom 2-bit hybrid-attention kernels', derived
      from Qwen3.6-27B. Loaded successfully with STANDARD vllm-mlx (no
      custom fork needed) — confirmed live 2026-08-19, contradicting the
      model card's suggestion that a custom MLX fork might be required
      (that requirement applies to the GGUF variant, which does need
      PrismML's llama.cpp fork — GGUF leg not attempted for this reason)."
  - name: temperature / top_p / top_k
    value: 0.7 / 0.95 / 20
    source: "https://huggingface.co/prism-ml/Ternary-Bonsai-27B-mlx-2bit
      model card's documented generation parameters."
  - name: context_length
    value: 65536 (bumped from a smaller default to satisfy hermes's
      64K-minimum requirement — see AGENTS.md)
    source: "model card claims 262144 native ('full-context capable
      on-device') — 65536 chosen as a practical working ceiling for this
      benchmark, not a hard limit of the model."
  - name: base model lineage
    value: "Derived from Qwen3.6-27B"
    source: "model card — confirms Qwen3.6-27B is a real, distinct model
      from Qwen3.8-27B already tested in this project (see kiem note
      2026-08-19). Not independently tested standalone."

known_gaps:
  - "GGUF leg not attempted — requires a custom PrismML llama.cpp fork
    (Q2_0_g128 hybrid-attention kernels), standard llama.cpp will not run
    it correctly per the model card. Not built from source given the
    session's finite budget and many other candidates still to test — see
    kiem note 2026-08-19 for the tradeoff reasoning. Revisit if there's
    time/interest in building the fork."
  - "Tool-call format not documented on the model card — verify via live
    spot-check before fully trusting tool-use results (standard practice
    for every new model in this project)."
  - "kiem_mini-feature retested 2026-08-20 under the fully-fixed harness:
    genuine FAIL, not a harness artifact. Transcript shows only 'Response
    truncated due to output length limit' — traced to Hermes's own
    conversation_loop.py stream-handling: this message fires when the
    upstream SSE stream closes mid-tool-call-argument generation with no
    exception/finish_reason/[DONE] (documented as a known, sometimes-
    misleading condition in hermes-agent's own test suite,
    test_partial_stream_finish_reason.py — the real underlying event is a
    stalled/dropped stream, not necessarily a token-length cap). Given
    this model's confirmed extreme per-token latency (~0.3-0.4 tok/s,
    ~193s+ TTFT — see hermes_ops's own wall_seconds: 394-1396s for outputs
    of only 105-448 completion tokens), a coding task needing a full-file
    rewrite (several hundred tokens of Rust) would need on the order of
    20-40+ minutes of raw generation for a single turn — long enough that
    some layer's connection gives up before completion. Conclusion: this
    is a genuine practical-usability limitation of this model on this
    hardware (too slow to complete substantive tool-call generations
    within any reasonable timeout), not a bug in this benchmark's harness
    or in Hermes. FAIL result kept as valid, not superseded."

last_updated: 2026-08-20
