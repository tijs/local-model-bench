model: mudler/Ornith-1.5-35B-A3B-APEX-GGUF:APEX-Compact
# Added 2026-08-28 (user request, follow-up to gguf-apex-mtp.yaml): the
# SAME APEX mixed-precision quantization technique as that config, but
# WITHOUT the bundled MTP draft head / speculative decoding -- the model
# card for this repo explicitly states these are "the standard quants"
# without speculative decoding capabilities, and points to the separate
# -MTP- repo for that.
#
# This config exists specifically to isolate the two variables that
# gguf-apex-mtp.yaml conflates: APEX quantization and MTP speculative
# decoding are two independent techniques bundled under one name on HF,
# and this repo's own prior data (gguf-mtp-speed.yaml, Qwen3.8-27B: MTP
# was a NEGATIVE result -- slower, not faster) means it's worth knowing
# whether APEX's quant strategy helps/hurts on its OWN merits, separate
# from whatever MTP does. Three-way comparison now possible on the same
# base model:
#   1. gguf.yaml           -- baseline Q4_K_M, no APEX, no MTP (100%
#                              hermes_ops, 91% coding -- existing result)
#   2. gguf-apex.yaml       -- APEX quant, NO MTP (this file)
#   3. gguf-apex-mtp.yaml   -- APEX quant, WITH MTP
#
# Quant: APEX-Compact (16.54GB) -- matches gguf-apex-mtp.yaml's Compact
# choice (17.44GB there; the ~0.9GB difference is presumably the missing
# MTP draft head weights) for the cleanest possible size-matched
# comparison between configs 2 and 3 above.
temperature: 0.6
reasoning_mode: unspecified
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo mudler/Ornith-1.5-35B-A3B-APEX-GGUF:APEX-Compact \
    --host 127.0.0.1 --port 8017 \
    --temp 0.6 --top-p 0.95 --top-k 20 --ctx-size 65536

benchmark_endpoint: http://127.0.0.1:8017/v1
  # same as gguf.yaml / gguf-apex-mtp.yaml -- native tool_calls, no proxy.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: ornith-apex-gguf   # registered in
    # ~/.hermes/profiles/bench/config.yaml, context_length: 65536.
  viable: full   # same basis as gguf.yaml/gguf-apex-mtp.yaml.

settings:
  - name: architecture
    value: "same as gguf.yaml -- MoE, ~3B active params/token out of 35B
      total (A3B). See that file for full citation."
  - name: quant
    value: "APEX-Compact (16.54GB), mudler/Ornith-1.5-35B-A3B-APEX-GGUF --
      same mixed-precision expert-aware quantization as gguf-apex-mtp.yaml,
      WITHOUT the bundled MTP draft head. Model card explicitly states
      these are 'the standard quants' without speculative decoding."
    source: "https://huggingface.co/mudler/Ornith-1.5-35B-A3B-APEX-GGUF"
  - name: temperature / top_p / top_k / context_length
    value: "identical to gguf.yaml/gguf-apex-mtp.yaml -- 0.6 / 0.95 / 20 /
      65536. Only quant differs -- no --spec-type flag here (no MTP head
      present to speculate from)."

known_gaps:
  - "Never run live as of authoring. Like gguf-apex-mtp.yaml, no
    Apple Silicon/Metal throughput data exists anywhere for this GGUF --
    genuinely new information, not confirming a known result."
  - "mmproj.gguf (vision projector) exists but not used -- text/tool-use
    only, same as every other config in this repo."

last_updated: 2026-08-28
last_verified_against_docs: 2026-08-28
