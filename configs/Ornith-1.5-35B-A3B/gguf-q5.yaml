model: ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q5_K_M
# Added 2026-08-31 (user request): a step up from this family's plain
# Q4_K_M (gguf.yaml), which was one of this benchmark-v4 rerun's stronger
# results (8/8 hermes_ops, 14/15 coding). Tests whether a genuine
# author-published Q5_K_M (not a third-party APEX/MTP quant) buys real
# quality headroom at an acceptable memory cost.
#
# Memory math (base model's own config.json, ornith-ai/Ornith-1.5-35B-A3B,
# architecture Qwen3_5MoeForConditionalGeneration / qwen3_5_moe): 40
# layers total, full_attention_interval=4 -> only 10 layers are real
# full-attention (num_key_value_heads=2, head_dim=256); the other 30 are
# linear_attention (Gated DeltaNet-style) layers whose recurrent state is
# FIXED size, independent of context length -- same hybrid-attention
# family reasoning already applied to Qwen3.8-27B (gguf-unsloth-ud-q5-64k.yaml)
# and Gemma 4 (gguf-apex-i-quality.yaml) in this repo. KV cache at 65536
# tokens (fp16), 10 full-attention layers only: 2 * 2 * 256 * 2 bytes *
# 10 layers * 65536 tokens ~= 1.25GB -- nothing like a conventional
# all-layers-attention model would need at this context length.
# Q5_K_M confirmed 25,347,532,544 bytes (23.6GB) via a live HF resolve
# HEAD request 2026-08-31, vs Q4_K_M's confirmed 21,713,463,040 bytes
# (20.2GB). Budget: ~23.6GB weights + ~1.25GB KV cache + ~2GB runtime/OS
# overhead ~= ~26.9GB, comfortably inside 32GB (Q6_K at 29.21GB would be
# ~32.5GB total -- right at the edge, not attempted here).
temperature: 0.6
reasoning_mode: unspecified
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q5_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 0.6 --top-p 0.95 --top-k 20 --ctx-size 65536

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls expected -- same precedent as gguf.yaml (Q4_K_M),
  # not independently re-verified live for this specific quant file before
  # the first run.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: ornith-gguf-q5   # registered in
    # ~/.hermes/profiles/bench/config.yaml alongside ornith-gguf, with
    # context_length: 65536 matching this config's real --ctx-size.
  blocked_reason: "Excluded from consideration 2026-09-01 -- too large for this hardware, not a fixable bug or transient issue. Server crashed during model warmup (returncode=-6/SIGABRT) on its very first forward pass. Server log: 'ggml_metal_synchronize: error: command buffer 0 failed with status 5' / 'error: Insufficient Memory (00000008:kIOGPUCommandBufferCallbackErrorOutOfMemory)' / 'GGML_ASSERT(i02 >= 0 && i02 < n_as) failed' in src/ggml-cpu/repack.cpp. This header comment's own budget estimate (~26.9GB) was too optimistic in practice -- real llama.cpp runtime compute-buffer overhead (graph allocation, batch scratch space) costs more than simple weights+KV arithmetic accounts for. Confirmed not a transient/leftover-process issue: the very next config run in the same chain (gguf-apex-i-quality.yaml, a SMALLER 21.25GB quant) launched and ran cleanly seconds later on the same machine, same code path, no cleanup steps changed in between -- the only variable was quant size. Never reached sanity; zero real benchmark data produced."
  viable: blocked   # EXCLUDED 2026-09-01: too large for this hardware's
    # usable memory margin, a permanent size constraint, not a bug worth
    # retrying -- see blocked_reason above for the full evidence. Q5_K_M
    # (23.6GB) does not fit on this 32GB Mac in practice, despite this
    # file's own header-comment math estimating ~26.9GB total and
    # comfortably inside budget. The usable margin above Q4_K_M's 21.7GB
    # is smaller than that arithmetic suggested once real compute-buffer
    # overhead is included -- worth remembering for any future "one quant
    # step up" attempt on this model family, but not something to retry
    # on this same hardware.

settings:
  - name: architecture
    value: "MoE, ~3B active params/token out of 35B total (A3B), 40
      layers, hybrid linear/full attention (10 full-attention layers,
      30 fixed-state linear-attention layers) -- same family/reasoning
      as gguf.yaml (Q4_K_M), unchanged here."
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B (config.json)"
  - name: temperature / top_p / top_k
    value: 0.6 / 0.95 / 20
    source: "Same as gguf.yaml -- model card's 'general tasks' preset, not
      the card's separate 'benchmark reproduction' temperature=1.0."
  - name: context_length
    value: 65536 (native 262144, YaRN to ~1M -- capped for hermes's needs)
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B model card"
  - name: tool_call_parser
    value: "native (llama-server), same as gguf.yaml -- not independently
      re-verified live for this specific quant file before the first run."
    source: "confirmed live for the sibling Q4_K_M config via
      runner/run_prompt.py; inherited defensively here."
  - name: quant
    value: "Q5_K_M, 25,347,532,544 bytes (23.6GB) -- confirmed via a live
      HF resolve HEAD request 2026-08-31."
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-GGUF"

known_gaps:
  - "Run live 2026-09-01 and crashed on OOM during model warmup before
    reaching sanity -- see blocked_reason above. This config produced
    ZERO real benchmark data (no sanity, hermes_ops, or coding results),
    not a poor score -- do not confuse this with a viable-but-weak
    result anywhere downstream."
  - "Whether Q5_K_M changes tool-call format or instruction-following
    behavior vs Q4_K_M remains unanswered -- the model never ran long
    enough to test."

last_updated: 2026-09-01
last_verified_against_docs: 2026-09-01
