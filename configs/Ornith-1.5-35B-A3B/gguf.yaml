model: ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.6
  # CRITICAL BUG, found by a third independent adversarial review
  # 2026-08-21 (finding CR3-14): this said 1.0, but the ACTUAL launch
  # command below runs `--temp 0.6` — this config's own settings block
  # (see "temperature / top_p / top_k" further down) explicitly says the
  # model card's 1.0 value is for "benchmark reproduction" specifically
  # and states "not used here". The leaderboard column this field feeds
  # was showing a value that contradicted this config's own launch flags.
reasoning_mode: unspecified
# OPTIONAL request-time generation profiles (2026-09-22, task-specific
# generation contract — per-model POLICY on the configs/README.md
# infrastructure). Every field is vendor-sourced (the card's 'general tasks'
# preset); see settings/generation_profiles_policy. reasoning_effort is
# never invented: Ornith's card documents no effort level, so the plan's
# explicit default for unspecified vendor effort applies ("medium"), never a
# guessed "high".
generation_profiles:
  capability:      # capability lane — the card's 'general tasks' preset.
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    reasoning_effort: medium   # card documents no effort level -> medium per
                               # plan 7f5c67e7, recorded explicitly.
  practical:       # practical/medium comparison lane. The card defines no
    temperature: 0.6           # second operating point and no effort levels,
    top_p: 0.95                # so this lane coincides with capability by
    top_k: 20                  # design; the lanes stay distinct in config +
    reasoning_effort: medium   # per-row metadata.
hermes_ops_generation_profile: capability
  # Explicit general/vendor default for Hermes Ops (plan 7f5c67e7): future
  # hermes_ops rows run at the capability lane instead of the historic
  # temperature=0 wire shape. Historic rows are append-only and untouched.
coding_reasoning_effort: medium
  # Model-specific coding profile: same explicit-effort policy for the
  # hermes-chat coding suites (card documents no effort level -> medium per
  # plan). Historic coding rows ran at the hermes/server default; this key
  # makes the lane explicit going forward.
inference_engine: llama.cpp

# 2026-09-10: --predict 8192 added so BOTH engines are bounded identically.
# See the Mei configs for the measurement. llama.cpp suffers this far less --
# 0.7% of its coding wall against Mei's 14.5% -- but capping only one side
# would advantage that side, and llama-server's default is unbounded up to
# context. Rows recorded before this date ran without the cap; the 0.7% figure
# is how much that could have mattered.
benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 0.6 --top-p 0.95 --top-k 20 --ctx-size 65536 \
    --predict 8192

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls, confirmed live — clean int-typed args, no proxy needed.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: ornith-gguf
  viable: full

settings:
  - name: architecture
    value: "MoE, ~3B active params/token out of 35B total (A3B)"
    source: "https://huggingface.co/collections/ornith-ai/ornith-15 — confirmed
      live: 29.5 tok/s at Q4_K_M despite 35B total params, consistent with
      sparse MoE activation rather than dense 35B compute cost."
  - name: temperature / top_p / top_k
    value: 0.6 / 0.95 / 20
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B model card
      'general tasks' preset. Card also lists temperature=1.0 for
      'benchmark reproduction' specifically — not used here, we want
      realistic-use settings not benchmark-optimized ones."
  - name: generation_profiles_policy (capability / practical lanes, 2026-09-22)
    value: "Identical to the Mei sibling's policy (configs/Ornith-1.5-35B-A3B/mei.yaml settings/generation_profiles_policy) so the cross-engine comparison keeps the generation contract identical: capability = the card's 'general tasks' recommended sampling (temperature 0.6 / top_p 0.95 / top_k 20) + reasoning_effort medium (the card documents NO effort level -> medium per plan 7f5c67e7, recorded explicitly, never a guessed 'high'; supersedes the retired-lane matrix's blanket 'do not force medium' note as documented there). practical = the same card sampling + medium (card defines no second operating point; lanes stay distinct via per-row metadata). hermes_ops_generation_profile: capability = the explicit general/Hermes-Ops default for future rows (historic temperature=0 rows untouched). coding_reasoning_effort: medium = the explicit coding-suite lane."
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B model card (Recommended sampling parameters: 'For general tasks: temperature=0.6, top_p=0.95, top_k=20') + configs/Ornith-1.5-35B-A3B/mei.yaml (inherited policy) + plan 7f5c67e7-b564-4df3-8209-14f7443b56e2 + configs/README.md generation_profiles section."
  - name: context_length
    value: 65536 (native 262144, YaRN to ~1M — capped for hermes's needs)
    source: "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B model card"
  - name: tool_call_parser
    value: "native (llama-server) — model card documents this as
      qwen3_xml-style XML tool-call blocks, auto-parsed by the serving
      runtime into standard tool_calls"
    source: "confirmed live via runner/run_prompt.py — clean tool_calls with
      correct int-typed arguments on first try."
  - name: quant
    value: Q4_K_M (21.7GB per GET /v1/models on the running server)
    source: "standard policy for a model this size on a 32GB Mac."

last_updated: 2026-08-20
