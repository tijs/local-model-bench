  - "The model card's OptiQ capability scores, context and optiq serve KV/tool/cache claims are publisher claims, not Mei measurements. No performance gain over the retired official quant is established; this OptiQ artifact is larger in safetensors file bytes."
  - "The conversion input's immutable base-model revision is not supplied by the inspected OptiQ metadata. Do not reuse the official quant's source or staging manifest as evidence for this different artifact."
  - "This OptiQ config preparation performed no model/server/endpoint use, installed profile changes, cache cleanup, CoCore invocation, results edits, push or public activity. The parent separately staged and integrity-verified the pinned snapshot; live model admission remains pending."

