# Community OptiQ successor — local artifact integrity verified; not live-admitted.
# Separate quant identity of LiquidAI/LFM2.5-24B-A2B; NOT a Liquid-official quant.
# Preserve cache-off candidate e6be308f5709's complete execution contract except
# model directory and served/model IDs. Current Mei/vMLX pins and every other
# source/build/runtime/profile path remain unchanged. No --max-cache-blocks.
# source-provenance.json is remote metadata; local-staging-verification.json
# records the separately staged snapshot's hashes/container checks. Neither proves
# loadability, native tool parsing, resource admission/safety or speed.
# See README.md and both provenance files for gates and verification boundary.

model: mlx-community/LFM2.5-24B-A2B-OptiQ-4bit
temperature: 0.1
reasoning_mode: thinking
inference_engine: mei
mei_commit: 22969e9555b5e86df862e43e3d7356575d3dd053  # effective vMLX, not Mei source
mei_source_commit: faf48a331b6bede352c334e0c6e3d4d4d7e10372
source_revision: b5552f7f7e597e2ca02653f89098dea86b8818af
source_model: LiquidAI/LFM2.5-24B-A2B
source_model_revision: null  # OptiQ's pinned metadata does not identify the conversion input revision
model_bytes: 16672710010  # four safetensors FILES, not index payload or entire repository
staging_status: local-integrity-verified-loadability-unverified
source_provenance: configs/LiquidAI-LFM2.5-24B-A2B-OptiQ-4bit/source-provenance.json
staging_provenance: configs/LiquidAI-LFM2.5-24B-A2B-OptiQ-4bit/local-staging-verification.json
quant_family: OptiQ MLX mixed precision 4/8-bit affine g64 (community quant; default 4-bit, 259 module overrides = 94 at 4-bit and 165 at 8-bit)
context_cap: 65536
runtime_tuning_status: experimental-unmeasured
prefill_step_size: 1024
memory_limit_bytes: 32000000000
fused_gate_up_cache_limit_bytes: 0
tool_call_path: native_mei_requires_live_probe

generation_profiles:
  vendor:
    temperature: 0.1
    top_p: 0.0
    top_k: 50
    min_p: 0
    repetition_penalty: 1.05
hermes_ops_generation_profile: vendor

mei_runtime_base: /Users/tijs/.local/share/local-model-bench/mei-runtime-lfm25
benchmark_launch_command: |
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/LFM2.5-24B-A2B-OptiQ-4bit \
    --served-model-id mlx-community/LFM2.5-24B-A2B-OptiQ-4bit --port 8029 --context-cap 65536 \
    --max-tokens 4096 \
    --temperature 0.1 --top-p 0 --top-k 50 --min-p 0 --repetition-penalty 1.05 \
    --emit-reasoning true --cache-reuse false \
    --model-profile lfm2.5-24b-a2b \
    --prefill-step-size 1024 --memory-limit-bytes 32000000000 \
    --fused-gate-up-cache-limit-bytes 0 \
    --load-mmap false \
    --runtime-base /Users/tijs/.local/share/local-model-bench/mei-runtime-lfm25 \
    --build-dir /Users/tijs/projects/mei-lfm25/.build \
    --mei-repo /Users/tijs/projects/mei-lfm25 \
    --vmlx-repo /Users/tijs/projects/vmlx-swift-lfm25 \
    --vmlx-revision 22969e9555b5e86df862e43e3d7356575d3dd053
benchmark_endpoint: http://127.0.0.1:8029/v1

hermes_ops_max_tokens: 4096
hermes_ops_connect_timeout: 300

orchestration:
  raw_port: 8029
  needs_proxy: false
  hermes_profile: bench-lfm25
  hermes_provider: lfm25-mei
  served_model_id: mlx-community/LFM2.5-24B-A2B-OptiQ-4bit
  viable: full
  run_order: 1

settings:
  - name: optiq_source_and_quantization
    value: >-
      Community OptiQ mixed-precision quant of LiquidAI/LFM2.5-24B-A2B,
      revision b5552f7f7e597e2ca02653f89098dea86b8818af. Remote tree: 16 entries
      (15 files plus optiq directory); four safetensors files totaling
      16672710010 bytes. Lfm2MoeForCausalLM / lfm2_moe. Pinned config.json has
      identical quantization and quantization_config objects: affine/default
      4-bit/group64, 259 per-module entries (94 at 4-bit, 165 at 8-bit, group64).
      OptiQ metadata's 158 high-bit/94 low-bit layer counts have a different
      scope than the config's complete module map; do not conflate them.
      The model-free config-prep phase did not stage files. Parent subsequently
      verified the pinned local snapshot's integrity, not live compatibility.
    source: >-
      source-provenance.json: remote-only pinned Hub revision/tree and metadata;
      local-staging-verification.json: separate parent staging/container checks;
      README.md sources and phase boundaries.
  - name: unchanged_execution_contract
    value: >-
      Exact cache-off candidate e6be308f5709 execution settings except the
      model directory and served/model IDs. Cache reuse false; no block-limit
      flag/metadata; prefill1024, child-only fusion-cache0, memory32000000000,
      mmap false, context65536, output4096, Hermes Ops connect300. All source,
      build/runtime/profile paths, endpoint, task budgets and 4.0 tok/s gate
      remain fixed. Allocator ceiling is not a total-memory/headroom guarantee.
      Current Mei faf48a331b6bede352c334e0c6e3d4d4d7e10372 and effective vMLX
      22969e9555b5e86df862e43e3d7356575d3dd053 are unchanged. No live speed,
      loadability, memory, output parity or native tool parsing is verified.
    source: >-
      Benchmark base 83d06b3978210b850c42e61e09d28c240a86d7e5:
      configs/LiquidAI-LFM2.5-24B-A2B-MLX-4bit/mei-cache-off-revalidation.yaml
      (SHA-256 e6be308f5709d4a0ef3a49cc158b50d44bd9c2047a8a47594873c038c3f1babb);
      runner/start_mei_server.sh; existing CACHE_OFF_REVALIDATION.md.
  - name: generation_sampling
    value: >-
      Retain vendor temperature0.1/top_k50/repetition1.05, also present in the
      pinned OptiQ generation_config.json; top_p0/min_p0 retain predecessor's
      explicit disabled filters, not new OptiQ serving defaults. Sanity keeps
      the deterministic harness policy. No reasoning_effort, seed or thinking
      override is added. Do not import optiq serve's kv_config.json behavior
      into Mei: no KV bits/disk cache/anchor controls are requested here.
    source: >-
      Pinned OptiQ generation_config.json and README.md; predecessor sampler
      provenance (mlx-lm 0.32.0 make_sampler); configs/README.md profiles.
  - name: fresh_live_gates_required
    value: >-
      Config and local artifact integrity verified; no model load/admission yet.
      Before loading, recheck current source/build identity, fresh sustained
      resources, clean owners and port8029, swap trend and the existing 10-GiB
      disk floor.
      Later authorized canonical acceptance uses --skip-cache ONLY, never
      --skip-context; OptiQ loadability and both native tool paths remain
      unverified. Preserve sanity/speed gates and all old evidence. The full
      orchestration eligibility is not a live admission or speed verdict.
    source: >-
      Existing run_mei_acceptance.py/bench_common.py contracts; task-scoped
      parent authorization for an independently gated community OptiQ attempt.

