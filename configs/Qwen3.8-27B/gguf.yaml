model: bartowski/Qwen3.8-27B-GGUF:Q4_K_M
# RETIRED from active rotation 2026-08-25: superseded by this same model's
# Uncensored fine-tune (configs/Qwen3.8-27B-Uncensored/gguf.yaml), which
# beat this base config on both axes under current grading — 11/11 coding
# vs this config's 9/11, and faster (8.0 vs 7.9 tok/s). Not marked
# `viable: blocked` (the config genuinely works, it's just outperformed by
# a sibling) — see results/SUMMARY.md's "Retired near-duplicates" section
# for the full comparison and rationale. Kept for reproducibility; not
# actively retested going forward unless the Uncensored variant's own
# standing changes.
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 1.0
reasoning_mode: thinking
reasoning_effort: medium
  # Added 2026-08-27 (user request: label reasoning effort clearly) --
  # this was NEVER explicitly passed via a --reasoning-effort flag for
  # this config; it's the chat_template.jinja fix's OWN hardcoded
  # default (see that file's _effort_raw line) whenever the flag is
  # absent. Every benchmark result on record for this config was
  # produced at this effort level, silently, until this field made it
  # explicit -- not a claim that medium is optimal, just documenting
  # what actually ran. See the Kiem benchmark-v2 plan note for the
  # follow-up idea of testing other effort levels for this family.
# OPTIONAL request-time generation profiles (2026-09-22, task-specific
# generation contract — per-model POLICY on the configs/README.md
# infrastructure). Every field is vendor-sourced (Qwen3.8 thinking-mode
# preset per docs/OMLX_MODEL_MATRIX.md + the chat template's effort
# vocabulary); see settings/generation_profiles_policy. No field is
# invented: presence/repetition come from the matrix's thinking preset,
# and both effort levels are template-supported.
generation_profiles:
  capability:      # capability/high lane — the thinking preset at the
    temperature: 1.0          # template's max-mapped effort (xhigh: the
    top_p: 0.95               # template maps high/xhigh/max/ultracode ->
    top_k: 20                 # xhigh; sibling gguf-unsloth-ud-q5-64k-xhigh
    min_p: 0                  # tests this exact lane).
    presence_penalty: 0
    repetition_penalty: 1.0
    reasoning_effort: xhigh
  practical:       # practical/medium comparison lane — the thinking preset
    temperature: 1.0          # at the template's own hardcoded default
    top_p: 0.95               # (medium), i.e. exactly what every historical
    top_k: 20                 # row on record for this config ran at.
    min_p: 0
    presence_penalty: 0
    repetition_penalty: 1.0
    reasoning_effort: medium
hermes_ops_generation_profile: capability
  # Explicit general/vendor default for Hermes Ops (plan 7f5c67e7): future
  # hermes_ops rows run at the capability lane (thinking preset + xhigh
  # effort) instead of the historic temperature=0 wire shape. Historic rows
  # are append-only and untouched.
coding_reasoning_effort: medium
  # Model-specific coding profile: the template's own hardcoded default
  # effort — every historical coding row for this config ran at it; making
  # it explicit means future rows record it instead of inheriting it
  # silently.
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo bartowski/Qwen3.8-27B-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 20 \
    --ctx-size 65536 \
    --jinja --chat-template-file configs/Qwen3.8-27B/chat_template.jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # no proxy needed — same as LFM's GGUF leg, llama-server returns tool_calls
  # natively (not independently re-verified for Qwen specifically at time of
  # writing due to the OOM issue below eating the test budget — do that
  # before fully trusting Qwen GGUF tool-call results).

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen-gguf
  viable: full   # UNBLOCKED 2026-08-23, BUMPED TO FULL 2026-08-24: this
    # config was incorrectly marked `blocked` on 2026-08-22 by blanket
    # copy-paste from mlx.yaml's genuinely-confirmed catastrophic slowdown
    # (0.18-0.83 tok/s as prompts grew) — but this GGUF leg was NEVER
    # independently tested (the blocked_reason at the time literally said
    # "Not independently confirmed slow on this specific quant/config").
    # That directly violated this repo's own standing policy: never mark a
    # model non-viable except confirmed non-viable on every engine it has
    # a config for. Caught by the user 2026-08-23, comparing this model's
    # (assumed) numbers against Qwen3.5-9B's and Qwen3.6-35B-A3B's real
    # ones — initially reverted to `sanity_and_hermes_ops_only` (its state
    # before the mistaken block) since --ctx-size was still 32768, below
    # hermes's 64K coding-suite minimum. Bumped to `full` (with --ctx-size
    # raised to 65536 above) 2026-08-24 per explicit user request to get
    # real coding-suite data for the base model, matching the "6 most
    # promising" full-3-suite treatment. The OOM risk noted in the
    # ctx-size settings entry below was from llama-server's AUTO-sizing
    # picking 112128 — 65536 is well under that and matches what
    # Qwen3.8-27B-Ridge and this same directory's gguf-unsloth-ud-q5-64k.yaml
    # sibling already run at successfully, so this is a low-risk bump, not
    # untested territory in the same way the original auto-size crash was.

settings:
  - name: quant
    value: Q4_K_M (bartowski/Qwen3.8-27B-GGUF)
    source: "chosen per 32GB-Mac RAM constraint at this model size, same
      reasoning as the MLX config. File size confirmed 17.76GB via
      GET /v1/models on the running server."
  - name: ctx-size
    value: 65536 (explicit — do NOT rely on llama-server's auto-sizing)
    source: "CRITICAL FIX, discovered live 2026-08-19: llama-server's default
      --ctx-size 0 (\"loaded from model\") auto-selected n_ctx=112128 for
      this model — far more than needed, and the resulting KV cache
      allocation caused a hard Metal OOM crash
      (kIOGPUCommandBufferCallbackErrorOutOfMemory, ggml_metal_synchronize
      command buffer failures) the moment a real ~23K-token hermes_ops
      request arrived, even with NO other model loaded. Explicit
      --ctx-size 32768 fixed it initially; bumped to 65536 on 2026-08-24
      (see the orchestration.viable comment above) to clear hermes's 64K
      coding-suite minimum, matching the sibling gguf-unsloth-ud-q5-64k.yaml
      config already running safely at this size. STALE UNTIL 2026-08-26:
      this entry said 32768 for two days after the launch command itself
      was bumped to 65536 — exactly the doc/reality mismatch flagged by the
      Kiem plan 'Qwen3.8 + llama.cpp speed and agentic-efficiency
      investigation' (P0: reconcile the baseline before new comparisons).
      Keep this value in sync with benchmark_launch_command by hand."
  - name: temperature / top_p / top_k (thinking mode)
    value: 1.0 / 0.95 / 20
    source: "same Qwen/Qwen3.8-27B model card guidance as mlx.yaml — thinking
      mode ON by default, not disabled here."
  - name: generation_profiles_policy (capability / practical lanes, 2026-09-22)
    value: "capability = the Qwen3.8 thinking-mode preset (temperature 1.0 / top_p 0.95 / top_k 20 / min_p 0 / presence_penalty 0 / repetition_penalty 1.0, per docs/OMLX_MODEL_MATRIX.md's source-backed settings row for Qwen3.8-27B) + reasoning_effort xhigh (the chat template maps high/xhigh/max/ultracode -> xhigh; sibling config gguf-unsloth-ud-q5-64k-xhigh.yaml tests the exact same lane and cites Qwen's 'closest thing to Opus' preset). practical = the SAME thinking preset + reasoning_effort medium — exactly the template's own hardcoded fallback and therefore exactly what every historical row on record for this config ran at. hermes_ops_generation_profile: capability = the explicit general/Hermes-Ops default for future rows (historic temperature=0 rows untouched; supersedes the known_gaps bullet below about hardcoded temperature 0). coding_reasoning_effort: medium = the explicit coding-suite lane at the template-default effort every historical coding row used. Top-level reasoning_effort: medium above continues to document the SERVER-side baseline for build_leaderboard; the lanes are the request-time contract."
    source: "docs/OMLX_MODEL_MATRIX.md (Qwen3.8-27B source-backed settings row) + configs/Qwen3.8-27B/chat_template.jinja (_effort_raw mapping) + configs/Qwen3.8-27B/gguf-unsloth-ud-q5-64k-xhigh.yaml (lambda lane precedent) + plan 7f5c67e7-b564-4df3-8209-14f7443b56e2 + configs/README.md generation_profiles section."
  - name: chat_template (community fix)
    value: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates
      applied 2026-08-19 via --jinja --chat-template-file, same file as
      mlx.yaml uses (configs/Qwen3.8-27B/chat_template.jinja)"
    source: "Same fix as the MLX config — see mlx.yaml's entry for the full
      writeup and MLX-side confirmation (hermes_ops 1/3 -> 2/3). Loaded
      cleanly on llama-server with no template errors (confirmed via
      startup log)."
  - name: prefill time (measured, not a setting, but critical to know)
    value: "~200s+ for hermes_ops's ~23K-token system prompt at Q4_K_M
      (measured: 100-134 tok/s prefill rate)"
    note: "task timeout_seconds must account for this — tasks/hermes_ops.yaml
      was bumped from 120s to 600s to accommodate large models like this
      one; a small model finishing early just doesn't use the full budget,
      so this is a safe change for all models, not Qwen-specific."

known_gaps:
  - "Generation lanes (2026-09-22): the one-shot hermes_ops path NO LONGER runs at hardcoded temperature 0 for this config — generation_profiles + hermes_ops_generation_profile: capability make the Qwen3.8 thinking preset + xhigh effort the general/Hermes-Ops operating point for future rows (see settings/generation_profiles_policy). Sanity (the determinism gate) and the no-profile lane keep the historic temperature=0 shape; coding suites inherit the launch flags plus coding_reasoning_effort: medium. Historic rows are untouched; the lane is recorded per row (generation_profile / generation_overrides / generation)."
  - "Native tool_calls not independently re-verified for this specific
    model+backend (assumed from the LFM GGUF precedent) — confirm before
    fully trusting a hermes_ops/coding-suite pass on this config."
  - "--ctx-size 65536 (bumped from 32768 on 2026-08-24) has not itself been
    load-tested against this exact quant before this run — the OOM history
    above is real, even though the risk looks low given sibling configs
    at the same size work fine. If this run crashes rather than fails
    gracefully, that is the first thing to suspect."

process_discipline_note: |
  Learned live 2026-08-19: never run more than one model server at a time
  during ad-hoc testing, even when the automated orchestrator
  (runner/run_bench.py) would enforce this via unload_all.sh. Running LFM
  MLX + LFM GGUF + Qwen MLX + Qwen GGUF simultaneously (4 servers, ~4GB free
  RAM remaining) caused silent-looking failures (empty responses, 1-token
  completions) that were actually resource exhaustion, not model or harness
  bugs — wasted significant debugging time before the real cause was found.

last_updated: 2026-08-26
last_verified_against_docs: 2026-08-19
