model: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
# RETIRED from active rotation 2026-08-25: viable is
# sanity_and_hermes_ops_only (ctx-size structurally below hermes's 64K
# coding minimum), so this leg has never been and can never be a real
# coding-suite candidate — not worth further testing when
# configs/Qwen3.8-27B-Uncensored/gguf.yaml already gives real, current
# coding-suite data for this model family. See results/SUMMARY.md's
# "Retired near-duplicates" section. Kept for reproducibility.
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 1.0
reasoning_mode: thinking
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 20 --ctx-size 32768 \
    --jinja --chat-template-file configs/Qwen3.8-27B/chat_template.jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # no proxy needed — native tool_calls, same Qwen family as gguf.yaml.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: null   # never registered in ~/.hermes/profiles/bench —
    # only sanity/hermes_ops were run for this quant variant, no coding
    # spot-check attempted (and --ctx-size 32768 would block it anyway,
    # same as the plain gguf.yaml config).
  viable: sanity_and_hermes_ops_only   # UNBLOCKED 2026-08-23: this config was
    # incorrectly marked `blocked` on 2026-08-22 by blanket copy-paste from
    # mlx.yaml's genuinely-confirmed catastrophic slowdown (0.18-0.83 tok/s
    # as prompts grew) — but this leg was NEVER independently tested (the
    # blocked_reason at the time admitted as much). That directly violated
    # this repo's own standing policy: never mark a model non-viable
    # except confirmed non-viable on every engine it has a config for.
    # Caught by the user 2026-08-23, comparing this model's (assumed)
    # numbers against Qwen3.5-9B's and Qwen3.6-35B-A3B's real ones. Reverted to
    # `sanity_and_hermes_ops_only` since --ctx-size 32768 is still under
    # hermes's 64K coding-suite minimum for this config.

settings:
  - name: quant
    value: UD-Q4_K_M (Unsloth Dynamic, https://huggingface.co/unsloth/Qwen3.8-27B-GGUF)
    source: "Same nominal bit-width as bartowski/Qwen3.8-27B-GGUF:Q4_K_M
      already tested, but with Unsloth's per-layer-sensitivity-aware
      allocation. Unsloth's own docs
      (https://unsloth.ai/docs/basics/dynamic-3.0-ggufs) claim >10% better
      top-1% accuracy at the same size via KL-divergence-guided layer
      selection. Direct comparison point against the bartowski quant at the
      same nominal size."
  - name: chat_template / ctx-size / temp / top_p / top_k
    value: "same as configs/Qwen3.8-27B/gguf.yaml — see that file for full
      citations, unchanged for this quant variant."

last_updated: 2026-08-19
