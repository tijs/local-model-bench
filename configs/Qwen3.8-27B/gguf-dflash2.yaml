model: bartowski/Qwen3.8-27B-GGUF:Q4_K_M (+ incoai/Qwen3.8-27B-DFlash2-GGUF:Q4_K_M drafter)
backend: gguf
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 1.0
reasoning_mode: thinking
framework: "llama.cpp, built from z-lab/llama.cpp-fork branch dflash2 (NOT
  the Homebrew build used for every other GGUF config in this repo — see
  AGENTS.md's DFlash2 section for why)"

benchmark_launch_command: |
  # One-time setup (builds into runner/.dflash2-fork/, gitignored — kept
  # separate from the Homebrew install so it never affects any other
  # model's config):
  #   runner/setup_dflash2_fork.sh
  HF_TOKEN=$(cat ~/.cache/huggingface/token) runner/.dflash2-fork/build/bin/llama-server \
    --hf-repo bartowski/Qwen3.8-27B-GGUF:Q4_K_M \
    --spec-type draft-dflash \
    --spec-draft-hf incoai/Qwen3.8-27B-DFlash2-GGUF \
    --spec-draft-n-max 7 \
    --parallel 1 \
    --host 127.0.0.1 --port 8017 \
    --temp 1.0 --top-p 0.95 --top-k 20 \
    --ctx-size 32768 --timeout 1800 \
    --jinja --chat-template-file configs/Qwen3.8-27B/chat_template.jinja

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Same froggeric chat-template fix and sampling settings as the plain
  # bartowski GGUF config (configs/Qwen3.8-27B/gguf.yaml) — this config
  # ONLY differs by adding DFlash2 speculative decoding on top. Native
  # tool_calls expected (same base model/backend as the working plain
  # config), re-verify live since the fork is a different binary.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen-gguf   # only usable for coding IF ctx-size is
    # raised to 65536 first — at 32768 (the value that actually works,
    # see the --ctx-size settings entry below) hermes's coding suites are
    # unreachable, same as the plain gguf.yaml config.
  server_binary: runner/.dflash2-fork/build/bin/llama-server   # NOT
    # Homebrew's llama-server — see runner/setup_dflash2_fork.sh
  viable: sanity_and_hermes_ops_only

settings:
  - name: "why this needs its own config/binary (not just a flag on the
      existing Qwen3.8-27B gguf.yaml)"
    value: "The Homebrew-installed llama.cpp (build 10470, used for every
      other GGUF config in this repo) has the --spec-type draft-dflash CLI
      flag but NOT PR #27342's actual DFlash2 tensor-loading/decode
      implementation — that PR is still open/unmerged upstream. Its real
      code lives only in the author's own fork, z-lab/llama.cpp-fork branch
      dflash2. Confirmed via https://inco.ai/blog/dflash2/, which
      explicitly documents 'build from PR #27342' as the llama.cpp setup
      step."
    source: "https://inco.ai/blog/dflash2/ +
      https://github.com/ggml-org/llama.cpp/pull/27342 (state: open,
      merged: false, as of 2026-08-20)."
  - name: --spec-draft-n-max
    value: 7
    source: "https://github.com/ggml-org/llama.cpp/pull/27342's own PR
      description benchmark command uses this value (block_size=8 per the
      server startup log's speculative-implementation summary)."
  - name: --parallel 1
    value: 1 (framework default is 4)
    source: "CRITICAL FIX, discovered live 2026-08-20: the default 4
      parallel slots allocate 4x the KV cache for BOTH the target and
      draft models simultaneously, causing a hard Metal OOM
      (kIOGPUCommandBufferCallbackErrorOutOfMemory) on the very first real
      request even though the model 'loaded' successfully and reported no
      error at load time. --parallel 1 fixed it immediately. This
      benchmark doesn't need concurrent slots anyway (one request at a
      time, per the established process-discipline note), so no
      functional loss from setting this."
  - name: measured result (2026-08-20, one real completion, not yet a
      full suite run at time of writing this settings block)
    value: "draft_n=791, draft_n_accepted=389 (~49% acceptance), 9.32 tok/s
      predicted_per_second vs. this benchmark's own baseline non-spec
      Qwen3.8-27B GGUF result (~6.5 tok/s, see configs/Qwen3.8-27B/gguf.yaml's
      leaderboard row) — roughly 1.4x speedup. Lower than the PR's own
      cited 1.85x (measured on an Apple M5 Pro with 64GB, vs. this
      benchmark's 32GB machine) — plausibly memory-bandwidth-bound
      differently on this hardware, or affected by <think> reasoning
      tokens being included in the completion count here. Not
      independently isolated/confirmed as the sole cause — noting as a
      plausible explanation, not a verified one."
    source: "Direct curl request against the running server, 2026-08-20."

  - name: "--ctx-size 32768 — a real, load-bearing hardware ceiling for
      this exact combination, not an arbitrary choice"
    value: 32768 (tried 65536 and reverted — see below)
    source: "Discovered live 2026-08-20, in two stages:
      (1) 32768 makes hermes chat's coding suite refuse to start at all
      ('Model ... has a context window of 32,768 tokens, which is below
      the minimum 64,000 required by Hermes Agent' — AGENTS.md's hermes
      hard-minimum note). sanity/hermes_ops (run_prompt.py, raw HTTP) are
      UNAFFECTED by this hermes-side check and passed cleanly (2/2, 2/3)
      at 32768 with real 9.32 tok/s throughput.
      (2) Raising ctx-size to 65536 to satisfy that hermes minimum instead
      caused genuine Metal OOM
      (kIOGPUCommandBufferCallbackErrorOutOfMemory) partway through
      hermes_ops's larger prompts — confirmed via server log
      ('llama_decode(ctx_dft) failed', 'failed to process speculative
      batch') — because the target model + draft model + a 65536-token KV
      cache together exceed this 32GB machine's available Metal memory,
      even though 32768 alone fits comfortably. This produced a
      misleading 0/3 hermes_ops result (empty tool_calls, not a real
      model behavior) that was caught and discarded before being
      committed, per this benchmark's standing verify-before-trusting
      discipline.
      NET RESULT: kept ctx-size at 32768 (the genuinely working value) and
      accepted that this specific DFlash2 variant cannot run the
      hermes-chat-driven coding suite on this hardware — see known_gaps."

known_gaps:
  - "No kiem_mini-feature coding-suite spot-check for this variant — it
    needs hermes chat, which hard-requires context_length >= 64000 to
    start, but this exact target+draft+ctx-size combination hits a real
    Metal OOM on this 32GB machine at ctx-size 65536 (see the --ctx-size
    settings entry above). sanity/hermes_ops results (which don't have
    this hermes-side minimum) are valid and representative of DFlash2's
    real behavior; only the coding-suite comparison point is missing,
    same structural gap as the Luna candidate's config, for an unrelated
    reason (memory ceiling here, OAuth-only backend there)."
  - "This fork binary is NOT installed system-wide like the Homebrew build
    every other config uses — run runner/setup_dflash2_fork.sh once to
    build it into runner/.dflash2-fork/ (gitignored, not committed; only
    ~2 min to build). Originally built directly into a session scratchpad
    with no durable setup script, 2026-08-20 — fixed same day so this
    config is reproducible from a fresh clone without re-deriving the
    exact clone/cmake steps from prose."
  - "Only tested with Qwen3.8-27B's own drafter so far — Muse-Glimmer-30B's
    DFlash2 drafter was never retried with this working fork build (the
    'abandoned' conclusion was reversed on Qwen3.8-27B alone). Worth trying
    if there's time, now that the real fix (fork build + --parallel 1) is
    known — should very likely work there too since the root cause was
    binary-wide, not checkpoint-specific."
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — same
    caveat as every other config, these settings only fully apply to the
    coding suites."

