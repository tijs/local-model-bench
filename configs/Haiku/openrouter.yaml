model: anthropic/claude-haiku-4.5
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: null  # no local sampling control (hosted API)
reasoning_mode: unspecified
inference_engine: openrouter   # plain OpenAI-compatible endpoint, real metered API key

benchmark_launch_command: |
  # No local server — hosted model via OpenRouter's standard
  # /v1/chat/completions endpoint. Needs OPENROUTER_API_KEY set as an env
  # var (never committed to this repo or logged) — Tijs's own credits,
  # explicitly provided 2026-08-26 for this benchmark run, same handling
  # precedent as configs/Luna/openrouter.yaml's known_gaps entry.
  export OPENROUTER_API_KEY="<set locally, not in this file>"

benchmark_endpoint: https://openrouter.ai/api/v1
  # Same clean, ToS-fine path already established for Luna (see AGENTS.md
  # / project memory on excluded candidates): a real, metered API key,
  # zero client-impersonation concerns — Anthropic's own Claude Haiku,
  # reached the same way any other hosted model on this benchmark is,
  # not via hermes's OAuth-based subscription providers.

orchestration:
  raw_port: null   # remote hosted API, no local server
  needs_proxy: false
  api_base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  hermes_provider: openrouter   # hermes's built-in provider type — same
    # as configs/Luna/openrouter.yaml. Confirmed via
    # ~/.hermes/hermes-agent/plugins/model-providers/openrouter/__init__.py:
    # this is a generic aggregator profile that resolves the actual model
    # dynamically from whatever `model:` string hermes is invoked with —
    # no per-model provider entry needed in ~/.hermes/profiles/bench/config.yaml.
  viable: full   # every suite reachable: sanity, hermes_ops, and the full
    # coding-suite battery (kiem_mini/hearth_mini/kipclip_mini).

settings:
  - name: model identity
    value: "anthropic/claude-haiku-4.5 via OpenRouter — the current
      real-time (non-batch) Haiku 4.5 tier. OpenRouter's catalog also
      lists `anthropic/claude-haiku-4.5:batch` (same model, ~50% cheaper,
      async/delayed) and `anthropic/claude-3-haiku` (older generation,
      cheaper still) — neither used here since this benchmark measures
      real-time interactive agentic use, which the batch tier doesn't
      support, and 3-Haiku is a materially older/weaker model than what
      'Haiku' means going forward."
    source: "https://openrouter.ai/api/v1/models, queried live 2026-08-26
      — filtered for 'haiku' entries and their pricing/context_length."
  - name: pricing (for the cost-tracking columns in results/log.jsonl)
    value: "$1.00 / 1M input tokens, $5.00 / 1M output tokens (real-time
      tier), $0.10 / 1M cached input tokens (input_cache_read). Context
      window 200,000 tokens."
    source: "https://openrouter.ai/api/v1/models, queried live 2026-08-26
      (pricing.prompt=0.000001, pricing.completion=0.000005 per token)."
  - name: cost tracking
    value: "run_prompt.py captures usage.cost directly from OpenRouter's
      own response (real, provider-reported USD per request) — logged as
      total_cost_usd on every sanity/hermes_ops log row for this config,
      same mechanism as configs/Luna/openrouter.yaml."
    source: "OpenRouter API response shape, same precedent as Luna's
      config (confirmed live 2026-08-20)."
  - name: reasoning / thinking mode
    value: "Left at provider default (not explicitly disabled). Per
      ~/.hermes/hermes-agent/plugins/model-providers/openrouter/__init__.py's
      _ANTHROPIC_REASONING_OPTIONAL_SUBSTRINGS allowlist, claude-haiku-4-5
      IS in the legacy allowlist that still accepts an explicit
      'disable thinking' request — so this model's reasoning is optional,
      not mandatory, unlike Claude 4.6+/unnamed-newer models. Not disabled
      here since no model-specific benchmark guidance suggested it should
      be; sanity/hermes_ops override to temperature=0 regardless (see
      tasks/SCHEMA.md), same as every other config."
    source: "~/.hermes/hermes-agent/plugins/model-providers/openrouter/__init__.py,
      read live 2026-08-26."
  - name: temperature / sampling
    value: "left at API defaults — no vendor-published recommended
      sampling settings found specific to this benchmark's use case
      (agentic coding via Hermes), same reasoning as Luna's config."
    source: "no model-specific guidance found; framework default."

known_gaps:
  - "Coding-suite cost is NOT tracked — hermes chat's CLI doesn't expose a
    simple per-run cost/usage output the way the raw run_prompt.py path
    does. Only sanity/hermes_ops rows get a real total_cost_usd value for
    this config (same known gap as configs/Luna/openrouter.yaml)."
  - "API key handling: OPENROUTER_API_KEY must be exported in the shell
    environment before running any suite against this config. Never
    written into this file, any other repo file, a commit message, or any
    doc/note — Tijs provided the raw key directly in conversation
    2026-08-26 for this benchmark run only; it is not stored anywhere in
    this repo."

last_updated: 2026-08-26
last_verified_against_docs: 2026-08-26
