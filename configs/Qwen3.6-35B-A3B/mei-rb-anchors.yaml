    source: "mei-models/Qwen3.6-35B-A3B-4bit.provenance.json (post-heal verify.block: shard_bytes/file_bytes 20402204728, payload_total 20401929952, config_sha256 a822a9e8…) + resolved HF commit 38740b84… independently verified."
