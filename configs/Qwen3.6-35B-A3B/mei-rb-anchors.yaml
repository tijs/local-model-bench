# COLD RE-RUN of the anchors A/B on the SHIPPING engine (vmlx 44461ffd).
#
# The original A/B is void. Both its arms passed --kv-cache-dir twice; the
# server takes the last value and run_bench.py's cleaner took the first, so the
# runner deleted a directory the server never opened and each arm ran against a
# shared, never-cleared cache. The per-arm dirs it claimed to clear did not
# exist on disk; the shared one held 9.9 GB across 40+ entries. Neither arm was
# cold and the arms were not independent of each other — and contamination
# toward a common behaviour is exactly what produces the "zero task cost"
# result that was reported. Fixed in ab2c5d2 plus a guard over all 30 configs.
#
# This arm therefore differs from its sibling in exactly one way: the anchor
# count. Both name the model and take everything else from the profile, so
# prefill step, generation cap and architecture handling cannot drift apart.
# The noanchors arm overrides --ssm-anchor-boundaries 0 explicitly; the anchors
# arm takes the profile's shipping value.
#
# Also on the rolled-back pin, because the sync (23551729) changes generation
# on 8 of 10 token-recorded tasks and costs a stable task. Measuring a default
# on an engine the release will not ship is how the vision default ended up
# needing this re-run in the first place.
#
# ANCHORS A/B on the THIRD target model — the vision variant.
#
# Why measure rather than assume: Ornith and Qwen3.6 text-only share this exact
# architecture (qwen3_5_moe) and DISAGREE on the cost of anchors. Ornith loses
# hermes_ops-multi-step-chain reproducibly (0/3 pairs); text-only loses nothing
# across four comparisons and gains more prefill (-52% vs -39%). So the cost is
# trajectory-specific, not architectural, and this model's answer cannot be
# inferred from either sibling. Its profile currently ships anchors 0 marked
# "not yet A/B'd" — a placeholder, and this run replaces it with a measurement.
#
# This variant additionally carries a vision tower, which neither sibling has.
#
# Same protocol the text-only model got: three prompt-suite pairs then one
# coding pair. Served from the 0.5.0 candidate build so the result applies to
# what ships.
# THIS ARM: anchors ON.

model: mlx-community/Qwen3.6-35B-A3B-4bit
# Mei — the native Swift/MLX serving engine (see ~/projects/mei). This is a
# new EXPLORATORY Mei candidate (Qwen3.6, a conditional-generation/VLM
# checkpoint on the Qwen3.5 hybrid-MoE architecture) staged under the SAME
# served model ID as its source repo so /v1/models identity checks are exact.
#
# The candidate passed its bounded Mei gate separately (12/12 acceptance
# probes, native streaming + non-streaming tool calls, in-process KV/prefix
# cache-reuse, exact 65536 context boundary) — those probe results live under
# ~/.local/share/local-model-bench/results-mei/ and are NOT copied here.
# This config is durable/setup for a subsequent full benchmark run; it does
# NOT record any quality or benchmark-pass numbers of its own.
#
# CAVEAT — Qwen3.6 is a conditional-generation (vision-language) checkpoint
# (model_type qwen3_5_moe, Qwen3_5MoeForConditionalGeneration). Its Mei gate
# exercised the TEXT/TOOL path ONLY (no image conditioning); full benchmark
# admission remains contingent on a clean run of this config.
#
# PORT NOTE: this config uses port 8024, which is also assigned to the Ornith
# Mei config (configs/Ornith-1.5-35B-A3B/mei.yaml). These two configs must
# NEVER be run concurrently — the runner's assert_serving_expected_model gate
# (exact served_model_id) protects against a stale cross-model bind on the
# shared port, but only one local Mei server may be live at a time.
temperature: 0.6
reasoning_mode: thinking   # emit-reasoning true (native reasoning_content); Qwen3.8 sibling convention
inference_engine: mei
mei_commit: 44461ffdf8dca836b624b2d0d268c800dedea05e  # shipping pin (0.4.2's engine)
mei_source_commit: bd0a06dac978c6b375aec544b56c79c045ccc942  # mei-050 feat/0.5.0-dev after the pin rollback
source_revision: 38740b847e4cb78f352aba30aa41c76e08e6eb46  # mlx-community/Qwen3.6-35B-A3B-4bit resolved HF commit; corrected provenance.json now records the same pinned revision + config_sha256 a822a9e8…
model_bytes: 20402204728
quant_family: MLX 4-bit affine g64 (mlx-community; qwen3_5_moe conditional-generation arch), 8-bit router gates
context_cap: 65536
prefill_step_size: 1024
# 2026-09-09: raised 512 -> 1024 after a measured sweep + a 65k survival gate.
# 512 was the long-context safeguard for hybrid GatedDelta models, not a speed
# choice. On the real 20k Hermes prompt (measured on Ornith, same family):
#   512 -> 340 tok/s prefill (TTFT 59.9 s); 1024 -> 389 (52.4 s); 2048 -> 419 (48.7 s)
# 2048 REJECTED: 27.41 GB MLX peak at 65k vs a 26.8 GB recommended working set.
# This model gated separately at 1024 (results-mei/prefill-65k-gate-qwen-*):
# 65k fresh prefill and the cache-reuse extension both pass.
tool_call_path: native_mei_requires_live_probe

  # C1 (2026-09-07): VMLX_ENABLE_UNSAFE_COMPILE=1 enables vmlx's shapeless
  # micro-fusions (compiledSwiGLU/GeGLU/SigmoidGate + the Qwen35 helpers), which
  # HardwareInfo.isCompiledDecodeSupported otherwise gates off.
  # MEASURED, same binary both legs, round-robin ordering, warm-up, n=10, quiet
  # machine: Ornith short decode 66.36 -> 72.32 tok/s (+9.0%, sd 0.55/0.53,
  # non-overlapping), 30k 40.36 -> 41.45 (+2.7%); Qwen3.6 text-only 66.65 ->
  # 73.21 (+9.8%), 30k 41.93 -> 43.38 (+3.5%).
  # CORRECTNESS GATE PASSED: four 700-token greedy temp-0 generations
  # token-for-token identical to control on both models, plus an identical
  # native tool call. This is the gate that matters -- the flag's documented
  # failure mode is SILENT numerical corruption, not a crash.
  # Its default-off reason is Osaurus #1173 (decode corruption after switching
  # models inside one process); Mei is one-model-per-server-process, so that is
  # structurally unreachable here. Residual risk is the macOS Tahoe Metal JIT
  # bug (MLX #3329/#3201/#3256). RE-VERIFY TOKEN EQUALITY AFTER ANY VMLX RE-PIN.
  # 2026-09-09: MOVED TO THE RELEASED 0.4.0 BUILD — --build-dir mei-build-040,
  # --mei-repo ~/projects/mei-040 (Mei 0.4.0, vmlx 654eb455 = mei/0.4.0). This
  # is what `brew install tijs/tap/mei` now ships, so the benchmark measures the
  # released artifact instead of a local main-branch tree. Prefix reuse is
  # present in this build but DEFAULT OFF and not enabled here.
  # Superseded note, kept for the record:
  # 2026-09-07: build-dir moved to mei-build-030. PROVENANCE CORRECTION
  # (2026-09-08): this build dir is NOT the 0.3.0 release pin. start_mei_server.sh
  # builds from --mei-repo, default ~/projects/mei, whose Package.swift pins vmlx
  # 91fed8be; mei-build-030/checkouts/vmlx-swift is at 91fed8be. The 2026-09-07
  # benchmark rows were therefore served by Mei main + vmlx 91fed8be, not by
  # release/0.3.0 (vmlx e37d1d59 = fork main + 37 upstream commits). Those rows
  # are internally consistent and remain the valid baseline for THIS
  # configuration; only the earlier comment was wrong. To run the 0.3.0 pin
  # instead, pass --mei-repo /Users/tijs/projects/mei-release, and re-verify C1
  # token equality on that pin first. Release gate:
  # probe_mei 12/12 on Ornith; C1 token-equality re-verified on this pin.
# 2026-09-10 RUNAWAY BOUND: --max-tokens 32768 -> 8192.
# One request in the 2026-09-09 23:40 run generated 32,768 tokens and hit the
# cap after 1,156 s. That single request burned 19.3 of the 40.1 minutes of
# generation in the WHOLE run, and the coding suite came in at 54.6 min against
# 25.7 min for the run before it on the same build. It is the explanation for
# the 2.8x run-to-run swing recorded in Kiem note 0071538b -- not thermals, not
# page-cache eviction, not a systematic overhead.
# Across all coding rows this costs Mei 14.5% of total wall (268 of 1856 min,
# 26 outlier tasks) against llama.cpp's 0.7% (35 of 4925 min, 9 tasks).
# 8192 cannot truncate legitimate work here: per request, p99 is 2,933 tokens
# and the largest non-degenerate completion in that run was 4,674. Hermes's own
# bench profile caps its turns at 4,096; this only bounds callers that send no
# max_tokens at all. A degenerate turn still fails its task, so quality
# measurement is unaffected -- only the wall-clock damage is bounded.
benchmark_launch_command: |
  env VMLX_ENABLE_UNSAFE_COMPILE=1 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.local/share/local-model-bench/mei-models/Qwen3.6-35B-A3B-4bit \
    --served-model-id mlx-community/Qwen3.6-35B-A3B-4bit --port 8024 --context-cap 65536 \
    --model-profile qwen3.6-35b-a3b \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-q36v-rb-anchors \
    --cache-reuse true \
    --request-log /Users/tijs/.local/share/local-model-bench/mei-runtime/logs/requests-q36v-rb-anchors.jsonl \
    --log-requests true \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-050rb \
    --mei-repo /Users/tijs/projects/mei-050
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  raw_port: 8024          # SHARED with Ornith mei.yaml — never run concurrently
  needs_proxy: false   # native tool_calls required; probe_mei.py gates this.
  hermes_provider: bench-mei   # existing bench-profile provider wired to port 8024;
                               # run_fixture_suite passes served_model_id explicitly
                               # so it can drive this exploratory candidate without
                               # modifying the provider's default model.
  served_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
  viable: full

