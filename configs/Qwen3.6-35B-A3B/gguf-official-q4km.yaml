model: ggml-org/Qwen3.6-35B-A3B-GGUF:Q4_K_M
# CANONICAL (reconciled 2026-09-14 from two interrupted worker drafts,
# configs/Qwen3.6-35B-A3B/gguf-q4k-m-official-control.yaml and
# configs/Qwen3.6-35B-A3B/gguf-official-q4-k-m.yaml, both deleted).
# EXPLORATORY / UNRANKED — official pinned Q4_K_M llama.cpp CONTROL arm of the
# post-Mei-0.5.0 research track. No results/log.jsonl rows exist under this
# config's hash yet, so it is ranked nowhere until a full current-suite
# benchmark run lands (sanity + hermes_ops + all four coding suites —
# kiem_mini/hearth_mini/kipclip_mini/hearth_full; the runner's default battery
# since 2026-08-25, run_bench.py --coding-suites). Do not treat any claim in
# this file as a quality or benchmark result — only as artifact + setup
# provenance.
#
# What this is a control FOR: the post-0.5.0 track investigates quantisation
# sensitivity (see results/SUMMARY.md quantisation investigation, commits
# 3969328 / 9b96394, and artifacts/quant-ledger-*). The Mei arms explore
# mixed-precision MLX quants (DWQ, mixed46); this hand pins the OFFICIAL
# ggml-org Q4_K_M conversion of the same family's 35B-A3B at a fixed revision
# on plain mainline llama.cpp, as the reference llama.cpp control arm. The
# retired configs/Qwen3.6-35B-A3B/gguf.yaml (unsloth UD-Q4_K_XL) stays
# untouched as historical evidence; this is a separate, freshly pinned arm,
# NOT a modification of it.
#
# No quality/throughput numbers are claimed anywhere in this file. The native
# plain-completion + tool-call canary that PASSED for this exact binary+model
# on 2026-09-13 is parent-session-attested provenance (see
# settings/completed_canary) and was NOT re-executed during this reconcile.
temperature: 0.6
reasoning_mode: thinking   # --reasoning on (explicit llama-server flag, canary-proven)
hermes_ops_max_tokens: 16384
  # Defensive thinking-mode cap, same pre-emptive rationale and value as
  # configs/Qwen3.6-35B-A3B-Uncensored/gguf.yaml (benchmark-v4 hermes_ops
  # fix): run_prompt.py's one-shot hermes_ops client has no
  # finish_reason=length continuation, so the default 4096-token cap risks
  # truncating this thinking-mode family before a final answer. Applied
  # defensively; NOT yet confirmed live for this config (no rows exist).
# OPTIONAL request-time generation profiles (2026-09-22, task-specific
# generation contract — per-model POLICY on the configs/README.md
# infrastructure). Every field is vendor-sourced (unsloth/Qwen3.6 card
# thinking-mode precise-coding preset; same values this config's launch
# already serves); see settings/generation_profiles_policy. reasoning_effort
# is never invented: the Qwen3.6 card documents no effort level, so the
# plan's explicit default for unspecified vendor effort applies ("medium"),
# never a guessed "high".
generation_profiles:
  capability:      # capability lane — the card's thinking-mode precise-coding
    temperature: 0.6          # preset (the repo's documented thinking
    top_p: 0.95               # operating point for this family).
    top_k: 20
    min_p: 0                  # vendor preset values, declared explicitly.
    presence_penalty: 0
    repetition_penalty: 1.0
    reasoning_effort: medium   # card documents no effort level -> medium per
                               # plan 7f5c67e7, recorded explicitly.
  practical:       # practical/medium comparison lane. The card defines only
    temperature: 0.6           # this one thinking preset and no effort
    top_p: 0.95                # levels, so this lane coincides with
    top_k: 20                  # capability by design; the lanes stay
    min_p: 0                   # distinct in config + per-row metadata.
    presence_penalty: 0
    repetition_penalty: 1.0
    reasoning_effort: medium
hermes_ops_generation_profile: capability
  # Explicit general/vendor default for Hermes Ops (plan 7f5c67e7): future
  # hermes_ops rows run at the capability lane instead of the historic
  # temperature=0 wire shape. Historic rows are append-only and untouched.
coding_reasoning_effort: medium
  # Model-specific coding profile: same explicit-effort policy for the
  # hermes-chat coding suites (card documents no effort level -> medium per
  # plan). Historic coding rows ran at the hermes/server default; this key
  # makes the lane explicit going forward.
inference_engine: llama.cpp   # plain mainline llama.cpp — the control binary,
                              # NOT the retired Homebrew-bottle build; see
                              # orchestration.server_binary + settings below
source_revision: baec3ebee244827cda0f4557eafa8b28f7545fa6  # ggml-org repo rev, pinned at download; verified live via HF API 2026-09-13
model_bytes: 20419565568
quant_family: GGUF Q4_K_M (official ggml-org k-quant, single-file, 20.4 GB)
context_cap: 65536

benchmark_launch_command: |
  # Absolute binary + absolute local model path so THIS machine reproduces it
  # exactly. Binary: official ggml-org/llama.cpp mainline build produced by
  # runner/setup_dspark_head.sh into runner/.dspark-head (gitignored, NOT
  # committed) — commit a302733, build 1, 2026-08-23, AppleClang 21.0.0
  # arm64; see settings/binary_build_provenance and orchestration.server_binary.
  # Model: local HF hub-cache snapshot of the verified public artifact
  # (already downloaded; do not re-download, do not use --hf-repo):
  #   repo ggml-org/Qwen3.6-35B-A3B-GGUF, revision baec3ebee..., file
  #   Qwen3.6-35B-A3B-Q4_K_M.gguf, sha256
  #   671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7
  #   (re-verified on-disk 2026-09-14 — blob == symlink target == HF LFS oid).
  # The runner appends its own identity alias (bench-<config_hash>) to the
  # last command line, and its guard refuses a launch block that already sets
  # a sampling seed (the check is a substring scan over the whole block,
  # comments included — so this comment must not name that flag literally).
  # Keep the last line a plain flag with no trailing backslash.
  /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server \
    --model /Users/tijs/.cache/huggingface/hub/models--ggml-org--Qwen3.6-35B-A3B-GGUF/snapshots/baec3ebee244827cda0f4557eafa8b28f7545fa6/Qwen3.6-35B-A3B-Q4_K_M.gguf \
    --host 127.0.0.1 --port 8017 \
    --ctx-size 65536 --parallel 1 --n-gpu-layers 99 --flash-attn on \
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 \
    --jinja --reasoning on --cache-prompt \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # Native tool_calls CONFIRMED for this exact binary+model combo by the
  # 2026-09-13 canary (see settings/completed_canary) — no proxy needed, same
  # family precedent as the retired Qwen3.6 gguf.yaml.

orchestration:
  raw_port: 8017          # shared with every other llama.cpp config — never
                          # run two local backends concurrently (unload_all.sh
                          # discipline)
  needs_proxy: false
  hermes_provider: qwen36-35b-gguf   # existing bench-profile entry, verified
    # 2026-09-14: api http://127.0.0.1:8017/v1, context_length 65536 (>= hermes's
    # 64K coding minimum). Its default_model still names the retired unsloth
    # UD-Q4_K_XL id — cosmetic: llama-server serves the loaded model regardless
    # of the requested model id, and run_bench's identity gate uses its own
    # bench-<config_hash> --alias (run_bench.server_command).
  server_binary: /Users/tijs/projects/local-model-bench/runner/.dspark-head/build/bin/llama-server
    # NOT the Homebrew llama.cpp (build 10470 / commit 34af94cd9, 2026-08-17).
    # This is the official ggml-org/llama.cpp mainline source build at commit
    # a302733 ("metal : clamp K extent in tensor API mat-mat kernel for K not
    # a multiple of 32 (#27450)", 2026-08-23) — newer than the bottle, built
    # via runner/setup_dspark_head.sh into runner/.dspark-head/ (gitignored).
    # Same codebase family as Homebrew's llama-server (official mainline, no
    # fork patches), so results stay comparable to historical `llama.cpp`
    # rows; the provenance is recorded because a build-commit gap is a real
    # confound if a comparison gets close.
  viable: full            # EXPLORATORY arm: runnable, but UNRANKED until a
    # full current-suite run exists (no log.jsonl rows under this hash yet).
    # Same convention as the DWQ/mixed46 Mei experiments (viable: full to
    # stay runnable, banner in known_gaps).

settings:
  - name: artifact_identity
    value: "ggml-org/Qwen3.6-35B-A3B-GGUF revision baec3ebee244827cda0f4557eafa8b28f7545fa6, file Qwen3.6-35B-A3B-Q4_K_M.gguf, 20419565568 bytes, sha256 671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7. Re-verified on-disk 2026-09-14: shasum -a 256 of the local blob equals the HF blob-store name, which equals the snapshots/<revision> symlink target — one authoritative value. Local snapshot: ~/.cache/huggingface/hub/models--ggml-org--Qwen3.6-35B-A3B-GGUF/snapshots/baec3ebee244827cda0f4557eafa8b28f7545fa6/Qwen3.6-35B-A3B-Q4_K_M.gguf (symlink -> ../../blobs/671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7). Revision confirmed live via HF API 2026-09-13 (lastModified 2026-07-16T18:27:09Z, apache-2.0, tags image-text-to-text/gguf)."
    source: "https://huggingface.co/ggml-org/Qwen3.6-35B-A3B-GGUF/commit/baec3ebee244827cda0f4557eafa8b28f7545fa6 + local shasum -a 256 of the blob (2026-09-14)."
  - name: quant (why the official Q4_K_M is the control)
    value: "Q4_K_M — llama.cpp's canonical k-quant medium variant (per ggml-org/llama.cpp GGUF quantization docs, Q4_K for ~2/3 of tensors and Q6_K for the rest; the reference-map quant a 'control' arm has to be, and what the MLX mixed/8-bit experiments (DWQ, mixed46) claim to mirror in bit placement). NOTE: no importance-matrix (imatrix) calibration is claimed here — vanilla Q4_K_M is not an imatrix-calibrated quant, and that distinction is left to the i-quant family. This is a provenance statement about which binary artifact is pinned, not a quality claim."
    source: "ggml-org/llama.cpp GGUF quantization docs; this repo's results/SUMMARY.md quantisation investigation (commits 3969328 / 9b96394) + artifacts/quant-ledger-audit-20260913.md."
  - name: temperature / top_p / top_k / min_p (thinking mode, precise coding preset)
    value: 0.6 / 0.95 / 20 / 0.0
    source: "Inherited unchanged from the retired configs/Qwen3.6-35B-A3B/gguf.yaml (same checkpoint, same family), which cited unsloth's Qwen3.6 'Thinking Mode - Precise Coding' preset (https://unsloth.ai/docs/models/qwen3.6): top_p/top_k/min_p identical to the general thinking preset, temperature 1.0 -> 0.6. Deliberately NOT the non-thinking instruct preset (temp 0.7, presence penalty 1.5): thinking stays ON, matching the model's own benchmarked mode."
  - name: generation_profiles_policy (capability / practical lanes, 2026-09-22)
    value: "capability = unsloth/Qwen3.6-35B-A3B card 'Thinking mode for precise coding tasks' preset (temperature 0.6 / top_p 0.95 / top_k 20 / min_p 0.0 / presence_penalty 0.0 / repetition_penalty 1.0 — the vendor values this config's launch already serves) + reasoning_effort medium. reasoning_effort: the Qwen3.6 card documents NO effort level, so per plan 7f5c67e7 medium is the explicit default for unspecified vendor effort — recorded out loud, never a silent assumption and never a guessed 'high'. practical = the SAME vendor preset + medium: the card defines only this one thinking preset, so the lane coincides with capability by design and stays distinct via per-row metadata. hermes_ops_generation_profile: capability = the explicit general/Hermes-Ops default for future rows (historic temperature=0 rows untouched; this supersedes the pre-existing known_gaps bullet about hardcoded temperature 0). coding_reasoning_effort: medium = the explicit coding-suite lane (historic coding rows ran at the hermes/server default without --reasoning)."
    source: "https://huggingface.co/unsloth/Qwen3.6-35B-A3B model card (Thinking mode for precise coding tasks preset: temperature=0.6, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0) + plan 7f5c67e7-b564-4df3-8209-14f7443b56e2 + configs/README.md generation_profiles section."
  - name: thinking / reasoning mode mechanism
    value: "--reasoning on (explicit llama-server flag, present in the pinned binary's --help). Qwen3.6's default chat template also enables thinking by default, but the 2026-09-13 canary launched with --reasoning on and produced reasoning + native tool calls, so that exact flag is the proven-working explicit setting for this binary. Recorded as its own labeled setting per this repo's standing policy that reasoning mode is never implicit."
    source: "argv of the live canary server (PID 83305, port 8025) + llama-server --help (both observed 2026-09-14) + AGENTS.md reasoning-mode policy."
  - name: context_length
    value: "65536 (native larger; capped at this repo's standard benchmark ceiling and hermes's >=64K hard minimum, same as every A3B config)."
    source: "AGENTS.md hermes hard-minimum note; model card."
  - name: binary_build_provenance
    value: "runner/.dspark-head/build/bin/llama-server — official ggml-org/llama.cpp mainline source build. `llama-server --version` (2026-09-14): 0.1.2-dev (build 1, commit a302733), built with AppleClang 21.0.0.21000101 for Darwin arm64; checkout HEAD a302733 'metal : clamp K extent in tensor API mat-mat kernel for K not a multiple of 32 (#27450)' from https://github.com/ggml-org/llama.cpp. Built 2026-08-23 via runner/setup_dspark_head.sh (gitignored, NOT committed). Reasons it is the control binary rather than Homebrew's llama.cpp: the Homebrew bottle used by historical GGUF rows is build 10470 (commit 34af94cd9, 2026-08-17); this mainline build (2026-08-23) is the same official codebase, newer, and already proven live with this exact model file by the canary. Every launch flag in benchmark_launch_command is present in this binary's `--help` (verified 2026-09-14). Inference engine label stays `llama.cpp` (plain mainline, no fork/spec patches), so leaderboard grouping matches historical rows."
    source: "`./runner/.dspark-head/build/bin/llama-server --version`, `git -C runner/.dspark-head log --oneline -1`, `git -C runner/.dspark-head remote -v`, runner/setup_dspark_head.sh, llama-server --help."
  - name: launch flags (parallel / n-gpu-layers / flash-attn / jinja / cache-prompt / timeout)
    value: "--parallel 1 (single slot; the server default of 4 multiplies KV-cache memory and is a real Metal OOM risk at 65536 ctx with a 20.4 GB model on 32 GB — same finding as configs/Qwen3.8-27B/gguf-dflash2.yaml's --parallel entry); --n-gpu-layers 99 (full Metal offload, explicit); --flash-attn on (reduces KV memory at long ctx; --flash-attn takes on|off|auto in this binary); --jinja (use the GGUF's embedded Qwen3.6 chat template, proven by the canary — no community template fix needed, closing the retired gguf.yaml's open item); --cache-prompt (prefix reuse, mirrors Mei's cache-reuse arm); --timeout 1800 (server-side request cap)."
    source: "argv of the live canary server (PID 83305, port 8025, observed 2026-09-14) for the base set; configs/Qwen3.8-27B/gguf-dflash2.yaml for the --parallel 1 reasoning; llama-server --help for each flag."
  - name: completed_canary (2026-09-13, pre-config live probe — parent-attested, NOT re-executed here)
    value: "This EXACT binary + EXACT pinned model file served: /v1/models HTTP 200; a plain completion returned LLAMA_OK (exact content, HTTP 200); a native tool-call request returned get_weather({\"city\": \"Amsterdam\"}) — native streaming-compatible tool_calls confirmed, thinking on. The canary server (PID 83305) was launched on port 8025, not 8017, at ctx 8192 / temp 1.0 with the base flag set (--parallel 1 --n-gpu-layers 99 --flash-attn on --jinja --reasoning on --cache-prompt, plus a fixed sampling seed). As of this reconcile (2026-09-14) that server is STILL LIVE on 8025 with this exact binary+model — a read-only GET /v1/models returns this exact snapshot path, corroborating identity and load. This proves admission capability only; it is NOT a benchmark result, and no full current-suite run has been completed. The canary was deliberately NOT re-executed and its server was left untouched by this commit."
    source: "Parent-session canary record handed to this config task; corroborated 2026-09-14 by direct observation of the live process argv (PID 83305, port 8025) and a read-only /v1/models GET on it."
known_gaps:
  - "EXPLORATORY / UNRANKED: no results/log.jsonl rows exist for this config yet. Full current-suite benchmark (sanity, hermes_ops, all four coding suites incl. the kiem_mini suite's testwrite task) is PENDING and is the whole point of the arm. Until it lands, treat every line of this file as setup provenance, not a result."
  - "Canary evidence is inherited from the parent session (whose server is observed live on 8025) and was NOT re-executed during this reconcile. run_bench.py re-gates anyway at run time (assert_serving_expected_model with a bench-<hash> --alias + plain-completion check), so a future run re-verifies independently."
  - "Generation lanes (2026-09-22): the one-shot hermes_ops path NO LONGER runs at hardcoded temperature 0 for this config — generation_profiles + hermes_ops_generation_profile: capability make the card's precise-coding thinking preset + explicit medium effort the general/Hermes-Ops operating point for future rows (see settings/generation_profiles_policy). Sanity (the determinism gate) and the no-profile lane keep the historic temperature=0 shape; coding suites inherit the launch flags plus coding_reasoning_effort: medium. Historic rows are untouched; the lane is recorded per row (generation_profile / generation_overrides / generation)."
  - "Port 8017 is shared with every other llama.cpp config; never run concurrently, and unload_all.sh must be allowed to reclaim it. The pre-existing canary server on 8025 is another local backend — one backend at a time."
  - "hermes_provider qwen36-35b-gguf's default_model still names the retired unsloth UD-Q4_K_XL artifact id. Cosmetic for llama-server (it ignores the requested model id; the identity gate is run_bench's --alias), but worth knowing when reading provider state."
  - "hermes_ops_max_tokens 16384 is applied defensively (thinking-mode family) and is not yet confirmed live for this config — no hermes_ops rows exist to confirm or deny truncation yet."
  - "Qwen3.6 is a conditional-generation (VLM) checkpoint; this GGUF leg exercises the text/tool path only (no image conditioning), same scope as every other config in this repo."
  - "Official-ggml-org Q4_K_M vs retired-UD-Q4_K_XL is intentionally a two-way change from the historical Unsloth leg (artifact source AND serving build). If a full-suite delta appears versus the historical Unsloth rows, attribute it to that pair, not to either factor alone."
