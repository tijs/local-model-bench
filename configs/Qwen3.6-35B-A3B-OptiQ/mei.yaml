model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
# OptiQ mixed-precision quant of Qwen3.6-35B-A3B — the first calibrated-quant
# MLX candidate on the post-0.5.0 Qwen3.6 research track, the scheme-aware arm
# alongside the official GGUF Q4_K_M llama.cpp control (gated live 2026-09-14).
#
# CANONICAL SAFE-GATE CONFIG. This is the exact control set that passed the
# live gate on the pinned snapshot (evidence: artifacts/qwen36-optiq-*-20260914*,
# raw probe JSONs + note). It deliberately does NOT use --model-profile, does
# NOT enable VMLX_ENABLE_UNSAFE_COMPILE, and pins --load-mmap false — the
# post-mortem of the FIRST wrapper run, which did name the profile and failed
# Metal Insufficient Memory (see known_gaps; do not hide that history).
#
# UNRANKED: this commit records a reproducible candidate + gate evidence only.
# No results/log.jsonl row, no leaderboard change. A full benchmark run of this
# config is required before the model can be admitted as a comparable Mei result.
#
# PORT NOTE: port 8024 is shared with the Ornith / Qwen3.6 stock / Nemotron
# Mei configs. NEVER run two of them concurrently.
temperature: 0.6
reasoning_mode: thinking   # emit-reasoning true (native reasoning_content); Qwen3.8 sibling convention
inference_engine: mei
mei_commit: 44461ffdf8dca836b624b2d0d268c800dedea05e  # vmlx-swift pin found IN the gate's scratch build (mei-build-qwen36-optiq-050/checkouts/vmlx-swift), verified 2026-09-14 — the 0.5.0-shipped engine
mei_source_commit: 1518e7010875ff5fdfca2cfc29bb4a4f3bf31aeb  # Mei tag v0.5.0 (== research/sync-bisect HEAD, vmlx 44461ffd) — the shipped 0.5.0 baseline the gate binary reports (`mei 0.5.0`); rebuild from this state for a fresh scratch build
source_revision: 70a3aa32c7feef511182bf16aa332f37e8d82014  # mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit pinned HF commit — the snapshot this config serves
model_bytes: 22155958660   # dereferenced total of the pinned snapshot's 15 entries (5 shards + config/tokenizer/metadata/template); ~20.6 GiB
quant_family: "OptiQ mixed precision — optiq_mixed_precision, group 64 affine; per-layer 8-bit high-bit / 4-bit low-bit (optiq_metadata.json: 392 high-bit + 118 low-bit entries, target 4.5 bpw, achieved 4.506152583685804; reference uniform_4bit)"
context_cap: 65536
prefill_step_size: 512
# The gate's exact value (Mei auto profile server line: "requested auto,
# prefill 512"). NOT the 1024 the pre-0.5.0 sibling configs converged on —
# that sweep was measured on the 0.4.2 build for a different bundle; this
# config reproduces what was actually gated.
tool_call_path: native_mei_requires_live_probe
# BEFORE RUNNING: start_mei_server.sh builds from the --mei-repo WORKING TREE,
# so ~/projects/mei must be checked out on tag v0.5.0 (1518e701, vmlx
# 44461ffd) to rebuild the gate's scratch build (mei-build-qwen36-optiq-050).
# The gate itself ran that PREBUILT binary — rebuilding is only needed after a
# clean. Check with: git -C ~/projects/mei describe --tags --exact-match HEAD
benchmark_launch_command: |
  env VMLX_ENABLE_UNSAFE_COMPILE=0 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 BENCH_NO_FUSED_GATE_UP=1 MLX_SAFETENSORS_MMAP=0 \
  bash runner/start_mei_server.sh --model-dir /Users/tijs/.cache/huggingface/hub/models--mlx-community--Qwen3.6-35B-A3B-OptiQ-4bit/snapshots/70a3aa32c7feef511182bf16aa332f37e8d82014 \
    --served-model-id mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit --port 8024 --context-cap 65536 \
    --prefill-step-size 512 \
    --kv-cache-dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-qwen36-optiq-safe \
    --memory-limit-bytes 30000000000 \
    --compiled-decode false --load-mmap false \
    --temperature 0.6 --top-p 0.95 --top-k 20 --emit-reasoning true --cache-reuse true \
    --build-dir /Users/tijs/.local/share/local-model-bench/mei-build-qwen36-optiq-050 \
    --mei-repo /Users/tijs/projects/mei
benchmark_endpoint: http://127.0.0.1:8024/v1

orchestration:
  raw_port: 8024          # SHARED with other Mei configs — never run concurrently
  needs_proxy: false   # native tool_calls required; probe_mei.py gates this.
  hermes_provider: bench-mei   # bench-profile provider wired to port 8024;
                               # run_fixture_suite passes served_model_id explicitly.
  served_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
  viable: full

settings:
  - name: artifact_identity
    value: "mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit @ 70a3aa32c7feef511182bf16aa332f37e8d82014 — pinned HF snapshot at ~/.cache/huggingface/hub/models--mlx-community--Qwen3.6-35B-A3B-OptiQ-4bit/snapshots/70a3aa32c7feef511182bf16aa332f37e8d82014 (15 entries, dereferenced total 22,155,958,660 bytes, ~20.6 GiB): 5 safetensors shards, config.json, generation_config.json, kv_config.json, model.safetensors.index.json, tokenizer.json, tokenizer_config.json, chat_template.jinja, optiq_metadata.json, optiq, README.md. arch Qwen3_5MoeForConditionalGeneration, model_type qwen3_5_moe. Served /v1/models identity verified EXACT on the gate."
    source: "Gate probe (artifacts/qwen36-optiq-native-gate-20260914.json: models/plain/stream/tool/tool_stream all 200, every response model==mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit); snapshot listing + sha-pinned revision verified 2026-09-14."
  - name: vmlx_swift_pin
    value: "44461ffdf8dca836b624b2d0d268c800dedea05e (shipping 0.5.0 pin; read directly from the gate build's vmlx-swift checkout)"
    source: "mei-build-qwen36-optiq-050/checkouts/vmlx-swift git rev-parse HEAD (verified 2026-09-14)."
  - name: mei_source_pin
    value: "1518e7010875ff5fdfca2cfc29bb4a4f3bf31aeb — Mei tag v0.5.0; gate binary reports `mei 0.5.0`. --build-dir mei-build-qwen36-optiq-050 is the gate's prebuilt scratch build."
    source: "mei --version on the gate binary (2026-09-14); tag mapping as in configs/Qwen3.6-35B-A3B-DWQ/mei.yaml."
  - name: quant_family
    value: "optiq_mixed_precision (base_model Qwen/Qwen3.6-35B-A3B, reference uniform_4bit): group 64 affine; per-layer allocation in optiq_metadata.json — 392 high-bit (8-bit) + 118 low-bit (4-bit) entries, target 4.5 bpw, achieved 4.506152583685804. config.json carries both `quantization` and `quantization_config` (structurally identical, 515 keys, default bits 4 / group 64 / affine) — vmlx BaseConfiguration's `quantization` support is sufficient to load this file (metadata-correction note, 2026-09-14)."
    source: "optiq_metadata.json + config.json in the pinned snapshot; kiem notes qwen36-optiq-provenance-review / qwen36-optiq-metadata-correction (2026-09-14)."
  - name: safe_gate_controls
    value: "EXACT gate control set: env VMLX_ENABLE_UNSAFE_COMPILE=0 VMLX_FUSED_GATE_UP_CACHE_LIMIT_BYTES=0 BENCH_NO_FUSED_GATE_UP=1 MLX_SAFETENSORS_MMAP=0; flags --compiled-decode false --load-mmap false; NO --model-profile (Mei auto: server line 'optimization profile ornith (requested auto, prefill 512, compiled-decode false, kv-window 0, ssm-anchors 0)', 'profile applied max-tokens 4096, unsafe-compile 0, fused-gate-up-limit 0'); --prefill-step-size 512; --context-cap 65536; --memory-limit-bytes 30000000000; --kv-cache-dir mei-runtime/kv-qwen36-optiq-safe. Do NOT 'helpfully' add a profile or unsafe-compile=1 to this config — the first wrapper run did exactly that and OOM'd (known_gaps)."
    source: "/tmp/qwen36-optiq-mei-safe-20260914.log (server stdout of the load-success run, 2026-09-14T05:5xZ); launch-command reconstruction cross-checked against every control in the gate record."
  - name: load_path
    value: "mmap=false — weights materialized into RAM at load ([Load] dtype-materialisation bf16=true mmap=false). MLX_SAFETENSORS_MMAP=0 (env) + --load-mmap false (explicit Mei flag, forwarded by the wrapper only when given) both pinned. Gate result: memory after load active 22,155,076,876 bytes (~21.2 GiB), cache 0, peak 0, limit 30,000,000,000."
    source: "/tmp/qwen36-optiq-mei-safe-20260914.log; per-request mei_memory_active_bytes in artifacts/qwen36-optiq-native-gate-20260914.json (23.09–23.18 GB across probes)."
  - name: unaligned_shards
    value: "5/5 weight shards NOT naturally aligned (Mei load WARNING). The default mmap path copies unaligned tensors into RAM — on this bundle that realignment (~16.6 GiB of temporary copies) plus the profile's unsafe-compile=1 exhausted the GPU allocator in the first wrapper run. mmap=false avoids the copy tax outright at the cost of materialized load; repacking with tools/align_safetensors.py (payload unchanged) is the future path back to mmap."
    source: "/tmp/qwen36-optiq-mei-safe-20260914.log WARNING line; failure record /tmp/qwen36-optiq-mei-server-20260914.log (Trace/BPT trap)."
  - name: kv_cache
    value: "fp16 KV with EXPLICIT disk-tier dir /Users/tijs/.local/share/local-model-bench/mei-runtime/kv-qwen36-optiq-safe — qwen3_5_moe hybrid (MambaCache + RotatingKVCache) needs the disk tier for cross-turn restore; gate verified growing-conversation reuse: cached_tokens 0 -> 1076 -> 1092 -> 1108."
    source: "/tmp/qwen36-optiq-mei-safe-20260914.log ('prefix cache enabled (paged in-memory + disk at …kv-qwen36-optiq-safe; topology layers=40 kvLayers=10 mambaLayers=30)'); artifacts/qwen36-optiq-cache-probe-20260914.json."
  - name: context_and_generation_caps
    value: "context cap 65536 (exact-gate probe set); max-tokens NOT set — the 0.5.0 auto profile applies 4096 (gate server line 'listening … max-tokens 4096'). This reproduces the gate as-run; it predates the 2026-09-10 8192 runaway-bound convention, which 0.5.0's 4096 profile default already subsumes."
    source: "/tmp/qwen36-optiq-mei-safe-20260914.log; artifacts/qwen36-optiq-native-gate-20260914.json (65536-boundary context probes in the gate's results set)."
  - name: in_process_kv_reuse
    value: "cache-reuse true — growing-conversation cached_tokens 1076/1092/1108 verified live (cache probe); repeat-prefix cache_1/cache_2 probes also 200 with cached 0 on identical-prefix (re-prefilled) requests."
    source: "artifacts/qwen36-optiq-cache-probe-20260914.json; artifacts/qwen36-optiq-native-gate-20260914.json."
  - name: native_tool_call_parser
    value: "native tool_calls verified live BOTH non-streaming (tool probe, tool_names [get_weather], finish_reason tool_calls) and streaming (tool_stream probe, stream_tool_names [get_weather]); reasoning_content present in the stream probe. No benchmark proxy/parser shim."
    source: "artifacts/qwen36-optiq-native-gate-20260914.json (summary labels tool/tool_stream)."
  - name: benchmark_sampling
    value: "temperature 0.6, top-p 0.95, top-k 20, emit-reasoning true, cache-reuse true — matches the Ornith/stock-Qwen3.6 Mei convention. Sanity/hermes_ops suites still run at temperature 0 (run_prompt.py hardcode, see tasks/SCHEMA.md)."
    source: "configs/Ornith-1.5-35B-A3B/mei.yaml + runner/start_mei_server.sh defaults; gate sampling identical to the launch command above."

known_gaps:
  - "EXPLORATORY CANDIDATE, NOT RANKED. The safe gate passed (exact served identity, plain+streaming generation, native streaming + non-streaming get_weather tool calls, growing-conversation cache reuse, 65536 context probes, fixed 30 GB memory limit) — evidence is in artifacts/qwen36-optiq-native-gate-20260914.json + artifacts/qwen36-optiq-cache-probe-20260914.json + the note, NOT in any benchmark log. A full benchmark run of this config is REQUIRED before comparability; this commit changes no results/ row."
  - "FIRST WRAPPER RUN FAILED — DO NOT HIDE: an initial run naming --model-profile qwen3.6-35b-a3b-text (prefill 1024, kv-cache-dir mei-runtime/kv-qwen36-optiq) inherited the profile's unsafe-compile=1 and the default mmap path's unaligned-shard realignment (~16.6 GiB temporary copies) and died with Metal Insufficient Memory (Trace/BPT trap; /tmp/qwen36-optiq-mei-server-20260914.log). The safe controls above are that post-mortem. Any future edit that re-adds the profile or unsafe-compile=1 must re-verify against a live load first."
  - "5/5 shards are NOT naturally aligned (Mei WARNING). This config keeps the gated mmap=false materialized load; an aligned repack (tools/align_safetensors.py, payload-unchanged) is the documented future path to mmap and lower load memory."
  - "Provenance caveats (provenance-review note 2026-09-14): the repo README's own table reports OptiQ BELOW uniform 4-bit on MMLU (83.7 vs 84.6), GSM8K (87.9 vs 89.4), IFEval (72.6 vs 73.0) — gains only BFCL and HashHop; the sensitivity reference falls back to uniform-4-bit 'if bf16 doesn't fit' so the allocation is not proven calibrated against a higher-precision teacher; the calibration mix has no content hash / evaluator revision / quantizer build hash, so the calibration chain is not independently reproducible; the README KL row is malformed. Treat scores from the card as untrusted; the config's own gate numbers are the only local evidence."
  - "Qwen3.6 is a conditional-generation / vision-language checkpoint (qwen3_5_moe, image_token_id present). The gate exercised the TEXT/TOOL path only; image conditioning and the bundled MTP path were NOT benchmarked. Report results with this scope caveat."
  - "Port 8024 is ALSO assigned to Ornith / stock-Qwen3.6 / Nemotron Mei configs. Never run concurrently; a single local Mei server per run (enforced by unload_all.sh + the exact served_model_id identity gate)."
  - "model-dir is the pin-revisioned HF CACHE snapshot (~/.cache/huggingface/hub/...). Blob cleanup outside this repo could remove it; re-fetch the exact revision 70a3aa32 with hf before any future run. The config itself carries no weights."
  - "Gate ran the PREBUILT scratch binary mei-build-qwen36-optiq-050 (mei 0.5.0, vmlx 44461ffd verified in its checkout). Rebuilding requires ~/projects/mei on tag v0.5.0 (1518e701) and re-verifying the load gate — the binary this config cites is the one that produced the evidence."
