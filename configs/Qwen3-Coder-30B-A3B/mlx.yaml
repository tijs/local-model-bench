model: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
backend: mlx
# Added 2026-08-21 (adversarial review finding H7): reasoning-mode and
# temperature differ across models presented in one ranked leaderboard
# table with no column showing it — e.g. Qwen3.8-27B vs Qwen3.8-27B-Ridge
# looked like a quant comparison but also differed in reasoning mode,
# temperature, and presence_penalty (three confounds, one conclusion).
# These two fields are read by build_leaderboard.py and shown as columns;
# keep them in sync with benchmark_launch_command by hand.
temperature: 0.7
reasoning_mode: instruct
framework: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) ${BENCH_PYTHON:-/Users/tijs/.cocore/python/bin/python} -m vllm_mlx.server \
    --model mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.7 --default-top-p 0.8 --default-top-k 20 \
    --timeout 1800
  # then, separately (proxy required — see below):
  BENCH_TOOL_PARSER=qwen3_coder BENCH_PROXY_UPSTREAM=http://127.0.0.1:8018 \
    BENCH_PROXY_PORT=8015 python runner/bench_local_proxy.py

benchmark_endpoint: http://127.0.0.1:8015/v1
  # PROXY REQUIRED, unlike Qwen3.8-27B. CONFIRMED LIVE 2026-08-20:
  # vllm-mlx has no server-side tool-call parser (only --reasoning-parser
  # for <think> extraction), so this model's raw tool-call format
  # (<tool_call><function=NAME><parameter=ARG>VALUE</parameter></function>
  # </tool_call> — vLLM's "qwen3_xml" format, confirmed by reading the
  # model's own shipped reference parser,
  # qwen3coder_tool_parser.py, cached at
  # ~/.cache/huggingface/hub/models--mlx-community--Qwen3-Coder-30B-A3B-Instruct-4bit/
  # snapshots/*/qwen3coder_tool_parser.py) comes back as plain text in
  # `content` with an EMPTY tool_calls array from the raw endpoint. This
  # is DIFFERENT from Qwen3.8-27B, which gets native tool_calls straight
  # from vllm-mlx (confirmed: <tool_call>{json}</tool_call> hermes-style
  # format works there without a proxy) — tool-call format is NOT uniform
  # across the Qwen model family, don't assume one config's answer applies
  # to the next Qwen variant. First discovered as a real hermes_ops
  # regression (1/3 vs GGUF's 3/3 on the identical model, both empty
  # tool_calls arrays for selection/chaining) — root-caused via a direct
  # curl against the raw endpoint before accepting it as a genuine model
  # weakness, per this benchmark's standing "verify before trusting"
  # discipline. New parser added to bench_local_proxy.py
  # (`_parse_qwen3_coder_tool_calls`, registered as `qwen3_coder`),
  # unit-tested against the exact captured raw sample, then confirmed
  # end-to-end via a live proxied curl request before rerunning the suite.
  # All 5 pre-fix log rows for this model+backend were invalid (empty
  # tool_calls from the raw port) and were removed.
  #
  # UPDATE 2026-08-20: vllm-mlx 0.4.1 (see AGENTS.md's version note) adds
  # a NATIVE qwen3_coder parser (--enable-auto-tool-choice --tool-call-parser
  # qwen3_coder via the newer `vllm-mlx serve` CLI). Deliberately NOT
  # switched to it for this benchmark's official results — that native
  # parser has a confirmed real bug in STREAMING mode specifically (which
  # run_prompt.py always uses), verified via a controlled streaming-vs-
  # non-streaming A/B test. The bench_local_proxy.py path here always
  # parses the complete non-streaming response, so it cannot hit that
  # bug — keep using it for this config even though a native option now
  # exists.

orchestration:
  raw_port: 8018
  needs_proxy: true
  proxy_parser: qwen3_coder
  proxy_port: 8015
  hermes_provider: qwen3coder-mlx
  viable: full

settings:
  - name: quant
    value: 4-bit (mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit)
    source: "standard policy for this model size, matches Qwen3.8-27B's
      MLX quant choice."
  - name: temperature / top_p / top_k
    value: 0.7 / 0.8 / 20
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card — non-thinking-mode settings (this model never emits <think>
      blocks, unlike Qwen3.8-27B which defaults to thinking mode ON)."
  - name: context_length
    value: 65536 (native 262144, extendable to 1M via YaRN — capped per
      hermes's >=64K hard minimum and this benchmark's standard ceiling)
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card + AGENTS.md hermes hard-minimum note."
  - name: architecture
    value: "MoE, 30.5B total / 3.3B active — expect a large speed benefit
      over dense 27-30B models on this hardware, similar to Ornith
      1.5-35B-A3B's GGUF result (29.4 tok/s vs ~6-8 tok/s for dense 27B
      Qwen models)."
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card."
  - name: chat_template
    value: "NOT applying froggeric's Qwen-Fixed-Chat-Templates fix here —
      that fix specifically targets Qwen3.5/3.6/3.8's reasoning_effort/
      thinking-mode template bugs. This model has no thinking mode at all,
      so the fix's stated bugs don't apply; using the model's own official
      template unmodified."
    source: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates
      docs (scope limited to thinking-capable Qwen3.5+ models)."

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — these
    settings only apply to hermes-chat-driven coding suites."
  - "bench_local_proxy.py's qwen3_coder parser doesn't have access to each
    tool's declared JSON parameter types (unlike the reference vLLM
    parser, which uses the request's `tools` schema for int/float/bool/
    object coercion) — it does its own best-effort numeric/bool guessing
    instead. Fine for this benchmark's grading (checks argument values,
    not Python types), but a config/object-typed argument could come back
    as a plain string where the reference parser would return structured
    JSON. Note if a task ever fails specifically on argument *type*."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
