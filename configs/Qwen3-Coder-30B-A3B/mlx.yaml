model: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
backend: mlx
framework: vllm-mlx

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) /Users/tijs/.cocore/python/bin/python -m vllm_mlx.server \
    --model mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit --host 127.0.0.1 --port 8018 \
    --max-request-tokens 65536 --max-tokens 65536 --continuous-batching \
    --default-temperature 0.7 --default-top-p 0.8 --default-top-k 20 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8018/v1
  # tool_call_parser assumed native per the Qwen3.8-27B precedent (same
  # family, same vllm-mlx backend) — spot-check before trusting results,
  # per standing policy.

settings:
  - name: quant
    value: 4-bit (mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit)
    source: "standard policy for this model size, matches Qwen3.8-27B's
      MLX quant choice."
  - name: temperature / top_p / top_k
    value: 0.7 / 0.8 / 20
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card — non-thinking-mode settings (this model never emits <think>
      blocks, unlike Qwen3.8-27B which defaults to thinking mode ON)."
  - name: context_length
    value: 65536 (native 262144, extendable to 1M via YaRN — capped per
      hermes's >=64K hard minimum and this benchmark's standard ceiling)
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card + AGENTS.md hermes hard-minimum note."
  - name: architecture
    value: "MoE, 30.5B total / 3.3B active — expect a large speed benefit
      over dense 27-30B models on this hardware, similar to Ornith
      1.5-35B-A3B's GGUF result (29.4 tok/s vs ~6-8 tok/s for dense 27B
      Qwen models)."
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card."
  - name: chat_template
    value: "NOT applying froggeric's Qwen-Fixed-Chat-Templates fix here —
      that fix specifically targets Qwen3.5/3.6/3.8's reasoning_effort/
      thinking-mode template bugs. This model has no thinking mode at all,
      so the fix's stated bugs don't apply; using the model's own official
      template unmodified."
    source: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates
      docs (scope limited to thinking-capable Qwen3.5+ models)."

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — these
    settings only apply to hermes-chat-driven coding suites."
  - "Native tool_calls assumed from the Qwen3.8-27B MLX precedent, not yet
    independently re-verified for this specific checkpoint at time of
    writing — confirm via a raw run_prompt.py spot-check before trusting
    hermes_ops/coding results."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
