model: unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M
backend: gguf
framework: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M \
    --host 127.0.0.1 --port 8017 \
    --temp 0.7 --top-p 0.8 --top-k 20 --repeat-penalty 1.05 \
    --ctx-size 65536 \
    --timeout 1800

benchmark_endpoint: http://127.0.0.1:8017/v1
  # native tool_calls expected (Qwen family, llama-server) — verify live
  # before trusting hermes_ops/coding results, per standing policy for
  # every new model+backend combo.

orchestration:
  raw_port: 8017
  needs_proxy: false
  hermes_provider: qwen3coder-gguf
  viable: full

settings:
  - name: temperature / top_p / top_k / repeat_penalty
    value: 0.7 / 0.8 / 20 / 1.05
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card, recommended generation params. Distinct from Qwen3.8-27B's
      settings (1.0/0.95/20): this model 'supports only non-thinking mode
      and does not generate <think></think> blocks' — non-thinking Qwen
      models use lower temperature than thinking-mode ones."
  - name: context_length
    value: 65536 (native 262144, extendable to 1M via YaRN — capped here
      per hermes's >=64K hard minimum and this benchmark's standard ceiling)
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card + AGENTS.md hermes hard-minimum note."
  - name: architecture
    value: "MoE, 30.5B total / 3.3B active (8 of 128 experts routed) —
      expect GGUF/llama.cpp speed closer to a 3-4B dense model than a 30B
      dense model, similar sparse-activation benefit already observed with
      Ornith 1.5-35B-A3B."
    source: "https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct model
      card."
  - name: quant
    value: Q4_K_M (unsloth build — no bartowski GGUF exists for this model
      at time of writing, unsloth is the standard fallback per configs/README
      quant policy)
    source: "https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"

known_gaps:
  - "run_prompt.py hardcodes temperature=0 for sanity/hermes_ops — these
    model-card-recommended settings only apply to the hermes-chat-driven
    coding suites, per this benchmark's established design (see
    tasks/SCHEMA.md)."
  - "No bartowski quant exists for this specific model — using unsloth's
    standard (non-Dynamic) GGUF build for the primary result, consistent
    with the quant-source policy for any model bartowski hasn't covered."

last_updated: 2026-08-20
last_verified_against_docs: 2026-08-20
