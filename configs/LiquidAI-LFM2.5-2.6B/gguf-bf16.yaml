model: LiquidAI/LFM2.5-2.6B-GGUF:BF16
# Added 2026-08-23 — the other direction of the quant-matching gap Tijs
# flagged: the plain gguf.yaml (Q8_0) was being compared against mlx.yaml
# (bf16, full precision) as if they were the same quant. This config goes
# the other way — full-precision GGUF — to directly match mlx.yaml's own
# bf16 weights, completing the matrix alongside mlx-8bit.yaml (which goes
# the other direction: MLX at Q8_0 to match this directory's plain gguf.yaml).
temperature: 0.1
reasoning_mode: n/a
inference_engine: llama.cpp

benchmark_launch_command: |
  HF_TOKEN=$(cat ~/.cache/huggingface/token) llama-server \
    --hf-repo LiquidAI/LFM2.5-2.6B-GGUF:BF16 \
    --host 127.0.0.1 --port 8016 \
    --temp 0.1 --top-k 50 --repeat-penalty 1.1

benchmark_endpoint: http://127.0.0.1:8016/v1
  # No proxy needed — same as gguf.yaml (Q8_0 sibling), same model/
  # template, only the quant differs.

orchestration:
  raw_port: 8016
  needs_proxy: false
  hermes_provider: lfm26b-gguf-bf16   # needs registering in
    # ~/.hermes/profiles/bench/config.yaml before first coding-suite use.
  viable: full

settings:
  - name: quant
    value: "BF16 (official LiquidAI/LFM2.5-2.6B-GGUF), 5.40GB per the HF
      models API — full precision, matching configs/LiquidAI-LFM2.5-2.6B/
      mlx.yaml's bf16 weights exactly, for a genuine same-precision
      GGUF-vs-vllm-mlx comparison (the plain gguf.yaml sibling is Q8_0,
      which is NOT the same precision as that mlx.yaml config)."
    source: "https://huggingface.co/LiquidAI/LFM2.5-2.6B-GGUF — file
      listing checked 2026-08-23 (LFM2.5-2.6B-BF16.gguf, 5.40GB)."
  - name: temperature / top_k / repetition_penalty
    value: 0.1 / 50 / 1.1
    source: "Same as configs/LiquidAI-LFM2.5-2.6B/gguf.yaml — a checkpoint
      property, not quant- or engine-specific, so unchanged here."
  - name: context_length
    value: 131072 (n_ctx_train, same default as gguf.yaml — no --ctx-size
      flag needed)
    source: "Same as configs/LiquidAI-LFM2.5-2.6B/gguf.yaml."

known_gaps:
  - "Native GGUF tool_calls assumed from the gguf.yaml (Q8_0) precedent —
    confirm via a live spot-check before trusting."
  - "hermes_provider entry not yet added to
    ~/.hermes/profiles/bench/config.yaml — do that before the first
    coding-suite run."
  - "Never run live as of authoring."

last_updated: 2026-08-23
